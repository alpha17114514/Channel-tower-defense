function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle=TC.bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  if(screenShake>0){ctx.save();ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake);screenShake*=0.9;if(screenShake<0.5)screenShake=0;}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=grid[r][c],x=c*CELL_SIZE,y=r*CELL_SIZE;
    /* ★ 坑洞背景 */
    
    if(cell.type==='obstacle'){
      ctx.fillStyle=TC.obstacle;ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
      ctx.fillStyle='#ddd';ctx.font='14px sans-serif';ctx.textAlign='center';
      ctx.fillText(OBSTACLE_TYPES[cell.obstacleType]?.icon||'?',x+12,y+16);
      if(cell.obstacleMaxHP>0&&cell.obstacleHP<cell.obstacleMaxHP){
        const barW=CELL_SIZE-4,barH=3,barX=x+2,barY=y+CELL_SIZE-5;
        ctx.fillStyle='#333';ctx.fillRect(barX,barY,barW,barH);
        const hpR=cell.obstacleHP/cell.obstacleMaxHP;
        ctx.fillStyle=hpR>0.5?'#44ff44':hpR>0.25?'#ffaa00':'#ff4444';
        ctx.fillRect(barX,barY,barW*hpR,barH);
      }
    } else if(cell.type==='tower'){
  if(cell.isMirrorTower){
    ctx.fillStyle='#3a1038';
    ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
    ctx.strokeStyle='rgba(255,80,255,0.9)';
    ctx.lineWidth=2;
    ctx.setLineDash([4,2]);
    ctx.strokeRect(x+2,y+2,CELL_SIZE-4,CELL_SIZE-4);
    ctx.setLineDash([]);
  } else {
    ctx.fillStyle=TC.tower;
    ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
  }
  if(cell.isMirrorTower){ctx.shadowColor='#ff44ff';ctx.shadowBlur=10;}
  ctx.fillStyle=cell.overloadTimer>0?'#ff6644':(cell.isMirrorTower?'#ff88ff':TC.gold);
  ctx.font='14px sans-serif';ctx.textAlign='center';
  ctx.fillText(TOWER_TYPES[cell.towerType]?.icon||'?',x+12,y+16);
  ctx.shadowBlur=0;
  if(cell.isMirrorTower){
    ctx.fillStyle='#ff44ff';
    ctx.font='bold 9px sans-serif';
    ctx.textAlign='right';
    ctx.fillText('M',x+CELL_SIZE-3,y+9);
    ctx.textAlign='center';
  }    // ★ v10.4 显示 debuff 图标
      if(cell.debuffs){
        let dy = y + 4;
        if(cell.debuffs.weak){ ctx.fillStyle='#ff6666'; ctx.font='9px sans-serif'; ctx.fillText('⬇',x+4,dy); dy+=10; }
        if(cell.debuffs.slow){ ctx.fillStyle='#88ccff'; ctx.font='9px sans-serif'; ctx.fillText('⏱',x+4,dy); dy+=10; }
        if(cell.debuffs.blind){ ctx.fillStyle='#999'; ctx.font='9px sans-serif'; ctx.fillText('🚫',x+4,dy); dy+=10; }
        if(cell.debuffs.silence){ ctx.fillStyle='#aa66ff'; ctx.font='9px sans-serif'; ctx.fillText('🔇',x+4,dy); dy+=10; }
        if(cell.debuffs.corrode){ ctx.fillStyle='#44dd44'; ctx.font='9px sans-serif'; ctx.fillText('☣',x+4,dy); dy+=10; }
      }
      if(cell.stunned>0){ctx.fillStyle='rgba(255,255,0,0.5)';ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);}
      if(cell.overloadTimer>0){ctx.fillStyle='rgba(255,0,0,0.3)';ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);}
      if(cell.protected>0){ctx.strokeStyle='rgba(100,255,255,0.9)';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,CELL_SIZE-4,CELL_SIZE-4);}
      // ★ 新增：防御部保护蓝框
      if(cell.defenseProtected){
        ctx.save();
        ctx.strokeStyle='rgba(70,150,255,0.95)';
        ctx.lineWidth=2.5;
        ctx.shadowColor='rgba(70,150,255,0.9)';
        ctx.shadowBlur=8;
        ctx.strokeRect(x+1.5,y+1.5,CELL_SIZE-3,CELL_SIZE-3);
        ctx.shadowBlur=0;
        ctx.fillStyle='rgba(70,150,255,0.9)';
        ctx.fillRect(x+1.5,y+1.5,3,3);
        ctx.fillRect(x+CELL_SIZE-4.5,y+1.5,3,3);
        ctx.fillRect(x+1.5,y+CELL_SIZE-4.5,3,3);
        ctx.fillRect(x+CELL_SIZE-4.5,y+CELL_SIZE-4.5,3,3);
        ctx.restore();
      }
      if(cell.towerHP>0&&cell.towerHP<cell.towerMaxHP){
        const barW=CELL_SIZE-4,barH=3,barX=x+2,barY=y+CELL_SIZE-5;
        ctx.fillStyle='#330000';ctx.fillRect(barX,barY,barW,barH);
        const hpR=cell.towerHP/cell.towerMaxHP;
        ctx.fillStyle=hpR>0.5?'#44ff44':hpR>0.25?'#ffaa00':'#ff4444';
        ctx.fillRect(barX,barY,barW*hpR,barH);
      }
       } else if(cell.isPath){
      ctx.fillStyle=TC.path;ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
    } else {
      if(TC.undig1&&TC.undig2){ctx.fillStyle=(r+c)%2===0?TC.undig1:TC.undig2;}
      else{ctx.fillStyle=TC.undig||'#1e1e28';}
      ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
    }

    /* ★ 坑洞绘制：放在格子类型分支之后，避免被底色覆盖 */
    if(cell.holeWaves > 0){
      ctx.fillStyle='rgba(15,0,25,0.78)';
      ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
      ctx.strokeStyle='rgba(140,0,200,0.55)';
      ctx.lineWidth=1;
      ctx.strokeRect(x+1.5,y+1.5,CELL_SIZE-3,CELL_SIZE-3);
      ctx.fillStyle='rgba(180,80,255,0.55)';
      ctx.beginPath();
      ctx.arc(x+CELL_SIZE/2, y+CELL_SIZE/2,
              3+Math.sin(performance.now()*0.006+c)*1.5, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // 选中高亮
  if((gamePhase==='defense'||(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'))&&selectedCell){
  const cell=grid[selectedCell.row][selectedCell.col];
  if(cell&&cell.type==='tower'){
    drawTowerRange(cell,selectedCell.row,selectedCell.col);
    const sx=selectedCell.col*CELL_SIZE,sy=selectedCell.row*CELL_SIZE;
    ctx.strokeStyle=TC.gold;ctx.lineWidth=3;ctx.setLineDash([3,2]);
    ctx.strokeRect(sx+2,sy+2,CELL_SIZE-4,CELL_SIZE-4);ctx.setLineDash([]);
  }
}
  // 框选
    if((quickUpgradeMode||operationMode==='sacrifice'||operationMode==='remove'||commandSelecting==='towers')&&selectionStartRow>=0&&selectionEndRow>=0){
    const x1=Math.min(selectionStartCol,selectionEndCol)*CELL_SIZE;
    const y1=Math.min(selectionStartRow,selectionEndRow)*CELL_SIZE;
    const x2=(Math.max(selectionStartCol,selectionEndCol)+1)*CELL_SIZE;
    const y2=(Math.max(selectionStartRow,selectionEndRow)+1)*CELL_SIZE;
    ctx.save();
    ctx.globalAlpha=0.4;
    const selColor = commandSelecting==='towers' ? 'rgba(80,255,80,0.3)'
                    : quickUpgradeMode ? 'rgba(255,160,40,0.3)'
                    : operationMode==='sacrifice' ? 'rgba(255,40,40,0.3)'
                    : 'rgba(255,80,80,0.3)';
    const borderColor = commandSelecting==='towers' ? '#44ff44'
                    : quickUpgradeMode ? '#ff8800'
                    : operationMode==='sacrifice' ? '#ff0000'
                    : '#ff4444';
    ctx.fillStyle=selColor;ctx.fillRect(x1,y1,x2-x1,y2-y1);
    ctx.strokeStyle=borderColor;ctx.lineWidth=3;ctx.setLineDash([5,3]);
    ctx.strokeRect(x1,y1,x2-x1,y2-y1);
    ctx.restore();
  }
  for(const e of enemies)e.draw(ctx);
  for(const a of allies)a.draw(ctx);
  for(const p of projectiles)p.draw(ctx);
  for(const p of particles){
    if(p.life<=0)continue;
    const alpha=p.life/p.maxLife;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size||2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // Boss血条
  if(bossEnemy&&bossEnemy.alive){

  }
  // 基地/入口
    // 基地/入口

    // 基地/入口

  ctx.save();

  // ★ 关键字体设置：加粗、16px、强制中文字体、水平居中、垂直居中

  // 入口“入”

  ctx.fillStyle = TC.base;

  ctx.fillStyle = '#fff';
  ctx.fillText('基', END_COL*CELL_SIZE+12, END_ROW*CELL_SIZE+12);

  ctx.restore();
  if(screenShake>0)ctx.restore();

  /* ---------- ★ 天气视觉（含路灯挖洞）---------- */
  if(weatherType){
    const wc=ensureWeatherLayerCanvas();
    const wctx=wc.getContext('2d');
    wctx.clearRect(0,0,wc.width,wc.height);

    if(weatherType==='rain'){
      wctx.strokeStyle='rgba(140,180,230,0.55)';
      wctx.lineWidth=1.5;
      const t=(performance.now()*0.4)%60;
      for(let i=0;i<120;i++){
        const bx=(i*67)%canvas.width;
        const by=((i*113)+t)%canvas.height;
        wctx.beginPath();wctx.moveTo(bx,by);wctx.lineTo(bx-4,by+14);wctx.stroke();
      }
    } else if(weatherType==='fog'){
      wctx.fillStyle='rgba(210,225,240,0.55)';
      wctx.fillRect(0,0,wc.width,wc.height);
    } else if(weatherType==='night'){
      wctx.fillStyle='rgba(0,10,40,0.6)';
      wctx.fillRect(0,0,wc.width,wc.height);
    } else if(weatherType==='snow'){
      wctx.fillStyle='rgba(220,235,255,0.35)';
      wctx.fillRect(0,0,wc.width,wc.height);
      const now=performance.now();
      wctx.fillStyle='rgba(255,255,255,0.9)';
      for(let i=0;i<70;i++){
        const bx=(i*127+Math.sin(now*0.001+i)*30+now*0.02)%canvas.width;
        const by=((i*173+now*0.05)%canvas.height);
        wctx.beginPath();wctx.arc(bx,by,1.5+Math.random()*1.5,0,Math.PI*2);wctx.fill();
      }
    } else if(weatherType==='hail'){
  wctx.fillStyle='rgba(180,200,220,0.32)';
  wctx.fillRect(0,0,wc.width,wc.height);
  const t=(performance.now()*0.9)%40;
  wctx.strokeStyle='rgba(230,245,255,0.9)';
  wctx.lineWidth=2;
  for(let i=0;i<80;i++){
    const bx=(i*89)%canvas.width;
    const by=((i*151)+t*3)%canvas.height;
    wctx.beginPath();wctx.moveTo(bx,by);wctx.lineTo(bx-2,by+10);wctx.stroke();
  }
} else if(weatherType==='thunderstorm'){
  // 暗色调
  wctx.fillStyle='rgba(20,30,60,0.45)';
  wctx.fillRect(0,0,wc.width,wc.height);
  // 斜雨
  const t=(performance.now()*0.6)%50;
  wctx.strokeStyle='rgba(150,200,255,0.55)';
  wctx.lineWidth=1.5;
  for(let i=0;i<150;i++){
    const bx=(i*53)%canvas.width;
    const by=((i*137)+t)%canvas.height;
    wctx.beginPath();wctx.moveTo(bx,by);wctx.lineTo(bx-5,by+16);wctx.stroke();
  }
}

    // 路灯驱散雾 / 夜（挖洞）
    if(weatherType==='fog'||weatherType==='night'){
      wctx.globalCompositeOperation='destination-out';
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        const cell=grid[r][c];
        if(cell.type==='tower'&&cell.towerType==='lamp'){
          const lr=towerEffectiveRange('lamp',(cell.towerLevel||1)-1)*CELL_SIZE;
          const cx=c*CELL_SIZE+12,cy=r*CELL_SIZE+12;
          const grad=wctx.createRadialGradient(cx,cy,0,cx,cy,lr);
          grad.addColorStop(0,'rgba(0,0,0,1)');
          grad.addColorStop(0.6,'rgba(0,0,0,0.75)');
          grad.addColorStop(1,'rgba(0,0,0,0)');
          wctx.fillStyle=grad;
          wctx.beginPath();wctx.arc(cx,cy,lr,0,Math.PI*2);wctx.fill();
        }
      }
      wctx.globalCompositeOperation='source-over';
    }

    ctx.drawImage(wc,0,0);
    
  }

  /* ---------- ★ 雷暴闪电白闪（仅落雷瞬间） ---------- */
  if(weatherType==='thunderstorm' && window._thunderFlash>0){
    ctx.save();
    const a = Math.min(0.6, window._thunderFlash*4);
    ctx.fillStyle = `rgba(200,220,255,${a})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.restore();
    window._thunderFlash -= 0.03;
    if(window._thunderFlash < 0) window._thunderFlash = 0;
  }
}


/* ========== 图鉴辅助 ========== */
function isEnemyInLampRange(e){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=grid[r][c];
    if(cell.type==='tower'&&cell.towerType==='lamp'){
      const lr=towerEffectiveRange('lamp',(cell.towerLevel||1)-1)*CELL_SIZE;
      if(Math.hypot(e.x-(c*CELL_SIZE+12),e.y-(r*CELL_SIZE+12))<lr)return true;
    }
  }
  return false;
}
function isCellInLampRange(row, col){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=grid[r][c];
    if(cell.type==='tower'&&cell.towerType==='lamp'){
      const lr=towerEffectiveRange('lamp',(cell.towerLevel||1)-1);
      if(Math.hypot(row-r, col-c) < lr) return true;
    }
  }
  return false;
}

function spawnThunderBolt(tx, ty){
  projectiles.push({
    type:'thunderStrike',
    x:tx, y:0, ex:tx, ey:ty,
    life:0.35, alive:true,
    update(dt){ this.life-=dt; if(this.life<=0)this.alive=false; },
    draw(ctx){
      const a = Math.min(1, this.life/0.3);
      ctx.save();
      ctx.shadowColor = 'rgba(150,200,255,1)';
      ctx.shadowBlur = 25;
      ctx.strokeStyle = `rgba(180,220,255,${0.95*a})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(this.x, 0);
      const segs = 8;
      for(let j=1;j<segs;j++){
        const t2 = j/segs;
        ctx.lineTo(this.x + (Math.random()-0.5)*20, this.ey*t2);
      }
      ctx.lineTo(this.ex, this.ey);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${a})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.x, 0);
      for(let j=1;j<segs;j++){
        const t2 = j/segs;
        ctx.lineTo(this.x + (Math.random()-0.5)*20, this.ey*t2);
      }
      ctx.lineTo(this.ex, this.ey);
      ctx.stroke();
      ctx.restore();
    }
  });
}
function canTargetEnemy(e){
  if(!e||!e.alive)return false;
  if(e.isFriendly)return false;                                 // ★ 新增
  if(e.invisible&&!isEnemyInLampRange(e))return false;
  return true;
}

  weatherType=(type==='sunny')?null:type;
  weatherWavesLeft=(type==='sunny')?0:2;
  window._hailTimer=0;
  window._thunderTimer=0;
  window._thunderFlash=0;
  updateUI();
};
/* ============================================================
   输入处理
   ============================================================ */
let _pointerIsTouch=false,lastTouchDist=0;
function getCanvasCoords(e){
  const rect=canvas.getBoundingClientRect();
  let cx,cy;
  if(e.touches&&e.touches.length>0){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:cx-rect.left,y:cy-rect.top};
}
function handleDown(e){
  if(e.touches)e.preventDefault();
  _pointerIsTouch=!!e.touches;
  if(e.touches&&e.touches.length>0){viewportX=e.touches[0].clientX;viewportY=e.touches[0].clientY;}
  else{viewportX=e.clientX;viewportY=e.clientY;}
  const {x,y}=getCanvasCoords(e);
  mouseDown=true;mouseCanvasX=x;mouseCanvasY=y;
  mouseCol=Math.floor(x/CELL_SIZE);mouseRow=Math.floor(y/CELL_SIZE);
  lastTouchDist=0;
    if((quickUpgradeMode||(operationMode==='sacrifice'||operationMode==='remove')||commandSelecting==='towers')&&(gamePhase==='defense'||(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'))){
    selectionStartRow=mouseRow;selectionStartCol=mouseCol;selectionEndRow=mouseRow;selectionEndCol=mouseCol;
  } else if(gamePhase==='digging'&&mouseRow>=0&&mouseRow<ROWS&&mouseCol>=0&&mouseCol<COLS){
    if(mouseRow===END_ROW&&mouseCol===END_COL){}
    else if(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'){}
    else{if(digCellWithHistory(mouseRow,mouseCol)&&checkStartEndConnected())startDefensePhase();}
    updateUI();
  }
}
function handleMove(e){
  if(e.touches)e.preventDefault();
  const {x,y}=getCanvasCoords(e);
  lastTouchDist=Math.max(lastTouchDist,Math.abs(x-mouseCanvasX)+Math.abs(y-mouseCanvasY));
  mouseCanvasX=x;mouseCanvasY=y;
  if(e.touches&&e.touches.length>0){viewportX=e.touches[0].clientX;viewportY=e.touches[0].clientY;}
   if((quickUpgradeMode||(operationMode==='sacrifice'||operationMode==='remove')||commandSelecting==='towers')&&mouseDown&&(gamePhase==='defense'||(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'))){
    const col=Math.floor(x/CELL_SIZE),row=Math.floor(y/CELL_SIZE);
    if(row>=0&&row<ROWS&&col>=0&&col<COLS){selectionEndRow=row;selectionEndCol=col;}
  } else if(mouseDown&&gamePhase==='digging'){
    const col=Math.floor(x/CELL_SIZE),row=Math.floor(y/CELL_SIZE);
    if(row>=0&&row<ROWS&&col>=0&&col<COLS&&(row!==mouseRow||col!==mouseCol)){
      mouseRow=row;mouseCol=col;
      if(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'){digCellWithHistory(row,col);}
      else{if(digCellWithHistory(row,col)&&checkStartEndConnected())startDefensePhase();}
      updateUI();
    }
  }
}
function handleUp(e){
  if(e.preventDefault)e.preventDefault();
  mouseDown=false;
   if(commandSelecting==='towers' && selectionStartRow>=0 && selectionEndRow>=0){
    /* ★ 拖动距离过小视为误触，直接取消 */
    if(lastTouchDist<4){
      cancelCommandSelect();
      commandSelectedTowers=[];
      selectionStartRow=-1; selectionEndRow=-1;
      return;
    }
    const minR=Math.min(selectionStartRow,selectionEndRow),maxR=Math.max(selectionStartRow,selectionEndRow);
    const minC=Math.min(selectionStartCol,selectionEndCol),maxC=Math.max(selectionStartCol,selectionEndCol);
    commandSelectedTowers=[];
    for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){
      const cell=grid[r][c];
      /* ★ 排除指挥部自身与镜像塔 */
      if(cell.type==='tower' && !cell.isMirrorTower && cell.towerType!=='command'){
        commandSelectedTowers.push([r,c]);
      }
    }
    if(commandSelectedTowers.length>0){
      commandSelecting='target';
      showCommandHint('🎯 点击选择目标敌人');
      window._suppressClickUntil = performance.now() + 250;
    } else {
      cancelCommandSelect();
    }
    selectionStartRow=-1; selectionEndRow=-1;
    return;
  }
  if(quickUpgradeMode&&(gamePhase==='defense'||(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'))&&selectionStartRow>=0&&selectionEndRow>=0){
    if(lastTouchDist>3)quickUpgradeInRect(selectionStartRow,selectionStartCol,selectionEndRow,selectionEndCol);
    selectionStartRow=-1;selectionEndRow=-1;
  }
  if(operationMode==='sacrifice'&&(gamePhase==='defense'||(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'))&&selectionStartRow>=0&&selectionEndRow>=0){
    if(lastTouchDist>3)quickSacrificeInRect(selectionStartRow,selectionStartCol,selectionEndRow,selectionEndCol);
    else{
      const col=Math.floor(mouseCanvasX/CELL_SIZE),row=Math.floor(mouseCanvasY/CELL_SIZE);
      if(row>=0&&row<ROWS&&col>=0&&col<COLS){
        const cell=grid[row][col];
        if(cell&&cell.type==='tower'){
          const showSacrifice=devMode||(gameMode==='season')||(waveNumber>=5);
          if(showSacrifice)sacrificeAndRefund(row,col);
          else alert('普通模式献祭功能在第5波解锁');
        }
      }
    }
    selectionStartRow=-1;selectionEndRow=-1;
    return;
  }
  if(operationMode==='remove'&&(gamePhase==='defense'||(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'))&&selectionStartRow>=0&&selectionEndRow>=0){
    if(lastTouchDist>3)quickRemoveInRect(selectionStartRow,selectionStartCol,selectionEndRow,selectionEndCol);
    else{
      const col=Math.floor(mouseCanvasX/CELL_SIZE),row=Math.floor(mouseCanvasY/CELL_SIZE);
      if(row>=0&&row<ROWS&&col>=0&&col<COLS){
        const cell=grid[row][col];
        if(cell&&cell.type==='tower'){removeTower(row,col);}
      }
    }
    selectionStartRow=-1;selectionEndRow=-1;
    return;
  }
  if(_pointerIsTouch&&lastTouchDist<5&&!quickUpgradeMode&&(gamePhase==='defense'||gamePhase==='digging')){
    const col=Math.floor(mouseCanvasX/CELL_SIZE),row=Math.floor(mouseCanvasY/CELL_SIZE);
    if(row>=0&&row<ROWS&&col>=0&&col<COLS){
      if(gamePhase==='digging'){
        if(row===END_ROW&&col===END_COL){showBaseMenu(viewportX,viewportY);return;}
        if(row===START_ROW&&col===START_COL){showEntranceMenu(viewportX,viewportY);return;}
        const cell=grid[row][col];
        if(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'){
          if(cell.type==='empty'){if(digCellWithHistory(row,col)&&checkStartEndConnected())startDefensePhase();}
          else{handleCellClick(row,col,viewportX,viewportY);}
          return;
        }
        if(digCellWithHistory(row,col)&&checkStartEndConnected())startDefensePhase();
        return;
      }
      handleCellClick(row,col,viewportX,viewportY);
    }
  }
}
canvas.addEventListener('mousedown',handleDown);
canvas.addEventListener('mousemove',handleMove);
canvas.addEventListener('mouseup',handleUp);
canvas.addEventListener('mouseleave',()=>{mouseDown=false;});
canvas.addEventListener('touchstart',handleDown,{passive:false});
canvas.addEventListener('touchmove',handleMove,{passive:false});
canvas.addEventListener('touchend',handleUp);
canvas.addEventListener('touchcancel',handleUp);

canvas.addEventListener('click',(e)=>{
  if(_pointerIsTouch)return;
  if(quickUpgradeMode)return;
 // ★ 菜单已打开时，只允许点击菜单本身来响应
  const menu=document.getElementById('context-menu');
  if(menu.classList.contains('show')){
    if(menu.contains(e.target)) return;   // 点在菜单里 → 交给菜单自己的 onclick
    // 点到画布其他地方 → 只关菜单，不再触发 handleCellClick
    closeMenu();
    selectedCell=null;
    updateUI();
    return;
}
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  mouseCanvasX=mx;mouseCanvasY=my;
  const col=Math.floor(mx/CELL_SIZE),row=Math.floor(my/CELL_SIZE);
  if(row<0||row>=ROWS||col<0||col>=COLS)return;
  if(operationMode==='sacrifice'&&gamePhase==='defense'){
    if(gameMode!=='season'&&waveNumber<5){alert('普通模式献祭功能在第5波解锁');return;}
    const cell=grid[row][col];
    if(cell&&cell.type==='tower'){sacrificeAndRefund(row,col);}
    return;
  }
  if(gamePhase==='digging'){
    if(row===END_ROW&&col===END_COL){showBaseMenu(e.clientX,e.clientY);return;}
    if(row===START_ROW&&col===START_COL){showEntranceMenu(e.clientX,e.clientY);return;}
    const cell=grid[row][col];
    if(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging'){
      if(cell.type==='empty'){if(digCellWithHistory(row,col)&&checkStartEndConnected())startDefensePhase();}
      else{handleCellClick(row,col,e.clientX,e.clientY);}
      return;
    }
    if(digCellWithHistory(row,col)&&checkStartEndConnected())startDefensePhase();
    return;
  }
  handleCellClick(row,col,e.clientX,e.clientY);
});
canvas.addEventListener('contextmenu',(e)=>{
  e.preventDefault();
  /* ★ 右键同时取消指挥框选 */
  if(typeof commandSelecting!=='undefined' && commandSelecting){
    cancelCommandSelect();
    commandSelectedTowers=[];
    commandBuildingCell=null;
  }
  closeMenu();
  selectedCell=null;
  updateUI();
});

function handleCellClick(row,col,cx,cy){
   /* ★ 框选刚结束时，吞掉一次误触点击 */
   if(window._suppressClickUntil && performance.now() < window._suppressClickUntil){
     window._suppressClickUntil = 0;
     return;
   }
   if(commandSelecting==='target'){
    let best=null, bd=CELL_SIZE*2;
    for(const e of enemies){
      if(!e.alive||e.reachedEnd||e.isFriendly) continue;
      const d=Math.hypot(e.x-mouseCanvasX, e.y-mouseCanvasY);
      if(d<bd){ bd=d; best=e; }
    }
    if(best) applyCommand(best);
    else cancelCommandSelect();
    return;
  }
 if(movingTower){placeMovedTower(row,col);return;}
  if(window._wireNetSource){
    const cell=grid[row][col];
    if(cell.type==='empty'&&!cell.isPath){
      const src=window._wireNetSource;
      const srcCell=grid[src[0]][src[1]];
      if(srcCell&&srcCell.type==='tower'&&srcCell.towerType==='wireNet'){
        if(!devMode&&crystals<TOWER_TYPES.wireNet.crystalCost){
          alert('💎水晶不足！需要'+TOWER_TYPES.wireNet.crystalCost+'水晶连接电线网');
          cancelWireNetPair();
          return;
        }
        if(!devMode)crystals-=TOWER_TYPES.wireNet.crystalCost;
        srcCell.wireNetPair=[row,col];
        cell.type='tower';cell.towerType='wireNet';cell.towerLevel=1;
        cell.wireNetPair=[src[0],src[1]];cell.towerMaxHP=100;cell.towerHP=100;
        spawnParticles(col*CELL_SIZE+12,row*CELL_SIZE+12,'#88ccff',12);
      }
    }
    window._wireNetSource=null;
    const h=document.getElementById('wireNetHint');if(h)h.remove();
    closeMenu();updateUI();
    return;
  }
  if(row===START_ROW&&col===START_COL){showEntranceMenu(cx,cy);return;}
  if(row===END_ROW&&col===END_COL){showBaseMenu(cx,cy);return;}
  const cell=grid[row][col];
  if(cell.type==='tower'||cell.type==='obstacle'){selectedCell={row,col};showBuildingMenu(cx,cy,row,col);}
  else{showConstructionMenu(cx,cy,row,col);}
}
window.handleCellClick=handleCellClick;

function showBaseMenu(mx,my){

  if(devMode)menu.innerHTML+=`<div class="menu-item" onclick="showDevDamageLog();closeMenu()"><span>📊查看伤害记录</span></div>`;

}
function upgradeBaseToughness(){
  if(baseUpgrades.toughness>=10)return;
  let cost=100+baseUpgrades.toughness*80;

};

/* ========== 放置 ========== */
function placeItem(row,col,type,category){
  const cell=grid[row][col];
  /* ★ 坑洞内不可放置任何东西 */
  if(cell.holeWaves > 0){ alert('🕳️ 坑洞内无法放置任何东西'); return; }
  /* ★ 黑洞一局一次 */
  if(category==='tower' && type==='blackhole' && blackholeUsedThisGame){
    alert('🕳️ 黑洞一局只能使用一次！'); return;
  }
  if(category==='tower'){
    const t=TOWER_TYPES[type];
    if(!t)return;
    if(techLockedTypes&&techLockedTypes.has(type))return;
    if(t.isWireNet){
      if(!canPlantOn(row,col,type))return;
      if(!devMode&&crystals<t.crystalCost)return;
      if(!devMode)crystals-=t.crystalCost;
      cell.type='tower';cell.towerType='wireNet';cell.towerLevel=1;
      cell.wireNetPair=null;cell.towerMaxHP=100;cell.towerHP=100;
      updateUI();return;
    }
    if(t.requiresMaxed){
      if(!canPlantOn(row,col,type))return;
      if(!devMode&&crystals<(t.crystalCost||0))return;
      if(!devMode)crystals-=(t.crystalCost||0);
      cell.type='tower';cell.towerType=type;cell.towerLevel=1;
      cell.atkLvl=0;cell.cdLvl=0;cell.rangeLvl=0;cell.overloadTimer=0;
      cell.towerMaxHP=100;cell.towerHP=100;
      updateUI();return;
    }
    if(t.isOneShot){if(cell.type!=='empty'&&!cell.isPath)return;if(cell.type==='obstacle')return;}
    else{if(cell.type!=='empty')return;}
    if(t.cost>0&&t.crystalCost>0){
      if(!devMode&&(points<t.cost||crystals<t.crystalCost))return;
      if(!devMode){points-=t.cost;crystals-=t.crystalCost;}
    } else if(t.crystalCost){
      if(!devMode&&crystals<t.crystalCost)return;
      if(!devMode)crystals-=t.crystalCost;
    } else if(t.cost>0){
      if(!devMode&&points<t.cost)return;
      if(!devMode)points-=t.cost;
    }
    if(t.isOneShot){
      cell.type='tower';cell.towerType=type;cell.towerLevel=1;
      cell.atkLvl=0;cell.cdLvl=0;cell.rangeLvl=0;cell.overloadTimer=0;
      if(cell.isPath)cell.wasPath=true;
      if(type==='blackhole') blackholeUsedThisGame = true;   // ★ 标记已用
    } else {
      cell.type='tower';cell.towerType=type;cell.towerLevel=1;
      cell.atkLvl=0;cell.cdLvl=0;cell.rangeLvl=0;cell.overloadTimer=0;
      cell.towerMaxHP=100;cell.towerHP=100;
      if(type==='fire'||type==='toxic'||type==='fan'){
        const nb=getPathNeighbors(row,col);
        cell.towerDirection=nb.length?[nb[0][0]-row,nb[0][1]-col]:[0,1];
      }
    }
  } else {
    if(!cell.isPath||cell.type==='obstacle'||cell.type==='tower')return;
    const obs=OBSTACLE_TYPES[type];if(!obs)return;
    if(obs.crystalCost){
      if(!devMode&&crystals<obs.crystalCost)return;
      if(!devMode)crystals-=obs.crystalCost;
    } else {
      const cost=obsCost(type);
      if(!devMode&&points<cost)return;
      if(!devMode)points-=cost;
    }
    cell.type='obstacle';cell.obstacleType=type;cell.obstacleLevel=1;cell.obstacleUpgrades={};
    if(obs.upgrades)for(let key in obs.upgrades)cell.obstacleUpgrades[key]=0;
    if(type==='stone'){cell.obstacleMaxHP=300;cell.obstacleHP=300;}
    else if(type==='cactus'){cell.obstacleMaxHP=50;cell.obstacleHP=50;}
    else if(type==='confusion'){cell.obstacleMaxHP=100;cell.obstacleHP=100;}
    else if(type==='barracks'){cell.obstacleMaxHP=300;cell.obstacleHP=300;}
    if(type==='barracks'){showBarracksSelectMenu(row,col);}
  }
  updateUI();
}

function getSacrificeCost(row,col){
  const cell=grid[row][col];
  if(cell.type!=='tower')return{points:0,crystals:0};
  const t=TOWER_TYPES[cell.towerType];
  if(!t)return{points:0,crystals:0};
  let totalPoints=0;
  if(t.fields){
    for(let i=1;i<=cell.atkLvl;i++)totalPoints+=Math.floor(i*8+10);
    for(let i=1;i<=cell.cdLvl;i++)totalPoints+=Math.floor(i*8+10);
    if(t.rangePerLvl>0)for(let i=1;i<=cell.rangeLvl;i++)totalPoints+=Math.floor(i*8+10);
  } else {
    for(let i=1;i<cell.towerLevel;i++)totalPoints+=Math.floor(i*8+10);
  }
  totalPoints+=t.cost||0;
  let crystalCost=0;
  if(t.crystalCost){
    crystalCost=Math.floor(t.crystalCost*0.5);
    return {points:Math.floor(totalPoints*0.3),crystals:crystalCost};
  }
  return {points:Math.floor(totalPoints*0.5),crystals:0};
}

function getObstacleStats(cell){
  if(cell.type!=='obstacle')return '';
  const type=cell.obstacleType;
  const obs=OBSTACLE_TYPES[type];
  if(!obs||!obs.fields)return '';
  const up=cell.obstacleUpgrades||{};
  let parts=[];
  if(type==='water')parts.push(`减速:${((obs.upgrades.slow.base+up.slow*obs.upgrades.slow.perLvl)*100).toFixed(0)}%`);
  else if(type==='lava')parts.push(`灼烧:${obs.upgrades.burn.base+up.burn*obs.upgrades.burn.perLvl}DPS`);
  else if(type==='cactus'){parts.push(`反伤:${obs.upgrades.thorns.base+up.thorns*obs.upgrades.thorns.perLvl}`);parts.push(`耐久:${obs.upgrades.hp.base+up.hp*obs.upgrades.hp.perLvl}/${cell.obstacleMaxHP}`);}
  else if(type==='stone'){parts.push(`耐久:${obs.upgrades.hp.base+up.hp*obs.upgrades.hp.perLvl}/${cell.obstacleMaxHP}`);const regen=obs.upgrades.regenCd.base+up.regenCd*obs.upgrades.regenCd.perLvl;parts.push(`回复CD:${Math.max(1,regen).toFixed(1)}s`);}
  else if(type==='barracks'){const cd=obs.upgrades.spawnCd.base+up.spawnCd*obs.upgrades.spawnCd.perLvl;const str=obs.upgrades.spawnStr.base+up.spawnStr*obs.upgrades.spawnStr.perLvl;parts.push(`生产CD:${Math.max(1,cd).toFixed(1)}s`);    const unitKey = cell.barracksUnitType;
    const unitName = unitKey && ALLY_TYPES[unitKey] ? ALLY_TYPES[unitKey].name : '未选择';
    const unitDesc = unitKey && ALLY_TYPES[unitKey] ? ALLY_TYPES[unitKey].upgradeDesc(str) : '—';
    parts.push(`兵种:${unitName}`);
    parts.push(`强化:${unitDesc}`);parts.push(`耐久:${Math.ceil(cell.obstacleHP)}/${cell.obstacleMaxHP}`);const ut=ALLY_TYPES[cell.barracksUnitType];parts.push(`兵种:${ut?ut.name:'未选择'}`);}
  else if(type==='spring')parts.push(`弹射距离:${obs.upgrades.distance.base+up.distance*obs.upgrades.distance.perLvl}格`);
  else if(type==='confusion'){parts.push(`混乱概率:${((obs.upgrades.effect.base+up.effect*obs.upgrades.effect.perLvl)*100).toFixed(0)}%`);parts.push(`耐久:${obs.upgrades.hp.base+up.hp*obs.upgrades.hp.perLvl}/${cell.obstacleMaxHP}`);}
  return parts.join(' | ');
}
function upgradeObstacleField(row,col,key,isDiamond){
  const cell=grid[row][col];if(cell.type!=='obstacle')return;
  const obs=OBSTACLE_TYPES[cell.obstacleType];if(!obs)return;
  const up=cell.obstacleUpgrades;if(!up)return;
  const level=up[key]||0;
  const maxLvl=(cell.obstacleType==='stone')?15:20;
  if(level>=maxLvl)return;
  const cost=Math.floor((level+1)*6+5);
  if(isDiamond){if(devMode||crystals>=cost){if(!devMode)crystals-=cost;}else return;}
  else{if(devMode||points>=cost){if(!devMode)points-=cost;}else return;}
  up[key]=level+1;
  if(cell.obstacleType==='stone'&&key==='hp'){cell.obstacleMaxHP=300+up.hp*50;cell.obstacleHP=Math.min(cell.obstacleHP,cell.obstacleMaxHP);}
  else if(cell.obstacleType==='cactus'&&key==='hp'){cell.obstacleMaxHP=50+up.hp*20;cell.obstacleHP=Math.min(cell.obstacleHP,cell.obstacleMaxHP);}
  else if(cell.obstacleType==='confusion'&&key==='hp'){cell.obstacleMaxHP=100+up.hp*30;cell.obstacleHP=Math.min(cell.obstacleHP,cell.obstacleMaxHP);}
  updateUI();
}
window.upgradeObstacleField=upgradeObstacleField;

/* ========== 升级/铲除/献祭 ========== */
function crystalCostForLevel(currentLvl){
  return 50 * Math.pow(2, Math.max(0, currentLvl - ULTIMATE_THRESHOLD));
}
function upgradeTowerField(row,col,field,cost){
  const cell=grid[row][col];if(cell.type!=='tower')return;
  const needCrystal=(field==='atk'&&cell.atkLvl>=ULTIMATE_THRESHOLD)||(field==='cd'&&cell.cdLvl>=ULTIMATE_THRESHOLD)||(field==='range'&&cell.rangeLvl>=ULTIMATE_THRESHOLD&&TOWER_TYPES[cell.towerType].rangePerLvl>0);
  if(needCrystal){
    let lvl=field==='atk'?cell.atkLvl:field==='cd'?cell.cdLvl:cell.rangeLvl;
    const crystalCost=crystalCostForLevel(lvl);
    if(devMode||crystals>=crystalCost){
      if(!devMode)crystals-=crystalCost;
      if(field==='atk')cell.atkLvl++;
      else if(field==='cd')cell.cdLvl++;
      else if(field==='range')cell.rangeLvl++;
      updateUI();
    }
  } else {
    if(devMode||points>=cost){
      if(!devMode)points-=cost;
      if(field==='atk')cell.atkLvl++;
      else if(field==='cd')cell.cdLvl++;
      else if(field==='range')cell.rangeLvl++;
      else if(field==='lvl')cell.towerLevel++;
      updateUI();
    }
  }
}
window.upgradeTowerField=upgradeTowerField;

function getTowerRefund(row,col){
  const cell=grid[row][col];if(cell.type!=='tower')return 0;
  const t=TOWER_TYPES[cell.towerType];if(!t)return 0;
  let total=0;
  if(t.fields){
    for(let i=1;i<=cell.atkLvl;i++)total+=Math.floor(i*8+10);
    for(let i=1;i<=cell.cdLvl;i++)total+=Math.floor(i*8+10);
    if(t.rangePerLvl>0)for(let i=1;i<=cell.rangeLvl;i++)total+=Math.floor(i*8+10);
  } else {
    for(let i=1;i<cell.towerLevel;i++)total+=Math.floor(i*8+10);
  }
  total+=t.cost||0;
  return Math.floor(total*0.5);
}
function getTowerCrystalRefund(row,col){
  const cell=grid[row][col];if(cell.type!=='tower')return 0;
  const t=TOWER_TYPES[cell.towerType];
  if(!t||!t.crystalCost)return 0;
  return Math.floor(t.crystalCost*0.5);
}
function removeTower(row,col){
  const cell=grid[row][col];if(cell.type!=='tower')return;
  const refund=getTowerRefund(row,col);
  const crystalRefund=getTowerCrystalRefund(row,col);
  clampPoints(refund,true);
  if(crystalRefund>0)clampCrystals(crystalRefund);
  if(cell.towerType==='wireNet'&&cell.wireNetPair){
    const [pr,pc]=cell.wireNetPair;
    if(grid[pr]?.[pc])grid[pr][pc].wireNetPair=null;
  }
  cell.type='empty';cell.towerType=null;cell.wireNetPair=null;
  cell.atkLvl=0;cell.cdLvl=0;cell.rangeLvl=0;cell.towerLevel=0;
  cell.towerHP=0;cell.towerMaxHP=0;
  closeMenu();updateUI();
}
window.removeTower=removeTower;

function sacrificeAndRefund(row,col){
  const cell=grid[row][col];if(cell.type!=='tower')return;
  const cost=getSacrificeCost(row,col);
  if(!devMode){
    if(points<cost.points){alert('金币不足');return;}
    if(cost.crystals>0&&crystals<cost.crystals){alert('水晶不足');return;}
    points-=cost.points;
    if(cost.crystals>0)crystals-=cost.crystals;
  }
  cell.overloadTimer=15;
  closeMenu();updateUI();
}
window.sacrificeAndRefund=sacrificeAndRefund;

function quickUpgradeInRect(r1,c1,r2,c2){
  const minR=Math.min(r1,r2),maxR=Math.max(r1,r2),minC=Math.min(c1,c2),maxC=Math.max(c1,c2);
  let totalCost=0,totalCrystal=0,upgraded=0;
  for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){
    const cell=grid[r][c];
    if(cell.type==='tower'){
      const t=TOWER_TYPES[cell.towerType];
      if(!t||t.noUpgrade||t.isOneShot||t.isWireNet)continue;
      if(t.fields){
        if(cell.atkLvl<MAX_TOWER_LVL){if(cell.atkLvl>=ULTIMATE_THRESHOLD)totalCrystal+=crystalCostForLevel(cell.atkLvl);else totalCost+=Math.floor((cell.atkLvl+1)*8+10);}
        if(cell.cdLvl<MAX_TOWER_LVL){if(cell.cdLvl>=ULTIMATE_THRESHOLD)totalCrystal+=crystalCostForLevel(cell.cdLvl);else totalCost+=Math.floor((cell.cdLvl+1)*8+10);}
        if(t.rangePerLvl>0&&cell.rangeLvl<MAX_TOWER_LVL){if(cell.rangeLvl>=ULTIMATE_THRESHOLD)totalCrystal+=crystalCostForLevel(cell.rangeLvl);else totalCost+=Math.floor((cell.rangeLvl+1)*8+10);}
      } else if(cell.towerLevel<(t.maxLvl||MAX_TOWER_LVL)){
        if(cell.towerLevel>=ULTIMATE_THRESHOLD)totalCrystal+=crystalCostForLevel(cell.towerLevel);else totalCost+=Math.floor((cell.towerLevel+1)*8+10);
      }
    }
  }
  if(totalCost===0&&totalCrystal===0)return;
  if(!devMode&&points<totalCost){alert(`点数不足！需要${totalCost}pt`);return;}
  if(!devMode&&crystals<totalCrystal){alert(`水晶不足！需要💎${totalCrystal}`);return;}
  if(!devMode){points-=totalCost;crystals-=totalCrystal;}
  for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){
    const cell=grid[r][c];
    if(cell.type==='tower'){
      const t=TOWER_TYPES[cell.towerType];
      if(!t||t.noUpgrade||t.isOneShot||t.isWireNet)continue;
      if(t.fields){
        if(cell.atkLvl<MAX_TOWER_LVL){cell.atkLvl++;upgraded++;}
        if(cell.cdLvl<MAX_TOWER_LVL){cell.cdLvl++;upgraded++;}
        if(t.rangePerLvl>0&&cell.rangeLvl<MAX_TOWER_LVL){cell.rangeLvl++;upgraded++;}
      } else if(cell.towerLevel<(t.maxLvl||MAX_TOWER_LVL)){cell.towerLevel++;upgraded++;}
    }
  }
  alert(`✅ 升级${upgraded}项，花费${totalCost}pt+💎${totalCrystal}`);
  updateUI();
}
function quickSacrificeInRect(r1,c1,r2,c2){

function showBossPenaltySelection(count=5){

  else{sel=[{id:'default_fine',name:'💸 罚款',desc:'扣除当前50%金币',effect:()=>{if(!devMode){points=Math.floor(points*0.5);updateUI();}}}];}

  sel.forEach((a,i)=>{html+=`<div class="buff-card" onclick="window.applyPenalty(${i})"><b>${a.name}</b><br><small>${a.desc}</small></div>`;});
  html+='</div></div>';
  document.getElementById('modalContainer').innerHTML=html;

}

window.applyPenalty=function(i){

    a.effect();
    window._pendingPenalties=null;

};
function destroyRandomTowers(f){const ts=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].type==='tower')ts.push([r,c]);const cnt=Math.floor(ts.length*f);for(let i=0;i<cnt;i++){if(!ts.length)break;const idx=Math.floor(Math.random()*ts.length);const [r,c]=ts.splice(idx,1)[0];grid[r][c].type='empty';}}
function stunAllTowers(d){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].type==='tower'&&!(grid[r][c].protected>0))grid[r][c].stunned=Math.max(grid[r][c].stunned,d);}
function teleportEnemiesNearBase(n){let t=0;for(const e of enemies){if(!e.alive||e.reachedEnd)continue;if(t>=n)break;const targetIdx=Math.max(0,pathOrder.length-4);e.pathIndex=targetIdx;e.subX=pathOrder[targetIdx][1]*CELL_SIZE+12;e.subY=pathOrder[targetIdx][0]*CELL_SIZE+12;e.x=e.subX;e.y=e.subY;e.straightToBase=false;spawnParticles(e.x,e.y,'#ff4444',10);t++;}}

function applyCommand(target){
  if(!commandBuildingCell){ cancelCommandSelect(); return; }
  const [row,col]=commandBuildingCell;
  const cell=grid[row]&&grid[row][col];
  if(!cell || cell.towerType!=='command'){ cancelCommandSelect(); return; }

  /* ★ 先释放上一次指挥过的炮塔 */
  if(cell.commandTowers){
    for(const [r,c] of cell.commandTowers){
      const t=grid[r]&&grid[r][c];
      if(t && t.type==='tower') t.priorityTarget=null;
    }
  }

  const singleTargets=['cannon','tesla','nuke'];
  /* ★ 排除指挥部自身与镜像塔 */
  const validTowers=commandSelectedTowers.filter(([r,c])=>{
    const t=grid[r]&&grid[r][c];
    return t && t.type==='tower' && !t.isMirrorTower && t.towerType!=='command';
  });

  cell.commandTowers=validTowers.slice();
  cell.commandTarget=target;
  for(const [r,c] of validTowers){
    const t=grid[r]&&grid[r][c];
    if(t && t.type==='tower' && singleTargets.includes(t.towerType)){
      t.priorityTarget=target;
    }
  }
  cancelCommandSelect();
  updateUI();
}
window.applyCommand=applyCommand;

function clearCommand(row,col){
  const cell=grid[row]&&grid[row][col];
  if(!cell) return;
  if(cell.commandTowers){
    for(const [r,c] of cell.commandTowers){
      const t=grid[r]&&grid[r][c];
      if(t) t.priorityTarget=null;
    }
  }
  cell.commandTowers=null; cell.commandTarget=null;
  closeMenu(); updateUI();
}

function upgradeDefense(row,col){
  const cell=grid[row]&&grid[row][col];
  if(!cell || cell.towerType!=='defense') return;
  const lvl=cell.towerLevel||1;
  if(lvl>=20) return;
  const cost=Math.floor((lvl+1)*8+10);
  if(!devMode && points<cost) return;
  if(!devMode) points-=cost;
  cell.towerLevel=lvl+1;
  cell.defenseMaxCharge = 100 + 50*(cell.towerLevel-1);
  if(cell.defenseCharge>cell.defenseMaxCharge) cell.defenseCharge=cell.defenseMaxCharge;
  cell.towerMaxHP = 100 + (cell.towerLevel-1)*20;
  cell.towerHP = Math.min(cell.towerHP||cell.towerMaxHP, cell.towerMaxHP);
  updateUI();
}

window.doEncySearch=function(q){

  let html='';
  for(const [k,d] of Object.entries(ENEMY_TYPES)){

      html+=`<div class="ency-entry" style="cursor:pointer;" onclick="showEnemyDetail('${k}','search')">${d.emoji} <b>${d.name}</b> <span style="color:#888;font-size:0.85em;">${d.desc}</span></div>`;

    }
  }
  for(const [k,d] of Object.entries(OBSTACLE_TYPES)){
    if(d.name.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)){
      html+=`<div class="ency-entry" style="cursor:pointer;" onclick="showObstacleDetail('${k}')">${d.icon} <b>${d.name}</b> <span style="color:#888;font-size:0.85em;">${d.desc}</span></div>`;
    }
  }
  for(const [k,d] of Object.entries(ALLY_TYPES)){
    if(d.name.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)){
      html+=`<div class="ency-entry" style="cursor:pointer;" onclick="showAllyDetail('${k}')">${d.emoji} <b>${d.name}</b> <span style="color:#888;font-size:0.85em;">${d.desc}</span></div>`;

  }
  for(const a of AFFIX_POOL){
    if(a.name.toLowerCase().includes(q)||a.desc.toLowerCase().includes(q)){

function generateRingPath(){
  initGrid();
  const r1=3,r2=ROWS-4,c1=3,c2=COLS-4;
  for(let c=c1;c<=c2;c++){grid[r1][c].type='path';grid[r1][c].isPath=true;}
  for(let r=r1;r<=r2;r++){grid[r][c2].type='path';grid[r][c2].isPath=true;}
  for(let c=c2;c>=c1;c--){grid[r2][c].type='path';grid[r2][c].isPath=true;}
  for(let r=r2;r>=r1;r--){grid[r][c1].type='path';grid[r][c1].isPath=true;}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].isPath)grid[r][c].pathConnections=countPathNeighbors(r,c);
  pathOrder=[];
  for(let c=c1;c<=c2;c++)pathOrder.push([r1,c]);
  for(let r=r1+1;r<=r2;r++)pathOrder.push([r,c2]);
  for(let c=c2-1;c>=c1;c--)pathOrder.push([r2,c]);
  for(let r=r2-1;r>=r1+1;r--)pathOrder.push([r,c1]);
  computePathCorners();
}

function processSeasonSpawning(dt){
  if(bossSelectionPause||introPause||gamePaused)return;
  if(seasonSubMode==='experience'){
    seasonSpawnTimer+=dt;
    const spawnInterval=Math.max(0.3,1.5-seasonDifficulty*0.05);
    if(seasonSpawnTimer>=spawnInterval){
      seasonSpawnTimer=0;
      const count=1+Math.floor(seasonDifficulty*0.3)+Math.floor(Math.random()*2);
      for(let i=0;i<count;i++){
        let type;
        const enemyTypes=['zombie','slime','runner','ghost','drone','healer','flesh_mountain'];
        type=enemyTypes[Math.floor(Math.random()*enemyTypes.length)];
        if(seasonDifficulty>=3&&Math.random()<0.2)type=['thief','summoner','splitter','shielder','reflector','teleporter'][Math.floor(Math.random()*6)];
        const lvl=Math.min(MAX_LEVEL,Math.floor(seasonDifficulty*3)+Math.floor(Math.random()*5));
        const e=new Enemy(type,lvl);e.pathIndex=0;
        if(pathOrder.length>0){e.x=pathOrder[0][1]*CELL_SIZE+12;e.y=pathOrder[0][0]*CELL_SIZE+12;e.subX=e.x;e.subY=e.y;}
        enemies.push(e);
      }
    }
    seasonBossTimer+=dt;
    if(seasonBossTimer>=60){
      seasonBossTimer=0;
      const bossTypes=['boss','boss_jiawei','boss_bomber'];
      const bt=bossTypes[Math.floor(Math.random()*bossTypes.length)];
      const e=new Enemy(bt,Math.floor(seasonDifficulty*5)+5);e.pathIndex=0;
      if(pathOrder.length>0){e.x=pathOrder[0][1]*CELL_SIZE+12;e.y=pathOrder[0][0]*CELL_SIZE+12;e.subX=e.x;e.subY=e.y;}
      enemies.push(e);
    }
  }
}

/* ---------- 1. 绘制炮塔攻击范围 ---------- */
function drawTowerRange(cell,row,col){
  const type=cell.towerType;
  if(type==='mirror'||type==='wireNet')return;
  const tx=col*CELL_SIZE+12,ty=row*CELL_SIZE+12;
  ctx.save();
  ctx.globalAlpha=0.45;
  ctx.setLineDash([6,4]);
  ctx.lineWidth=2;
  switch(type){
    case'arrow':
      ctx.strokeStyle='rgba(255,255,180,0.7)';
      ctx.beginPath();ctx.moveTo(tx,0);ctx.lineTo(tx,canvas.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,ty);ctx.lineTo(canvas.width,ty);ctx.stroke();
      break;
    case'ice':case'tesla':case'potion':case'storm':case'dynamite':case'iceBomb':{
      const range=towerEffectiveRange(type,cell.rangeLvl||0)*CELL_SIZE;
      ctx.strokeStyle='rgba(120,200,255,0.7)';
      ctx.fillStyle='rgba(120,200,255,0.12)';
      ctx.beginPath();ctx.arc(tx,ty,range,0,Math.PI*2);
      ctx.fill();ctx.stroke();
      break;
    }
    case'fire':case'toxic':case'fan':{
      const dir=cell.towerDirection||[0,1];
      const angle=Math.atan2(dir[0],dir[1]);
      const baseLen=towerEffectiveRange(type,cell.rangeLvl||0)*CELL_SIZE;
      if(isUltimateTower(cell)){
        const ultLen=CELL_SIZE*10;
        const ultHalfRange=CELL_SIZE*3;
        const halfAngle=Math.PI/2;
        ctx.fillStyle='rgba(255,100,40,0.25)';
        ctx.strokeStyle='rgba(255,100,40,0.7)';
        ctx.beginPath();
        ctx.moveTo(tx,ty);
        ctx.arc(tx,ty,ultLen,angle-halfAngle,angle+halfAngle);
        ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='rgba(255,150,80,0.2)';
        ctx.beginPath();ctx.arc(tx,ty,ultHalfRange,0,Math.PI*2);ctx.fill();
      } else {
        const halfAngle=Math.PI/5;
        ctx.strokeStyle='rgba(255,100,40,0.7)';
        ctx.fillStyle='rgba(255,100,40,0.3)';
        ctx.beginPath();
        ctx.moveTo(tx,ty);
        ctx.arc(tx,ty,baseLen,angle-halfAngle,angle+halfAngle);
        ctx.closePath();ctx.fill();ctx.stroke();
      }
      break;
    }
    case'lamp':{
      const range=towerEffectiveRange('lamp',(cell.towerLevel||1)-1)*CELL_SIZE;
      ctx.strokeStyle='rgba(255,230,120,0.7)';
      ctx.fillStyle='rgba(255,230,120,0.1)';
      ctx.beginPath();ctx.arc(tx,ty,range,0,Math.PI*2);
      ctx.fill();ctx.stroke();
      break;
    }
    case'cannon':{
      const alive=enemies.filter(e=>canTargetEnemy(e)&&!e.reachedEnd);
      let aimX=tx+CELL_SIZE*30,aimY=ty;
      if(alive.length>0){
        const t=alive.reduce((a,b)=>(Math.hypot(b.x-tx,b.y-ty)<Math.hypot(a.x-tx,a.y-ty))?b:a);
        aimX=t.x;aimY=t.y;
      }
      ctx.strokeStyle='rgba(255,150,50,0.55)';
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(aimX,aimY);ctx.stroke();
      break;
    }
        case'nuke':{
      // ★ 仅画范围提示，不结算伤害（真伤害在 towerAttack 里）
      ctx.strokeStyle='rgba(255,80,40,0.6)';
      ctx.fillStyle='rgba(255,80,40,0.15)';
      ctx.beginPath();
      ctx.arc(tx, ty, CELL_SIZE*2.5, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

/* ---------- 2. 超级随机模式：礼盒放置 ---------- */
function placeRandomBox(row,col,boxName,cost){
  if(!devMode&&points<cost)return;
  if(!devMode)points-=cost;

  // 黄金/钻石宝盒有概率出怪
  let monsterChance=0;
  if(boxName==='黄金宝盒')monsterChance=0.2;
  else if(boxName==='钻石宝盒')monsterChance=0.3;
  if(Math.random()<monsterChance){
    const enemyPool=['zombie','slime','runner','ghost','drone','healer','thief','summoner','splitter','shielder'];
    const type=enemyPool[Math.floor(Math.random()*enemyPool.length)];
    const lvl=Math.min(MAX_LEVEL,waveNumber*2+5);
    const e=new Enemy(type,lvl);
    e.pathIndex=0;
    if(pathOrder.length>0){
      e.x=pathOrder[0][1]*CELL_SIZE+12;
      e.y=pathOrder[0][0]*CELL_SIZE+12;
      e.subX=e.x;e.subY=e.y;
    }
    enemies.push(e);
    spawnParticles(col*CELL_SIZE+12,row*CELL_SIZE+12,'#ff0000',15);
    alert(`💀 ${boxName}出了怪物: ${ENEMY_TYPES[type].emoji}${ENEMY_TYPES[type].name}!`);
    updateUI();
    return;
  }

  // 按礼盒等级分配炮塔池
  const towerPool=Object.keys(TOWER_TYPES).filter(t=>!TOWER_TYPES[t].isOneShot&&!TOWER_TYPES[t].isWireNet&&!TOWER_TYPES[t].isMirror&&!TOWER_TYPES[t].isSpecial);
  let pool;
  if(boxName==='青铜礼盒'){
    pool=towerPool.filter(t=>(TOWER_TYPES[t].cost||0)<=20&&!(TOWER_TYPES[t].crystalCost>0));
  } else if(boxName==='白银礼盒'){
    pool=towerPool.filter(t=>(TOWER_TYPES[t].cost||0)<=50&&!(TOWER_TYPES[t].crystalCost>0));
  } else if(boxName==='黄金宝盒'){
    pool=towerPool.filter(t=>((TOWER_TYPES[t].cost||0)>50&&(TOWER_TYPES[t].cost||0)<=100)||((TOWER_TYPES[t].crystalCost||0)<=50&&(TOWER_TYPES[t].crystalCost||0)>0));
  } else if(boxName==='钻石宝盒'){
    pool=towerPool.filter(t=>(TOWER_TYPES[t].cost||0)>100||(TOWER_TYPES[t].crystalCost||0)>50);
  }
  if(!pool||pool.length===0)pool=towerPool;

  const type=pool[Math.floor(Math.random()*pool.length)];
  const cell=grid[row][col];
  cell.type='tower';cell.towerType=type;
  cell.towerLevel=1+Math.floor(Math.random()*3);
  cell.towerAttackCD=0;cell.towerMaxHP=100;cell.towerHP=100;
  cell.atkLvl=0;cell.cdLvl=0;cell.rangeLvl=0;
  if(type==='fire'||type==='toxic'||type==='fan'){
    const nb=getPathNeighbors(row,col);
    cell.towerDirection=nb.length?[nb[0][0]-row,nb[0][1]-col]:[0,1];
  }
  spawnParticles(col*CELL_SIZE+12,row*CELL_SIZE+12,'#ffdd00',15);
  const t=TOWER_TYPES[type];
  alert(`🎁 ${boxName}开出: ${t.icon}${t.name}!`);
  updateUI();
}
window.placeRandomBox=placeRandomBox;

/* ---------- 修复1：让 update 分流安全化 ---------- */
// 覆盖原始 Enemy.prototype.update，在开头调用安全分流
(function(){
  const _origUpdate = Enemy.prototype.update;
  Enemy.prototype.update = function(dt){
    // 安全调用新Boss AI（先判断方法存在）
    const map = {
      devouring_serpent: '_updateDevouringSerpent',
      emperor_goose:     '_updateEmperorGoose',
      crystal_queen:     '_updateCrystalQueen',
      lin_yiqin:         '_updateLinYiqin',
      mirror_administrator: '_updateMirrorAdmin',
      crystal_spike:     '_updateCrystalSpike'
    };
    const fn = map[this.typeKey];
    if(fn && typeof this[fn] === 'function'){
      // 只走少量通用状态处理，再走专属AI
      if(this.frozen>0 && !this.immuneFrozen){ this.frozen-=dt; if(this.frozen<=0)this.frozen=0; }
      if(this.stunned>0){ this.stunned-=dt; if(this.stunned<=0)this.stunned=0; }
      if(this.burning>0){ this.burning-=dt; this.takeDamage(this.burnDPS*dt,'fire'); if(this.burning<=0){this.burning=0;this.burnDPS=0;} }
      if(this.poisoned>0){ this.poisoned-=dt; this.takeDamage(this.poisonDPS*dt,'poison'); if(this.poisoned<=0){this.poisoned=0;this.poisonDPS=0;} }
      if(this.flashTimer>0) this.flashTimer-=dt;
      if(this.atkDebuffTimer>0){ this.atkDebuffTimer-=dt; if(this.atkDebuffTimer<=0){this.atkDebuffTimer=0;this.atkDebuffAmount=0;} }
      this[fn](dt);
      return;
    }
    // 老逻辑
    return _origUpdate.call(this, dt);
  };
})();

      atkLvl: c.atkLvl||0,
      cdLvl: c.cdLvl||0,
      rangeLvl: c.rangeLvl||0,
      overloadTimer: c.overloadTimer||0,
      obstacleOverload: c.obstacleOverload||0,
      wireNetPair: c.wireNetPair||null,
      obstacleUpgrades: c.obstacleUpgrades||{},

      atkDebuffTimer: c.atkDebuffTimer||0,
      cdDebuffTimer: c.cdDebuffTimer||0,
      springCD: c.springCD||0,
            wasPath: !!c.wasPath,
      debuffs: c.debuffs ? {...c.debuffs} : undefined,
      // ★ 指挥部/防御部：只存可序列化的部分
      defenseCharge: c.defenseCharge||0,
      defenseMaxCharge: c.defenseMaxCharge||0,
      defenseRechargeTimer: c.defenseRechargeTimer||0
      // priorityTarget / defenseSource / commandTowers / commandTarget 
      // 含对象引用，故意丢弃（读档后需要重新设定优先目标）

  }));

/* ---------- 基础属性（不含 debuff） ---------- */
function towerEffectiveDmg(type, atkLvl){
  const t = TOWER_TYPES[type];
  return t ? Math.floor(t.dmg + t.dmgPerLvl * atkLvl) : 0;
}
function towerEffectiveCD(type, cdLvl){
  const t = TOWER_TYPES[type];
  return t ? Math.max(0.005, t.cd - t.cdPerLvl * cdLvl) : 1;
}
function towerEffectiveRange(type, rangeLvl, exempt){
  const t = TOWER_TYPES[type];
  let r = t ? (t.range + (t.rangePerLvl||0) * rangeLvl) : 3;
  if(!exempt && weatherType === 'fog' && type !== 'lamp') r *= 0.7;
  return r;
}

/* ---------- 实际生效属性（含林易秦 debuff） ---------- */
function towerDmg(type, cell){
  const t = TOWER_TYPES[type];
  const lvl = t.fields ? (cell.atkLvl||0) : (cell.towerLevel||0);
  let d = towerEffectiveDmg(type, lvl);
  if(cell.atkDebuffTimer > 0) d = Math.floor(d * 0.7);
  if(cell.debuffs && cell.debuffs.weak) d = Math.floor(d * 0.6);
  return d;
}
function towerCD(type, cell){
  const t = TOWER_TYPES[type];
  const lvl = t.fields ? (cell.cdLvl||0) : (cell.towerLevel||0);
  let cd = towerEffectiveCD(type, lvl);
  if(cell.debuffs && cell.debuffs.slow) cd *= 2;
  cd *= (cell.cdDebuffTimer>0 ? 1.5 : 1);
  // ★ 雪天：非豁免炮塔攻速 -15%（冷却 ÷0.85）
  const inLamp = cell.row!==undefined && isCellInLampRange(cell.row, cell.col);
  if(!inLamp && weatherType==='snow' && type!=='fire' && type!=='lamp'){
    cd /= 0.85;
  }
  return Math.max(0.005, cd);
}
/* ---------- 实际生效射程（含 debuff） ---------- */
function towerRange(type, cell){
  const t = TOWER_TYPES[type];
  if(!t) return 3;
  const lvl = t.fields ? (cell.rangeLvl||0) : (cell.towerLevel||0);
  const inLamp = cell.row!==undefined && isCellInLampRange(cell.row, cell.col);
  let r = towerEffectiveRange(type, lvl, inLamp);
  if(cell.debuffs && cell.debuffs.blind) r *= 0.7;
  return r;
}
/* ---------- 解锁判定 ---------- */
function isTowerUnlocked(type){
  if(devMode || gameMode === 'season') return true;
  const t = TOWER_TYPES[type];
  if(!t) return false;
  // ★ 所有炮塔统一按 TOWER_UNLOCK_WAVE 判定，未定义的默认解锁
  return TOWER_UNLOCK_WAVE[type] !== undefined ? TOWER_UNLOCK_WAVE[type] <= waveNumber : true;
}
function isObstacleUnlocked(type){
  if(devMode || gameMode === 'season') return true;
  const o = OBSTACLE_TYPES[type];
  if(!o) return false;
  return o.unlockWave !== undefined ? o.unlockWave <= waveNumber : true;
}

/* ---------- 究极/满级/前置判定 ---------- */
function isUltimateTower(cell){
  const t = TOWER_TYPES[cell.towerType];
  if(!t) return false;
  if(t.fields){
    if(cell.atkLvl < 16 || cell.cdLvl < 16) return false;
    if(t.rangePerLvl > 0 && cell.rangeLvl < 16) return false;
    return true;
  }
  return cell.towerLevel >= 16;
}
function isTowerMaxed(cell){
  const t = TOWER_TYPES[cell.towerType];
  if(!t) return false;
  const maxLvl = t.maxLvl || MAX_TOWER_LVL;
  if(t.fields){
    if((cell.atkLvl||0) < maxLvl || (cell.cdLvl||0) < maxLvl) return false;
    if(t.rangePerLvl > 0 && (cell.rangeLvl||0) < maxLvl) return false;
    return true;
  }
  return (cell.towerLevel||0) >= maxLvl;
}
function canPlantOn(row,col,towerType){
  const td=TOWER_TYPES[towerType];
  if(!td.requiresMaxed)return true;
  const cell=grid[row][col];
  if(!cell||cell.type!=='tower')return false;
  if(cell.towerType!==td.requiresMaxed)return false;
  // 只需底塔15级
  if(td.fields){
    if((cell.atkLvl||0)<15)return false;
    if((cell.cdLvl||0)<15)return false;
    if(td.rangePerLvl>0&&(cell.rangeLvl||0)<15)return false;
    return true;
  }
  return (cell.towerLevel||0)>=15;
}

/* ============================================================
   ★ v10.4 恶食之蛇：贪吃蛇样式

/* ---------- 1. 记录蛇身轨迹 ---------- */
(function(){
  const _origDevour = Enemy.prototype._updateDevouringSerpent;
  Enemy.prototype._updateDevouringSerpent = function(dt){
    // 初始化轨迹（沿 wanderAngle 反方向铺开）
    if(!this._segments || this._segments.length === 0){
      this._segments = [];
      const ang = this.wanderAngle || 0;
      for(let i=0;i<240;i++){
        this._segments.push({
          x: this.x - Math.cos(ang)*i*1.6,
          y: this.y - Math.sin(ang)*i*1.6
        });
      }
    }

    _origDevour.call(this, dt);

    // 按距离采样新头节点
    const head = this._segments[0];
    if(!head || Math.hypot(this.x-head.x, this.y-head.y) > 3){
      this._segments.unshift({x:this.x, y:this.y});
      const MAX_SEG = 260;
      if(this._segments.length > MAX_SEG) this._segments.length = MAX_SEG;
    }
  };
})();

/* ---------- 2. 贪吃蛇绘制 ---------- */
Enemy.prototype._drawSerpent = function(ctx){
  if(!this.alive && !this.reachedEnd) return;
  if(this.reachedEnd && this.removeTimer<=0) return;

  if(!this._segments || this._segments.length === 0){
    this._segments = [];
    const ang = this.wanderAngle||0;
    for(let i=0;i<240;i++){
      this._segments.push({
        x: this.x - Math.cos(ang)*i*1.6,
        y: this.y - Math.sin(ang)*i*1.6
      });
    }
  }

  const segs = this._segments;
  const headX = this.x, headY = this.y;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const BODY_COUNT = 16;   // 可见身体节数
  const STEP       = 7;    // 每节取样的索引间隔

  const neckIdx = Math.min(segs.length-1, STEP);
  const neck    = segs[neckIdx] || {x:headX, y:headY};
  const headAngle = Math.atan2(headY-neck.y, headX-neck.x);

  const now = performance.now();

  /* ---------- 身体（从尾到头） ---------- */
  for(let i = BODY_COUNT-1; i >= 0; i--){
    const idx = Math.min(segs.length-1, (i+1)*STEP);
    const p   = segs[idx] || {x:headX, y:headY};
    const t   = i / BODY_COUNT;               // 0 = 靠近头, 1 = 尾
    const r   = 12 - t*6;

    // 垂直方向摆动
    const wave  = Math.sin(now*0.008 - i*0.55) * (1.5 + t*3.5);
    const perpX = -Math.sin(headAngle);
    const perpY =  Math.cos(headAngle);
    const px = p.x + perpX*wave;
    const py = p.y + perpY*wave;

    // 阴影
    ctx.beginPath();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.arc(px+1.5, py+2, r, 0, Math.PI*2);
    ctx.fill();

    // 身体
    const hue   = 105 - t*30;
    const light = 34 + t*10;
    ctx.beginPath();
    ctx.fillStyle = `hsl(${hue}, 60%, ${light}%)`;
    ctx.arc(px, py, r, 0, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(18,45,10,0.9)';
    ctx.stroke();

    // 鳞片花纹
    if(i % 2 === 0){
      ctx.beginPath();
      ctx.fillStyle = 'rgba(200,255,130,0.35)';
      ctx.arc(px, py, r*0.45, 0, Math.PI*2);
      ctx.fill();
    }
  }

  /* ---------- 蛇头 ---------- */
  const hr = 13;
  ctx.translate(headX, headY);
  ctx.rotate(headAngle);

  const flashing = (this.flashTimer>0 && Math.floor(this.flashTimer*30)%2===0);
  ctx.beginPath();
  ctx.fillStyle = flashing ? '#ffffff' : '#3f7d22';
  ctx.ellipse(0, 0, hr+3, hr, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#1a3a10';
  ctx.stroke();

  // 眼睛
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();ctx.arc(5,-5,3.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(5, 5,3.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle = this.eating ? '#ff2020' : '#cc0000';
  ctx.beginPath();ctx.arc(6.5,-5,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(6.5, 5,2,0,Math.PI*2);ctx.fill();

  // 吐信子
  ctx.strokeStyle = '#ff3355';
  ctx.lineWidth = 2;
  const tongue = Math.sin(now*0.02)*3;
  ctx.beginPath();
  ctx.moveTo(hr+2, 0);
  ctx.lineTo(hr+12, tongue*0.4);
  ctx.lineTo(hr+18, tongue-4);
  ctx.moveTo(hr+12, tongue*0.4);
  ctx.lineTo(hr+18, tongue+4);
  ctx.stroke();

  ctx.restore();

  /* ---------- 进食特效 ---------- */
  if(this.eating){
    const pulse = 4 + Math.sin(now*0.02)*3;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,200,0,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(headX, headY, hr+6+pulse, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('吞噬中...', headX, headY - hr - 46);
    ctx.restore();
  }

  /* ---------- 血条 ---------- */
  const barWidth = 64, barHeight = 6;
  const barX = headX - barWidth/2;
  const barY = headY - hr - 32;

  ctx.fillStyle = '#222';
  ctx.fillRect(barX, barY, barWidth, barHeight);
  const ratio = Math.max(0, Math.min(1, this.hp/this.maxHP));
  ctx.fillStyle = ratio>0.5 ? '#4caf50' : ratio>0.25 ? '#ff9800' : '#f44336';
  ctx.fillRect(barX, barY, barWidth*ratio, barHeight);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barWidth, barHeight);

  ctx.fillStyle = '#e0ffe0';
  ctx.font = 'bold 10px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`🐍 ${this.name} Lv${this.level}  ${Math.floor(this.hp)}/${this.maxHP}`, headX, barY - 2);
  ctx.textBaseline = 'middle';

  /* ---------- 状态图标 ---------- */
  let sy = barY - 18;
  if(this.burning>0){ctx.fillText('🔥', headX, sy); sy -= 12;}
  if(this.frozen>0){ctx.fillText('❄️', headX, sy); sy -= 12;}
  if(this.poisoned>0){ctx.fillText(`☣️${this.poisonStacks}`, headX, sy); sy -= 12;}
  if(this.atkDebuffTimer>0){ctx.fillText('⬇️', headX, sy); sy -= 12;}
};

/* ---------- 3. 拦截 draw，走蛇形绘制 ---------- */

/* 框选批量操作跳过镜像塔 */
(function(){
  const _origUp = quickUpgradeInRect;
  quickUpgradeInRect = function(r1,c1,r2,c2){
    const minR=Math.min(r1,r2),maxR=Math.max(r1,r2),minC=Math.min(c1,c2),maxC=Math.max(c1,c2);
    for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){
      if(grid[r][c].isMirrorTower) grid[r][c]._skipQuick=true;
    }
    // 临时把它当 noUpgrade 处理：直接手动筛选
    let totalCost=0,totalCrystal=0;
    for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){
      const cell=grid[r][c];
      if(cell.type!=='tower'||cell.isMirrorTower)continue;
      const t=TOWER_TYPES[cell.towerType];
      if(!t||t.noUpgrade||t.isOneShot||t.isWireNet)continue;
      if(t.fields){
        if(cell.atkLvl<MAX_TOWER_LVL){if(cell.atkLvl>=ULTIMATE_THRESHOLD)totalCrystal+=crystalCostForLevel(cell.atkLvl);else totalCost+=Math.floor((cell.atkLvl+1)*8+10);}
        if(cell.cdLvl<MAX_TOWER_LVL){if(cell.cdLvl>=ULTIMATE_THRESHOLD)totalCrystal+=crystalCostForLevel(cell.cdLvl);else totalCost+=Math.floor((cell.cdLvl+1)*8+10);}
        if(t.rangePerLvl>0&&cell.rangeLvl<MAX_TOWER_LVL){if(cell.rangeLvl>=ULTIMATE_THRESHOLD)totalCrystal+=crystalCostForLevel(cell.rangeLvl);else totalCost+=Math.floor((cell.rangeLvl+1)*8+10);}
      } else if(cell.towerLevel<(t.maxLvl||MAX_TOWER_LVL)){
        if(cell.towerLevel>=ULTIMATE_THRESHOLD)totalCrystal+=crystalCostForLevel(cell.towerLevel);else totalCost+=Math.floor((cell.towerLevel+1)*8+10);
      }
    }
    if(totalCost===0&&totalCrystal===0)return;
    if(!devMode&&points<totalCost){alert(`点数不足！需要${totalCost}pt`);return;}
    if(!devMode&&crystals<totalCrystal){alert(`水晶不足！需要💎${totalCrystal}`);return;}
    if(!devMode){points-=totalCost;crystals-=totalCrystal;}
    let upgraded=0;
    for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){
      const cell=grid[r][c];
      if(cell.type!=='tower'||cell.isMirrorTower)continue;
      const t=TOWER_TYPES[cell.towerType];
      if(!t||t.noUpgrade||t.isOneShot||t.isWireNet)continue;
      if(t.fields){
        if(cell.atkLvl<MAX_TOWER_LVL){cell.atkLvl++;upgraded++;}
        if(cell.cdLvl<MAX_TOWER_LVL){cell.cdLvl++;upgraded++;}
        if(t.rangePerLvl>0&&cell.rangeLvl<MAX_TOWER_LVL){cell.rangeLvl++;upgraded++;}
      } else if(cell.towerLevel<(t.maxLvl||MAX_TOWER_LVL)){cell.towerLevel++;upgraded++;}
    }
    alert(`✅ 升级${upgraded}项，花费${totalCost}pt+💎${totalCrystal}`);
    updateUI();
  };
  window.quickUpgradeInRect = quickUpgradeInRect;
})();

/* ============================================================
   ★ v10.5 究极盗贼重做
   仍属究极怪物：沿路径行走、可被攻击/控制、有究极光环
   行进中会周期性跳到附近炮塔头顶，悬停2s，偷3×3范围内3~9座+1000点数
   ============================================================ */
Enemy.prototype._updateUltimateThief = function(dt){
  /* ---------- 通用状态（和普通敌人一致） ---------- */
  if(this.frozen>0) this.frozen -= dt;
  if(this.stunned>0) this.stunned -= dt;
  if(this.burning>0){ this.burning -= dt; this.takeDamage(this.burnDPS*dt,'fire'); if(this.burning<=0){this.burning=0;this.burnDPS=0;} }
  if(this.poisoned>0){ this.poisoned -= dt; this.takeDamage(this.poisonDPS*dt,'poison'); if(this.poisoned<=0){this.poisoned=0;this.poisonDPS=0;} }
  if(this.shocked>0){ this.shocked -= dt; if(this.shocked<=0){this.shocked=0;this.corrosionStacks=0;} }
  if(this.wet>0) this.wet -= dt;
  if(this.slowed>0 && this.special!=='immuneslow'){
    this.slowed -= dt;
    if(this.slowed<=0){ this.slowed=0; this.slowAmount=0; }
  }
  if(this.flashTimer>0) this.flashTimer -= dt;
  if(this.atkDebuffTimer>0){ this.atkDebuffTimer -= dt; if(this.atkDebuffTimer<=0){this.atkDebuffTimer=0;this.atkDebuffAmount=0;} }

  /* ---------- 究极光环（保持属于究极怪物） ---------- */
  if(this.ultimateAura){
    for(const e of enemies){
      if(e===this || !e.alive || e._ultimateBuffed) continue;
      e.speed *= 1.05; e.armor += 1; e._ultimateBuffed = true;
    }
  }

  /* ---------- 状态机 ---------- */
  if(!this.thiefPhase) this.thiefPhase = 'walk';

  /* ================= 阶段1：沿路径行走 + 扫描炮塔 ================= */
  if(this.thiefPhase === 'walk'){
    let effSpeed = this.speed;
    if(this.frozen>0) effSpeed *= 0.05;
    else if(this.slowed>0 && this.special!=='immuneslow') effSpeed *= (1-this.slowAmount);
    if(effSpeed < 0.05) effSpeed = 0.05;

    if(this.stunned<=0 && this.frozen<=0){
      if(this.pathIndex < pathOrder.length-1){
        const [tr,tc] = pathOrder[this.pathIndex+1];
        const tx = tc*CELL_SIZE+12, ty = tr*CELL_SIZE+12;
        const dx = tx-this.subX, dy = ty-this.subY;
        const dist = Math.hypot(dx,dy);
        const move = effSpeed*CELL_SIZE*dt;
        if(dist <= move){
          this.subX = tx; this.subY = ty;
          this.pathIndex++;
        } else {
          this.subX += (dx/dist)*move;
          this.subY += (dy/dist)*move;
        }
        this.x = this.subX; this.y = this.subY;
      } else {
        /* 到达终点：按普通敌人处理 */
        this.reachedEnd = true; this.alive = false; this.removeTimer = 0.35;
        damageBase(this.getAtkDamage(), this.name);
        return;
      }
    }

    /* 周期性扫描附近 3.5 格内是否有炮塔 */
    this.thiefScanCD = (this.thiefScanCD || 2) - dt;
    if(this.thiefScanCD <= 0){
      this.thiefScanCD = 2;
      const towers = [];
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        const cell = grid[r][c];
        if(cell.type==='tower' && !cell.isMirrorTower){
          const d = Math.hypot(r*CELL_SIZE+12-this.y, c*CELL_SIZE+12-this.x);
          if(d < CELL_SIZE*3.5) towers.push([r,c]);
        }
      }
      if(towers.length > 0){
        this.thiefTarget = towers[Math.floor(Math.random()*towers.length)];
        this.thiefPhase = 'dash';
        this.thiefDashTimer = 1.0;
        this.thiefDashStart = {x:this.x, y:this.y};
        this.thiefDashEnd = {
          x: this.thiefTarget[1]*CELL_SIZE+12,
          y: this.thiefTarget[0]*CELL_SIZE+12
        };
        spawnParticles(this.x, this.y, '#222222', 12);
      }
    }
  }
  /* ================= 阶段2：跳向炮塔（弧线） ================= */
  else if(this.thiefPhase === 'dash'){
    this.thiefDashTimer -= dt;
    const t = Math.max(0, Math.min(1, 1 - this.thiefDashTimer/1.0));
    const sx = this.thiefDashStart.x, sy = this.thiefDashStart.y;
    const ex = this.thiefDashEnd.x, ey = this.thiefDashEnd.y;
    this.x = sx + (ex-sx)*t;
    this.y = sy + (ey-sy)*t - Math.sin(t*Math.PI)*CELL_SIZE*1.2;
    this.subX = this.x; this.subY = this.y;
    if(this.thiefDashTimer <= 0){
      this.x = ex; this.y = ey;
      this.subX = this.x; this.subY = this.y;
      this.thiefPhase = 'wait';
      this.thiefWaitTimer = 2;    // ★ 悬停 2 秒
      spawnParticles(this.x, this.y, '#ffdd00', 15);
    }
  }
  /* ================= 阶段3：悬停2秒（预警） ================= */
  else if(this.thiefPhase === 'wait'){
    this.thiefWaitTimer -= dt;
    if(Math.random() < 0.35) spawnParticles(this.x, this.y, '#ffcc00', 2);
    if(this.thiefWaitTimer <= 0){
      this._doUltimateThiefSteal();
      this.thiefPhase = 'return';
      this.thiefReturnTimer = 0.8;
      this.thiefReturnStart = {x:this.x, y:this.y};
      /* 回到路径上最近的下一个节点 */
      let nearestIdx = this.pathIndex;
      let nearestDist = Infinity;
      for(let i = this.pathIndex; i < Math.min(pathOrder.length, this.pathIndex+8); i++){
        if(!pathOrder[i]) continue;
        const [rr,cc] = pathOrder[i];
        const d = Math.hypot(rr*CELL_SIZE+12-this.y, cc*CELL_SIZE+12-this.x);
        if(d < nearestDist){ nearestDist = d; nearestIdx = i; }
      }
      this.pathIndex = nearestIdx;
      this.thiefReturnEnd = {
        x: pathOrder[nearestIdx][1]*CELL_SIZE+12,
        y: pathOrder[nearestIdx][0]*CELL_SIZE+12
      };
    }
  }
  /* ================= 阶段4：跳回路径 ================= */
  else if(this.thiefPhase === 'return'){
    this.thiefReturnTimer -= dt;
    const t = Math.max(0, Math.min(1, 1 - this.thiefReturnTimer/0.8));
    const sx = this.thiefReturnStart.x, sy = this.thiefReturnStart.y;
    const ex = this.thiefReturnEnd.x, ey = this.thiefReturnEnd.y;
    this.x = sx + (ex-sx)*t;
    this.y = sy + (ey-sy)*t - Math.sin(t*Math.PI)*CELL_SIZE*1.2;
    this.subX = this.x; this.subY = this.y;
    if(this.thiefReturnTimer <= 0){
      this.x = ex; this.y = ey;
      this.subX = this.x; this.subY = this.y;
      this.thiefPhase = 'walk';
      this.thiefScanCD = 3;    // 返回后3秒冷却
    }
  }
};

/* ---------- 偷取逻辑（3×3内3~9座 + 1000点数） ---------- */
Enemy.prototype._doUltimateThiefSteal = function(){
  if(!this.thiefTarget) return;
  const [tr,tc] = this.thiefTarget;

    const allTowers = [];
  for(let dr=-1; dr<=1; dr++)for(let dc=-1; dc<=1; dc++){
    const nr = tr+dr, nc = tc+dc;
    if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
    const cell = grid[nr][nc];
    if(cell.type==='tower' && !cell.isMirrorTower && !cell.defenseProtected){
      allTowers.push([nr,nc]);
    }
  }
  if(allTowers.length===0) return;
  const want  = 3 + Math.floor(Math.random()*7);
  const count = Math.min(allTowers.length, want);
  shuffleArray(allTowers);

  for(let i=0;i<count;i++){
    const [r,c] = allTowers[i];
    const cell = grid[r][c];
    if(cell.towerType==='wireNet' && cell.wireNetPair){
      const [pr,pc] = cell.wireNetPair;
      if(grid[pr]?.[pc]) grid[pr][pc].wireNetPair=null;
    }
    cell.type='empty'; cell.towerType=null;
    cell.towerHP=0; cell.towerMaxHP=0;
    cell.atkLvl=0; cell.cdLvl=0; cell.rangeLvl=0; cell.towerLevel=0;
    spawnParticles(c*CELL_SIZE+12, r*CELL_SIZE+12, '#222222', 12);
  }

  clampPoints(-1000);          // ★ 偷 1000 点数
  updateUI();
  spawnParticles(this.x, this.y, '#ff8800', 25);
  screenShake = Math.max(screenShake, 18);

  const box = document.createElement('div');
  box.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);'+
    'background:#2a1a1a;color:#ffaa00;padding:8px 16px;border-radius:8px;'+
    'border:2px solid #ff8800;z-index:400;font-size:0.85em;';
  box.textContent = `🏴‍☠️ 究极盗贼偷走 ${count} 座炮塔 + 1000 点数！`;
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 2200);
};

const ACHIEVEMENTS = {
  beyondLife:   { name:'超越生死',   icon:'🗿', desc:'使用一次不死图腾' },
  wealthSpring: { name:'财富源泉',   icon:'⛏️', desc:'献祭一次水晶矿场' },
  lavaBurst:    { name:'火炎焱燚',   icon:'🌋', desc:'让岩浆产生爆裂效果' },
  collector:    { name:'炮塔收藏者', icon:'🏗️', desc:'场上同时出现所有炮塔与障碍物（一次性除外）' },
  lastStand:    { name:'破釜沉舟',   icon:'💣', desc:'献祭一个满级高射炮' },
  sleeper:      { name:'沉睡者',     icon:'👑', desc:'击败一个大Boss' }
};

const ACH_KEY = 'td_achievements_v104';
let achievementUnlocked = (()=>{ try{ return JSON.parse(localStorage.getItem(ACH_KEY)) || {}; }catch(e){ return {}; } })();

function saveAchievements(){
  try{ localStorage.setItem(ACH_KEY, JSON.stringify(achievementUnlocked)); }catch(e){}
}

function unlockAchievement(id){
  const a = ACHIEVEMENTS[id];
  if(!a || achievementUnlocked[id]) return false;
  achievementUnlocked[id] = Date.now();
  saveAchievements();
  if(typeof showToast === 'function'){
    showToast(`🏆 成就解锁\n${a.icon} ${a.name}`, 'gold', 3200);
  }
  return true;
}
window.unlockAchievement = unlockAchievement;

/* ---------- 1. 超越生死：不死图腾 ---------- */
(function(){
  const _orig = window.triggerGameOver;
  window.triggerGameOver = function(){
    const before = baseTotems;
    const r = _orig.apply(this, arguments);
    if(baseTotems < before) unlockAchievement('beyondLife');
    return r;
  };
})();

/* ---------- 2&5. 献祭：水晶矿场 / 满级高射炮 ---------- */
(function(){
  const _orig = window.sacrificeAndRefund;
  window.sacrificeAndRefund = function(row, col){
    const cell = grid[row] && grid[row][col];
    const wasOverloaded = !!(cell && cell.overloadTimer > 0);
    const isMine      = !!(cell && cell.type==='tower' && cell.towerType==='mine');
    const isMaxCannon = !!(cell && cell.type==='tower' && cell.towerType==='cannon'
                           && typeof isTowerMaxed === 'function' && isTowerMaxed(cell));
    const r = _orig.apply(this, arguments);
    if(cell && !wasOverloaded && cell.overloadTimer > 0){
      if(isMine)      unlockAchievement('wealthSpring');
      if(isMaxCannon) unlockAchievement('lastStand');
    }
    return r;
  };
})();

/* ---------- 3. 火炎焱燚：岩浆爆裂 ---------- */
(function(){
  const _orig = window.triggerLavaBurst;

    unlockAchievement('lavaBurst');
    return _orig.apply(this, arguments);

})();

/* ---------- 4. 炮塔收藏者 ---------- */
function checkCollectorAchievement(){
  if(achievementUnlocked.collector) return;
  const needTowers = Object.keys(TOWER_TYPES).filter(k => !TOWER_TYPES[k].isOneShot);
  const needObs    = Object.keys(OBSTACLE_TYPES);
  const hasT = new Set(), hasO = new Set();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell = grid[r][c];
    if(cell.type==='tower' && cell.towerType && !cell.isMirrorTower) hasT.add(cell.towerType);
    if(cell.type==='obstacle' && cell.obstacleType)                  hasO.add(cell.obstacleType);
  }
  if(needTowers.every(k=>hasT.has(k)) && needObs.every(k=>hasO.has(k))){
    unlockAchievement('collector');
  }
}
window.checkCollectorAchievement = checkCollectorAchievement;

(function(){
  const _orig = window.placeItem;
  window.placeItem = function(){
    const r = _orig.apply(this, arguments);
    checkCollectorAchievement();
    return r;
  };
})();

const LARGE_BOSS_KEYS_ACH = ['boss_jiawei','boss_bomber','devouring_serpent','emperor_goose','crystal_queen'];
(function(){
  const _orig = Enemy.prototype.die;
  Enemy.prototype.die = function(){
