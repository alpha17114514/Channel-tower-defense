/* ============================================================
   通道塔防 v10.3 — 主逻辑（第 1/2 段）
   ============================================================ */

/* ========== 基础常量 ========== */
const ROWS=20, COLS=30, CELL_SIZE=24;
const canvas=document.getElementById('gameCanvas');
canvas.width=COLS*CELL_SIZE; canvas.height=ROWS*CELL_SIZE;
const ctx=canvas.getContext('2d');

/* DOM 缓存 */


/* ========== Toast 提示系统（v10.4 P0 修复） ========== */
function showToast(msg, type='info', duration=2200){
  let container = document.getElementById('toastContainer');
  if(!container){
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);'
      + 'z-index:650;display:flex;flex-direction:column;gap:6px;pointer-events:none;'
      + 'align-items:center;max-width:90vw;';
    document.body.appendChild(container);
  }
  const colors = {
    info:    {bg:'#1e2e3e', border:'#44aaff', color:'#cceaff'},
    success: {bg:'#1e2e1e', border:'#44ff44', color:'#ccffcc'},
    warn:    {bg:'#2e2e1e', border:'#ffaa00', color:'#ffeeaa'},
    error:   {bg:'#2e1e1e', border:'#ff4444', color:'#ffcccc'},
    gold:    {bg:'#2e2a1e', border:'#f0c040', color:'#ffdd88'}
  };
  const c = colors[type] || colors.info;
  const toast = document.createElement('div');
  toast.style.cssText = `background:${c.bg};color:${c.color};border:2px solid ${c.border};`
    + `padding:8px 16px;border-radius:10px;font-size:0.85em;`
    + `box-shadow:0 6px 20px rgba(0,0,0,0.6);`
    + `opacity:0;transform:translateY(-10px);`
    + `transition:opacity .22s ease,transform .22s ease;`
    + `white-space:pre-line;text-align:center;font-family:inherit;`;
  toast.textContent = String(msg);
  container.appendChild(toast);
  requestAnimationFrame(()=>{
    toast.style.opacity='1';
    toast.style.transform='translateY(0)';
  });
  setTimeout(()=>{
    toast.style.opacity='0';
    toast.style.transform='translateY(-10px)';
    setTimeout(()=>toast.remove(), 260);
  }, duration);
}
window.showToast = showToast;

/* 覆盖原生 alert —— 全站所有 alert() 自动变成非阻塞 toast */
(function(){
  window.alert = function(msg){
    // 简单分类：含"不足"/"失败"/"损坏"/"摧毁"→ error，含"成功"/"已"→ success，其余 warn
    const s = String(msg);
    let t = 'warn';
    if(/不足|失败|损坏|错误|摧毁|没/.test(s)) t = 'error';
    else if(/成功|已保存|已读取|已开启|已退出|已升级|获得|解锁|生效/.test(s)) t = 'success';
    else if(/💰|pt|💎|奖励|返还|偷走/.test(s)) t = 'gold';
    showToast(s, t, 2400);
  };
})();

/* ========== 新手引导（v10.4 P0 修复） ========== */
let tutorialShown = {};
function tryShowTutorial(key, msg, type='info', duration=3500){
  if(gameMode!=='normal') return;              // 只在普通模式引导
  if(waveNumber>3) return;                     // 第 3 波后不再打扰
  if(tutorialShown[key]) return;
  tutorialShown[key] = true;
  setTimeout(()=>showToast(msg, type, duration), 350);
}
window.tryShowTutorial = tryShowTutorial;
const _domCache={};
function _$(id){ if(!_domCache[id]) _domCache[id]=document.getElementById(id); return _domCache[id]; }

/* 主题配色 */

function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function isAffixOnce(a){return a&&a.once===true;}
function isAffixConsumed(a){if(!a)return true;if(isAffixOnce(a))return isAffixUsedInCurrentMode(a.id);return false;}

let fortressRefreshCount=0;
function showAffixSelection(){
  fortressRefreshCount=2;
  const available=AFFIX_POOL.filter(a=>!isAffixConsumed(a));
  const pool=shuffleArray([...available]).slice(0,5);
  renderAffixSelection(pool,[]);
}
function renderAffixSelection(pool,chosen){
  const cnt=chosen.length;
  let html=`<div class="modal-overlay"><div class="modal" style="max-width:500px;"><h3>🎯 选择词条 (${cnt}/2)</h3><p style="color:#888;font-size:0.8em;">选择2个词条，可刷新${fortressRefreshCount}次</p>`;
  html+=`<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">`;
  pool.forEach((a,i)=>{
    const sel=chosen.includes(i);
    html+=`<div onclick="toggleAffix(${i})" style="padding:12px 16px;border-radius:8px;background:${sel?'#3a5a3a':'#2a2a3a'};border:2px solid ${sel?'#4a4':'#444'};cursor:pointer;width:140px;text-align:center;color:#ddd;">${a.name}<br><span style="font-size:0.7em;color:#aaa;">${a.desc}</span></div>`;
  });
  html+=`</div><div style="text-align:center;margin-top:12px;">`;
  if(cnt===2) html+=`<button onclick="confirmAffixes()">✅ 确认选择</button> `;
  if(fortressRefreshCount>0) html+=`<button onclick="refreshAffixes()">🔄 刷新 (${fortressRefreshCount}次)</button> `;
  html+=`<button onclick="document.getElementById('modalContainer').innerHTML=''">❌ 关闭</button>`;
  html+=`</div></div></div>`;
  document.getElementById('modalContainer').innerHTML=html;
  window._affixPool=pool; window._affixChosen=chosen;
}
window.toggleAffix=function(i){let c=[...window._affixChosen];if(c.includes(i))c=c.filter(x=>x!==i);else if(c.length<2)c.push(i);renderAffixSelection(window._affixPool,c);};
window.refreshAffixes=function(){if(fortressRefreshCount<=0)return;fortressRefreshCount--;const av=AFFIX_POOL.filter(a=>!isAffixConsumed(a));renderAffixSelection(shuffleArray([...av]).slice(0,5),[]);};
window.confirmAffixes=function(){
  window._affixChosen.map(i=>window._affixPool[i]).forEach(a=>{
    if(isAffixOnce(a)) markAffixUsed(a.id);
    a.effect();
  });
  document.getElementById('modalContainer').innerHTML='';
};

function clampPoints(amount,force){
  if(devMode){points=MAX_POINTS;return;}
  if(!force && gameMode==='season'&&seasonSubMode==='fortress'&&amount>0)return;
  points=Math.min(MAX_POINTS,Math.max(0,points+amount));
  if(gameMode==='season'&&amount>0){if(seasonSubMode==='experience'||seasonSubMode==='random')seasonScore+=amount;}
}
function clampCrystals(amount){if(devMode){crystals=MAX_CRYSTALS;return;}crystals=Math.min(MAX_CRYSTALS,Math.max(0,crystals+amount));}

/* ========== 网格初始化 ========== */
function initGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++) grid[r][c]={
      holeWaves:0,
      row:r, col:c,
      type:'empty',isPath:false,pathConnections:0,
      towerType:null,towerLevel:0,towerAttackCD:0,towerDirection:null,
      obstacleType:null,obstacleLevel:0,obstacleHP:0,obstacleMaxHP:0,
      stunned:0,barracksCD:0,barracksUnitType:null,
      atkLvl:0,cdLvl:0,rangeLvl:0,overloadTimer:0,obstacleOverload:0,
      wireNetPair:null,obstacleUpgrades:{},regenTimer:0,
      towerHP:0,towerMaxHP:0,protected:0,towerRepairCD:0,
      atkDebuffTimer:0,cdDebuffTimer:0,springCD:0,wasPath:false,
      priorityTarget:null,
      defenseProtected:false,defenseSource:null,
      defenseCharge:0,defenseMaxCharge:0,defenseRechargeTimer:0,
      commandTowers:null,commandTarget:null
    };
  }
  grid[START_ROW][START_COL].type='path'; grid[START_ROW][START_COL].isPath=true;
  grid[END_ROW][END_COL].type='path'; grid[END_ROW][END_COL].isPath=true;
}

/* ========== 路径工具 ========== */
function countPathNeighbors(r,c){let n=0;for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath)n++;}return n;}
function getPathNeighbors(r,c){const res=[];for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath)res.push([nr,nc]);}return res;}
function canDig(r,c){
  if(grid[r][c].isPath||grid[r][c].type==='tower'||grid[r][c].type==='obstacle')return false;
  const nb=getPathNeighbors(r,c);
  if(nb.length>2||nb.length===0)return false;
  for(const [nr,nc] of nb)if(grid[nr][nc].pathConnections+1>2)return false;
  if(nb.length===2){const [n1,n2]=nb;if(arePathCellsConnected(n1[0],n1[1],n2[0],n2[1],r,c))return false;}
  return true;
}
function arePathCellsConnected(r1,c1,r2,c2,er,ec){
  const vis=new Set();const q=[[r1,c1]];vis.add(`${r1},${c1}`);
  while(q.length){
    const [cr,cc]=q.shift();
    if(cr===r2&&cc===c2)return true;
    for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=cr+dr,nc=cc+dc;
      if(nr===er&&nc===ec)continue;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath&&!vis.has(`${nr},${nc}`)){vis.add(`${nr},${nc}`);q.push([nr,nc]);}
    }
  }
  return false;
}
function digCell(r,c){
  if(!canDig(r,c))return false;
  grid[r][c].type='path';grid[r][c].isPath=true;grid[r][c].pathConnections=countPathNeighbors(r,c);
  for(const [nr,nc] of getPathNeighbors(r,c))grid[nr][nc].pathConnections=countPathNeighbors(nr,nc);
  grid[START_ROW][START_COL].pathConnections=countPathNeighbors(START_ROW,START_COL);
  grid[END_ROW][END_COL].pathConnections=countPathNeighbors(END_ROW,END_COL);
  return true;
}
function digCellWithHistory(r,c){if(digCell(r,c)){digHistory.push([r,c]);return true;}return false;}
function undoDig(){
  if(gamePhase!=='digging')return;
  if(digHistory.length===0)return;
  const [r,c]=digHistory.pop();
  grid[r][c].type='empty';grid[r][c].isPath=false;grid[r][c].pathConnections=0;
  const nb=getPathNeighbors(r,c);
  for(const [nr,nc] of nb)grid[nr][nc].pathConnections=countPathNeighbors(nr,nc);
  grid[START_ROW][START_COL].pathConnections=countPathNeighbors(START_ROW,START_COL);
  grid[END_ROW][END_COL].pathConnections=countPathNeighbors(END_ROW,END_COL);
  pathOrder=[];pathCorners=[];
  updateUI();
}
function checkStartEndConnected(){
  const vis=new Set();const q=[[START_ROW,START_COL]];vis.add(`${START_ROW},${START_COL}`);
  while(q.length){
    const [cr,cc]=q.shift();
    if(cr===END_ROW&&cc===END_COL)return true;
    for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=cr+dr,nc=cc+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath&&!vis.has(`${nr},${nc}`)){vis.add(`${nr},${nc}`);q.push([nr,nc]);}
    }
  }
  return false;
}
function computePathCorners(){
  pathCorners=[];if(pathOrder.length<2)return;
  pathCorners.push(0);
  for(let i=1;i<pathOrder.length-1;i++){
    const [pr,pc]=pathOrder[i-1];const [cr,cc]=pathOrder[i];const [nr,nc]=pathOrder[i+1];
    if((cr-pr)!==(nr-cr)||(cc-pc)!==(nc-cc))pathCorners.push(i);
  }
  pathCorners.push(pathOrder.length-1);
}
function computePathOrder(){
  const vis=new Set();const parent={};const q=[[START_ROW,START_COL]];vis.add(`${START_ROW},${START_COL}`);
  let found=false;
  while(q.length&&!found){
    const [cr,cc]=q.shift();
    if(cr===END_ROW&&cc===END_COL){found=true;break;}
    for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=cr+dr,nc=cc+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath&&!vis.has(`${nr},${nc}`)){
        vis.add(`${nr},${nc}`);parent[`${nr},${nc}`]=[cr,cc];q.push([nr,nc]);
      }
    }
  }
  pathOrder=[];
  if(found){let cur=[END_ROW,END_COL];while(cur){pathOrder.unshift(cur);cur=parent[`${cur[0]},${cur[1]}`]||null;}}
  if(pathOrder.length>0)computePathCorners();
  return pathOrder.length>0;
}
function startDefensePhase(){
  if(!checkStartEndConnected()||!computePathOrder())return;
  if(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging')return;
  gamePhase='defense';digHistory=[];waveNumber=0;waveActive=false;waveBreakTimer=2;updateUI();
}

function damageBase(amount,sourceName){
  const dmg=Math.max(0,amount);
  if(gameMode==='season'&&seasonSubMode==='experience'){seasonScore=Math.max(0,seasonScore-dmg*2);updateSeasonHUD();return;}
  if(devMode){
    devDamageLog.unshift({time:new Date().toLocaleTimeString(),source:sourceName||'未知',damage:Math.floor(dmg)});
    if(devDamageLog.length>50)devDamageLog.pop();
    return;
  }
  if(baseInvincible>0)return;
  baseHP-=dmg;
  if(baseHP<0)baseHP=0;
  updateUI();
  if(baseHP<=0)triggerGameOver();
}

/* ========== Enemy 类 ========== */
class Enemy{
  constructor(typeKey,level){
    const t=ENEMY_TYPES[typeKey]||ENEMY_TYPES.zombie;
    this.typeKey=typeKey; this.name=t.name; this.emoji=t.emoji; this.level=Math.min(MAX_LEVEL,level);
    let spdBuff=1+bossBuffLevels.speed*0.10;
    let hpBuff=1+bossBuffLevels.health*0.25;
    this.maxHP=Math.floor(t.hp*(1+this.level*0.2)*hpBuff);
    this.hp=this.maxHP;
    this.speed=t.speed*(1+this.level*0.08)*spdBuff;
    this.armor=Math.floor(t.armor+this.level*2)+bossBuffLevels.armor*3;
    this.damage=Math.floor(t.damage+this.level*1.2);
    this.bounty=Math.floor(t.bounty+this.level*0.4);
    this.special=t.special||null; this.color=t.color;
    this.pathIndex=0; this.x=0; this.y=0; this.subX=0; this.subY=0;
    this.alive=true; this.reachedEnd=false; this.removeTimer=0;
    this.frozen=0; this.slowed=0; this.slowAmount=0; this.burning=0; this.burnDPS=0; this.stunned=0;
    this.wet=0; this.shocked=0; this.corrosionStacks=0; this.splitStage=0; this.flashTimer=0;
    this.flying=t.flying||false; this.poisoned=0; this.poisonDPS=0; this.poisonStacks=0;
    this.healCD=2; this.healAbility=(t.special==='healer');
    this.shockCD=0; this.shieldHP=(t.special==='shield')?80:0;
    this.summonCD=0; this.teleportCD=0; this.reflectCD=0;
    this.reflectChance=(t.special==='reflect')?0.25:0;
    this.ultimateAura=(this.typeKey.startsWith('ultimate_'))?true:false;
    
this.isBoss=(typeKey==='boss'||typeKey==='boss_jiawei'||typeKey==='boss_bomber'||typeKey==='boss_dancer'||typeKey==='boss_scholar'||NEW_BOSS_KEYS.includes(typeKey));
this.isFriendly = false;        // ★ 迷魂草转化
this.friendlyAtkCD = 0;         // ★ 友方攻击CD

this.invisible=(typeKey==='ghost'||typeKey==='ultimate_ghost');
    this.straightToBase=(t.special==='straight'||t.special==='carrier');
    this.isJiawei=(typeKey==='boss_jiawei');
    this.isBomberBoss=(typeKey==='boss_bomber');
    this.isDancer=(typeKey==='boss_dancer');
    this.isScholar=(typeKey==='boss_scholar');
    this.shieldAuraCD=0; this._ultimateBuffed=false;
    this.bomberCD=0; this.thiefStealCD=0;
    if(this.isBoss||this.isJiawei) bossEnemy=this;
    this.jiaweiSkillCD=0; this.bossSkillCD=0;
    this.immuneTowerType=null;
    this.tankFireCD=0;
    this.firePause=0;
    this.bomberSummonCD=3; this.bomberBombCD=5;
    this.dancerSummonCD=5;
    this.bossHealCD=5;
    this.superTombSummonCD=2;
    this.atkDebuffTimer=0; this.atkDebuffAmount=0;
    this.stolenByMarauder=false;
     if(this.isBomberBoss){this.straightToBase=true;this.flying=true;}

    // ★ v10.4 新Boss初始化
    this.immuneFrozen = t.immuneFrozen||false;
    this.invincible = false;
    // 恶食之蛇
    this.wanderAngle = Math.random()*Math.PI*2;
    this.eating = false; this.eatTimer = 0; this.eatTarget = null;
    this.devouredTowers = []; this.devouredMarkers = []; this.devourCount = 0;
    // 南极帝王鹅
    this.state = 'idle';
    this.chargeTimer = 0; this.dashTimer = 0; this.stunTimer = 0;
    this.chargeTarget = null; this.dashAngle = 0;
    // 水晶女王
    this.crystalSpikes = []; this.summonedInitial = false;
    this.elapsedTime = 0; this.resummonTimer = 0;
    // 林易秦
    this.debuffCD = 4; this.hitCount = 0; this.teleportFlash = 0;
    // 镜像管理者
    this.mirrorCD = 6; this.mirrors = [];
    // 减益字典（炮塔用）
    // (只对林易秦的受害者赋值，此处不设)

    if(t.isNewBoss){
      this.pathIndex = 99999;
      this.x = canvas.width/2 + (Math.random()-0.5)*200;
      this.y = canvas.height/2 + (Math.random()-0.5)*200;
      this.subX = this.x; this.subY = this.y;
      if(typeKey==='crystal_spike'){ this.pathIndex=-1; }
    } else {
      this.initPosition();
    }
  }
  initPosition(){
    if(pathOrder.length>0&&this.pathIndex>=0){
      const [r,c]=pathOrder[this.pathIndex];
      this.x=c*CELL_SIZE+12;this.y=r*CELL_SIZE+12;this.subX=this.x;this.subY=this.y;
    }
  }
  // ★ 掠夺者减攻 debuff 生效方法
  getAtkDamage(){
    let d=this.damage;
    if(this.atkDebuffTimer>0){d=Math.floor(d*(1-(this.atkDebuffAmount||0)));}
    return Math.max(1,d);
  }
  update(dt){
    if(this.reachedEnd){this.removeTimer-=dt;if(this.isBoss&&this.removeTimer<=0)bossEnemy=null;return;}
    if(!this.alive){if(this.isBoss)bossEnemy=null;return;}

    // 墓碑类
    if(this.typeKey==='tombstone'){
      if(this.frozen>0) this.frozen-=dt;
      if(this.burning>0){this.burning-=dt;this.takeDamage(this.burnDPS*dt,'fire');}
      if(this.poisoned>0){this.poisoned-=dt;this.takeDamage(this.poisonDPS*dt,'poison');}
      if(!this.tombstoneSummonCD) this.tombstoneSummonCD=3;
      this.tombstoneSummonCD-=dt;
      if(this.tombstoneSummonCD<=0){
        this.tombstoneSummonCD=3;
        const sz=new Enemy('zombie',Math.min(MAX_LEVEL,this.level));
        sz.x=this.x;sz.y=this.y;sz.subX=this.x;sz.subY=this.y;sz.pathIndex=0;sz.straightToBase=true;
        enemies.push(sz);
        spawnParticles(this.x,this.y,'#666666',5);
      }
      return;
    }
    if(this.typeKey==='super_tombstone'){
      if(this.frozen>0) this.frozen-=dt;
      if(this.burning>0){this.burning-=dt;this.takeDamage(this.burnDPS*dt,'fire');}
      if(this.poisoned>0){this.poisoned-=dt;this.takeDamage(this.poisonDPS*dt,'poison');}
      this.superTombSummonCD-=dt;
      if(this.superTombSummonCD<=0){
        this.superTombSummonCD=2;
        const ultTypes=Object.keys(ENEMY_TYPES).filter(k=>k.startsWith('ultimate_'));
        const randType=ultTypes[Math.floor(Math.random()*ultTypes.length)];
        const e=new Enemy(randType,Math.min(MAX_LEVEL,this.level));
        e.x=this.x;e.y=this.y;e.subX=this.x;e.subY=this.y;e.pathIndex=0;e.straightToBase=true;
        enemies.push(e);
        spawnParticles(this.x,this.y,'#8b0000',8);
      }
      return;
    }
    if(this.special==='weather'&&!this.weatherSet){
      this.weatherSet=true;
      const types=['rain','fog','night','snow','hail','thunderstorm'];
      setWeather(types[Math.floor(Math.random()*types.length)]);
      spawnParticles(this.x,this.y,'#88ccff',10);
    }

    // 通用状态
    if(this.frozen>0){this.frozen-=dt;if(this.frozen<=0)this.frozen=0;}
    if(this.stunned>0){this.stunned-=dt;if(this.stunned<=0)this.stunned=0;}
    if(this.burning>0){this.burning-=dt;let dmg=this.burnDPS*dt;if(this.frozen>0&&this.burning>0)dmg*=1.25;this.takeDamage(dmg,'fire');if(this.burning<=0){this.burning=0;this.burnDPS=0;}}
    if(this.poisoned>0){this.poisoned-=dt;let dmg=this.poisonDPS*dt*(1+this.poisonStacks*0.3);this.takeDamage(dmg,'poison');if(this.poisoned<=0){this.poisoned=0;this.poisonDPS=0;this.poisonStacks=0;}}
    if(this.shocked>0){this.shocked-=dt;if(this.shocked<=0){this.shocked=0;this.corrosionStacks=0;}}
    if(this.wet>0){this.wet-=dt;if(this.wet<=0)this.wet=0;}
    if(this.slowed>0&&this.special!=='immuneslow'){this.slowed-=dt;if(this.slowed<=0){this.slowed=0;this.slowAmount=0;}}
    if(this.flashTimer>0)this.flashTimer-=dt;
    if(this.teleportCD>0){this.teleportCD-=dt;if(this.teleportCD<0)this.teleportCD=0;}
    if(this.atkDebuffTimer>0){this.atkDebuffTimer-=dt;if(this.atkDebuffTimer<=0){this.atkDebuffTimer=0;this.atkDebuffAmount=0;}}

    if(this.ultimateAura){for(const e of enemies){if(e===this||!e.alive||e._ultimateBuffed)continue;e.speed*=1.05;e.armor+=1;e._ultimateBuffed=true;}}
        if(this.healAbility){
      const isUltHealer = (this.typeKey === 'ultimate_healer');
      this.healCD -= dt;
      if(this.healCD <= 0){
        this.healCD = isUltHealer ? 1.0 : 1.5;
        const healRange = CELL_SIZE * (isUltHealer ? 9 : 7);
        const healPct   = isUltHealer ? 0.35 : 0.20;
        for(const e of enemies.slice()){
          if(e===this || !e.alive) continue;
          if(Math.hypot(e.x-this.x, e.y-this.y) < healRange){
            e.hp = Math.min(e.maxHP, e.hp + e.maxHP * healPct);
          }
        }
        spawnParticles(this.x, this.y, '#44ff44', 8);
      }
    }
    if(this.special==='splitter' && !this.isSplitChild){
      this.splitterCD = (this.splitterCD !== undefined ? this.splitterCD : 2) - dt;
      if(this.splitterCD <= 0){
        this.splitterCD = 2;
        this.splitCount = (this.splitCount||0) + 1;
        if(this.splitCount <= 3){
          const b = new Enemy(this.typeKey, Math.max(1, this.level-2));
          b.maxHP = Math.floor(this.maxHP * 0.5);
          b.hp = b.maxHP;
          b.pathIndex = this.pathIndex;
          b.subX = this.x + (Math.random()-0.5)*20;
          b.subY = this.y + (Math.random()-0.5)*20;
          b.x = b.subX; b.y = b.subY;
          b.special = 'splitter';
          b.isSplitChild = true;
          enemies.push(b);
          spawnParticles(this.x, this.y, '#4169e1', 10);
        }
      }
    }
    if(this.special==='shield'){this.shieldAuraCD-=dt;if(this.shieldAuraCD<=0){this.shieldAuraCD=1.5;for(const e of enemies.slice()){if(e===this||!e.alive)continue;if(Math.hypot(e.x-this.x,e.y-this.y)<CELL_SIZE*3){if(e.shieldHP>0)e.shieldHP=Math.min(e.maxHP,e.shieldHP+20);}}}}
    if(this.special==='shocker'||this.isBoss){
      this.shockCD-=dt;
      if(this.shockCD<=0){
        this.shockCD=2.5;
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
          const cell=grid[r][c];
          if(cell.type==='tower'&&Math.hypot(this.x-(c*CELL_SIZE+12),this.y-(r*CELL_SIZE+12))<CELL_SIZE*3.5){
            if(cell.protected>0) continue;
            if(Math.random()<0.5)cell.stunned=4;
          }
        }
      }
    }
    if(this.special==='summoner'){this.summonCD-=dt;if(this.summonCD<=0){this.summonCD=2;const sz=new Enemy('zombie',Math.min(MAX_LEVEL,this.level-2));if(this.straightToBase)sz.straightToBase=true;enemies.push(sz);spawnParticles(this.x,this.y,'#9370db',10);}}
    if(this.special==='carrier'&&this.straightToBase){
      if(!this.carrierAuraCD) this.carrierAuraCD=0.5;
      this.carrierAuraCD-=dt;
      if(this.carrierAuraCD<=0){
        this.carrierAuraCD=0.5;
        for(const e of enemies){
          if(e===this||!e.alive||e.typeKey==='tombstone') continue;
          const dist=Math.hypot(e.x-this.x,e.y-this.y);
          if(dist<CELL_SIZE*4){
            if(e.pathIndex>=0&&e.pathIndex<pathOrder.length-1&&!e.straightToBase){
              e.pathIndex=Math.min(pathOrder.length-1,e.pathIndex+1);
              const [nr,nc]=pathOrder[e.pathIndex];
              e.subX=nc*CELL_SIZE+12;e.subY=nr*CELL_SIZE+12;e.x=e.subX;e.y=e.subY;
              spawnParticles(e.x,e.y,'#ccddff',3);
            } else if(e.straightToBase){
              e.subX+=(this.x>e.subX?1:-1)*CELL_SIZE*0.3;
              e.subY+=(this.y>e.subY?1:-1)*CELL_SIZE*0.3;
            }
          }
        }
      }
    }
    if(this.special==='teleporter'&&pathOrder.length>1&&pathCorners.length>0){
      this.teleportCD-=dt;
      if(this.teleportCD<=0){
        this.teleportCD=5;
        let nextCornerIdx=this.pathIndex;
        for(const ci of pathCorners){if(ci>this.pathIndex){nextCornerIdx=ci;break;}}
        if(nextCornerIdx<=this.pathIndex)nextCornerIdx=Math.min(pathOrder.length-1,this.pathIndex+3);
        this.pathIndex=nextCornerIdx;
        this.subX=pathOrder[this.pathIndex][1]*CELL_SIZE+12;
        this.subY=pathOrder[this.pathIndex][0]*CELL_SIZE+12;
        spawnParticles(this.x,this.y,'#20b2aa',15);
        this.x=this.subX;this.y=this.subY;
      }
    }

    // 直线冲基地
    if(this.typeKey==='devouring_serpent'){ this._updateDevouringSerpent(dt); return; }
    if(this.typeKey==='emperor_goose'){ this._updateEmperorGoose(dt); return; }
    if(this.typeKey==='crystal_queen'){ this._updateCrystalQueen(dt); return; }
    if(this.typeKey==='lin_yiqin'){ this._updateLinYiqin(dt); return; }
    if(this.typeKey==='mirror_administrator'){ this._updateMirrorAdmin(dt); return; }
    if(this.typeKey==='crystal_spike'){ this._updateCrystalSpike(dt); return; }
    if(this.typeKey==='ultimate_thief'){ this._updateUltimateThief(dt); return; }
    if(this.isFriendly){
      let tgt=null, bd=Infinity;
      for(const e of enemies){
        if(e===this||!e.alive||e.isFriendly)continue;
        const dd=Math.hypot(e.x-this.x,e.y-this.y);
        if(dd<bd){bd=dd;tgt=e;}
      }
      if(tgt){
        const dx=tgt.x-this.x, dy=tgt.y-this.y;
        const dist=Math.hypot(dx,dy); if(dist>0){
          this.x += (dx/dist) * 80 * dt; this.y += (dy/dist) * 80 * dt;
        }
        if(dist < 30){
          tgt.takeDamage(this.damage,'physical');
          this.friendlyAtkCD = 0.6;
          spawnParticles(this.x,this.y,'#ff5588',8);
        }
      }
      this.friendlyAtkCD = Math.max(0,this.friendlyAtkCD-dt);
      return;
    }

    if(this.frozen>0 || this.stunned>0) return;

    // 普通小怪移动
    if(pathOrder.length===0 || this.pathIndex >= pathOrder.length-1){
      this.reachedEnd = true; this.removeTimer = 1.5; this.alive = false; damageBase(this.damage,'enemy_reach');
      return;
    }

    const [r,c] = pathOrder[Math.min(this.pathIndex, pathOrder.length-1)];
    const targetX = c*CELL_SIZE+12;
    const targetY = r*CELL_SIZE+12;
    const dx = targetX - this.x;
    const dy = targetY - this.y;
    const dist = Math.hypot(dx,dy);
    if(dist>0.1){
      const speed = this.speed * (this.slowed>0 ? (1-Math.min(0.8,this.slowAmount)) : 1);
      const step = speed * dt * 60;
      const nx = this.x + (dx/dist) * Math.min(step,dist);
      const ny = this.y + (dy/dist) * Math.min(step,dist);
      this.x = nx; this.y = ny;
    }
    if(dist<=2){
      this.pathIndex = Math.min(pathOrder.length-1, this.pathIndex + 1);
      this.initPosition();
    }
  }
}

window.Enemy = Enemy;

</script>
</body>
</html>
