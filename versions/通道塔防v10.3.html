<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, touch-action=none">
  <title>通道塔防 v10.3</title>

  <style>:root{
  --bg:#1a1a2e;--panel-bg:#16213e;--text:#e0e0e0;--gold:#f0c040;
  --danger:#e04040;--success:#40c040;--accent:#e08020;
  --nav-height:48px;--page-bg:#0d1117;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--page-bg);
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;flex-direction:column;height:100vh;
  user-select:none;overflow:hidden;touch-action:none;
}
.theme-default{--bg:#1a1a2e;--panel-bg:#16213e;--gold:#f0c040;--page-bg:#0d1117;}
.theme-ocean{--bg:#1e3a5a;--panel-bg:#2c3e50;--gold:#FFD700;--page-bg:#FFEBCD;}
.theme-field{--bg:#bca169;--panel-bg:#c39a1e;--gold:#4a3500;--page-bg:#97dd25;}
.theme-mono{--bg:#2a2a2a;--panel-bg:#3a3a3a;--gold:#cccccc;--page-bg:#1a1a1a;}
.theme-caramelDark{--bg:#605077;--panel-bg:#4E4161;--gold:#FFD700;--page-bg:#605077;}
.theme-caramelLight{--bg:#FDF4EF;--panel-bg:#AD7467;--gold:#FFFFFF;--page-bg:#FDF4EF;}
.theme-pvzDay{--bg:#b7aa00;--panel-bg:#996c33;--gold:#4a2800;--page-bg:#aaaaaa;}
.theme-pvzNight{--bg:#003c24;--panel-bg:#996c33;--gold:#FFD700;--page-bg:#535353;}

.navbar{position:relative;z-index:100;background:var(--panel-bg);border-bottom:1.5px solid #334;height:var(--nav-height);display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:6px;flex-shrink:0;flex-wrap:nowrap;}
.navbar-left{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.navbar-title{font-weight:700;font-size:1.1em;color:var(--gold);letter-spacing:1px;white-space:nowrap;}
.navbar-info{display:flex;align-items:center;gap:8px;font-size:0.75em;color:#ccc;flex-wrap:nowrap;overflow-x:auto;flex-shrink:1;min-width:0;padding:2px 4px;}
.navbar-info span{white-space:nowrap;}
.navbar-right{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.val-danger{color:#e04040;font-weight:bold;}
.val-gold{color:var(--gold);font-weight:bold;}
.val-crystal{color:#aa88ff;font-weight:bold;}
.nav-btn{background:#2a3a50;color:#ddd;border:1px solid #445;padding:4px 9px;border-radius:14px;cursor:pointer;font-size:0.72em;transition:0.2s;font-family:inherit;white-space:nowrap;}
.nav-btn:hover{background:#354860;border-color:#668;color:#fff;}
.nav-btn.active-speed{border-color:var(--gold)!important;background:#3a4a30;color:var(--gold);}
.nav-btn.active-mode{border-color:#ff8800!important;background:#4a3020;color:#ffaa00;}
.nav-btn.dev-active{border-color:#ff00ff!important;background:#3a0040;color:#ff66ff;}

.dropdown{position:relative;}
.dropdown-btn{background:#2a3a50;color:#ddd;border:1px solid #445;padding:4px 10px;border-radius:14px;cursor:pointer;font-size:0.75em;font-family:inherit;white-space:nowrap;transition:0.2s;}
.dropdown-btn:hover{background:#354860;border-color:#668;color:#fff;}
.dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;background:#1e1e30;border:2px solid #555;border-radius:10px;min-width:200px;max-height:420px;overflow-y:auto;z-index:300;display:none;flex-direction:column;padding:6px;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,0.7);}
.dropdown-menu.align-right{left:auto;right:0;}
.dropdown-menu.show{display:flex;}
.dropdown-menu .nav-btn{width:100%;text-align:left;border-radius:6px;padding:6px 10px;font-size:0.75em;}
.dropdown-menu input[type="number"]{width:55px;padding:2px 4px;border-radius:4px;border:1px solid #555;background:#1e1e30;color:#ddd;font-family:inherit;font-size:0.75em;}
.custom-speed-row{display:flex;gap:4px;align-items:center;padding:2px;}

.save-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;border:1px solid #333;background:#1a1a28;font-size:0.7em;gap:6px;}
.save-item .save-info{flex:1;overflow:hidden;}
.save-item .save-user{font-weight:600;color:var(--gold);}
.save-item .save-time{font-size:0.7em;color:#888;display:block;}
.save-item button{padding:3px 8px;font-size:0.65em;border-radius:10px;cursor:pointer;background:#2a3a50;color:#ddd;border:1px solid #445;font-family:inherit;}

#map-container{flex:1 1 auto;display:flex;overflow:auto;padding:4px;position:relative;min-height:0;min-width:0;}
.canvas-wrapper{position:relative;display:block;margin:auto;flex-shrink:0;line-height:0;width:720px;height:480px;}
canvas#gameCanvas{display:block;width:720px;height:480px;border-radius:6px;cursor:crosshair;image-rendering:pixelated;touch-action:none;}

.mode-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;border-radius:6px;display:none;align-items:center;justify-content:center;z-index:5;}
.mode-overlay.active{display:flex;}
.mode-overlay .warn-text{color:#fff;font-size:1rem;font-weight:bold;text-shadow:0 0 20px rgba(0,0,0,0.9);padding:8px 20px;background:rgba(0,0,0,0.7);border-radius:12px;border:2px solid #ff4444;white-space:nowrap;}

#context-menu{position:fixed;background:#1e1e30;border:2px solid #555;border-radius:8px;padding:4px;z-index:400;display:none;min-width:210px;box-shadow:0 8px 20px rgba(0,0,0,0.8);max-height:70vh;overflow-y:auto;}
#context-menu .menu-item{padding:6px 10px;cursor:pointer;font-size:0.8em;color:#ddd;border-radius:4px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
#context-menu .menu-item:hover{background:#2a2a44;color:#fff;}
.menu-item .cost{color:var(--gold);}
.menu-item .crystal-cost{color:#aa88ff;}

.menu-tabs{display:flex;gap:4px;padding:4px 2px;border-bottom:1px solid #444;margin-bottom:4px;flex-wrap:wrap;}
.menu-tabs .tab-btn{background:transparent;border:none;color:#888;padding:4px 10px;border-radius:12px;cursor:pointer;font-size:0.75em;font-family:inherit;transition:0.2s;}
.menu-tabs .tab-btn:hover{color:#ccc;}
.menu-tabs .tab-btn.active{background:#2a3a50;color:var(--gold);}
.categoryContent{display:flex;flex-direction:column;gap:2px;}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:600;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--bg);border:2px solid #444;border-radius:12px;padding:16px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;color:#ddd;}
.modal h3{color:var(--gold);text-align:center;margin-bottom:10px;}
.modal h4{color:#88ccff;margin:8px 0 4px;}
.modal input{width:100%;padding:8px;margin:4px 0;border-radius:6px;border:1px solid #555;background:#1e1e30;color:#ddd;font-family:inherit;}
.modal button{margin:4px;padding:6px 14px;border-radius:8px;border:1px solid #555;background:#2a3a50;color:#ddd;cursor:pointer;font-family:inherit;}
.modal button:hover{background:#354860;}
.buff-card{display:inline-block;padding:8px 12px;margin:4px;border-radius:8px;border:2px solid var(--gold);background:#2a2a38;color:var(--gold);cursor:pointer;text-align:center;font-weight:bold;}
.buff-card:hover{background:#3a3a48;border-color:#ffcc00;}
.ency-entry{font-size:0.78em;margin-bottom:6px;padding:6px;border-radius:6px;background:#1e1e30;border-left:3px solid #555;}
.ency-entry b{color:var(--gold);}
.dev-log-entry{font-size:0.72em;padding:4px 6px;border-bottom:1px solid #333;color:#ddd;}

.version-tag{position:fixed;bottom:5px;right:12px;color:#888;font-size:0.7em;z-index:10;}
.dev-badge{position:fixed;bottom:5px;left:12px;color:#ff66ff;font-size:0.7em;z-index:10;font-weight:bold;}

.version-select{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;overflow-y:auto;padding:20px;}
.version-title{font-size:2.5em;font-weight:800;color:var(--gold);text-shadow:0 0 20px rgba(240,192,64,0.5);letter-spacing:6px;text-align:center;}
.version-subtitle{font-size:0.9em;color:#888;text-align:center;margin-top:-12px;}
.version-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:700px;}
.version-card{background:var(--bg);border:3px solid #3a4a60;border-radius:16px;padding:24px 32px;cursor:pointer;text-align:center;transition:0.3s;width:280px;}
.version-card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 8px 30px rgba(240,192,64,0.2);}
.version-card.season{border-color:#6a3ace;}
.version-card.season:hover{border-color:#9a5aff;box-shadow:0 8px 30px rgba(106,58,206,0.3);}
.version-card .vc-icon{font-size:3em;margin-bottom:8px;}
.version-card .vc-name{font-size:1.3em;font-weight:700;margin-bottom:6px;}
.version-card .vc-desc{font-size:0.8em;color:#999;line-height:1.5;}
.version-card.season .vc-name{color:#aa88ff;}
.version-card.normal .vc-name{color:#f0c040;}

.leaderboard-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;background:#1e1e30;border:1px solid #333;margin-bottom:6px;font-size:0.85em;}
.leaderboard-entry .lb-rank{font-weight:bold;font-size:1.1em;width:30px;text-align:center;}
.leaderboard-entry .lb-name{flex:1;color:#ddd;font-weight:600;}
.leaderboard-entry .lb-score{color:#f0c040;font-weight:bold;}
.leaderboard-entry.rank-1{border-color:#ffd700;background:linear-gradient(90deg,#2a2410,#1e1e30);}
.leaderboard-entry.rank-1 .lb-rank{color:#ffd700;}
.leaderboard-entry.rank-2{border-color:#c0c0c0;background:#1e2a2a;}
.leaderboard-entry.rank-3{border-color:#cd7f32;background:#2a2010;}
.leaderboard-entry.rank-4{border-color:#6688cc;background:#1a1e2e;}
.leaderboard-entry.rank-5{border-color:#8866aa;background:#1e1a2e;}
.leaderboard-entry.rank-other{border-color:#3a3a4a;background:#1a1a28;}

.season-hud{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:16px;align-items:center;background:#1a1a2eee;backdrop-filter:blur(8px);padding:4px 16px;border-radius:0 0 12px 12px;border:1px solid #444;border-top:none;pointer-events:none;}
.season-hud .sh-item{font-size:0.85em;color:#ddd;}
.season-hud .sh-timer{font-size:1.1em;font-weight:bold;color:#ff6644;}
.season-hud .sh-score{font-size:1.1em;font-weight:bold;color:#f0c040;}

@media (max-width:900px){
  .navbar-title{font-size:0.95em;}
  .navbar-info{font-size:0.68em;gap:5px;}
  .dropdown-btn,.nav-btn{font-size:0.65em;padding:3px 7px;}
}</style>
</head>
<body class="theme-default">
<div class="version-tag">v10.3 兵营重做·新兵种·图鉴分类</div>
<div class="dev-badge" id="devBadge" style="display:none;">🔐 开发者模式</div>

<nav class="navbar">
  <div class="navbar-left">
    <span class="navbar-title">🛡️ 通道塔防</span>
  </div>
  <div class="navbar-info" id="statusBar">
    <span>❤️ <span class="val-danger" id="info-hp">100</span></span>

      <button class="dropdown-btn" id="speedToggle">⏩ 0.5x ▼</button>
      <div class="dropdown-menu align-right" id="speedMenu">
        <button class="nav-btn" data-speed="0.5" onclick="setSpeed(0.5)">0.5x</button>
        <button class="nav-btn" data-speed="1" onclick="setSpeed(1)">1x</button>
        <button class="nav-btn" data-speed="2" onclick="setSpeed(2)">2x</button>

          <input type="number" id="custom-speed-input" value="1" min="0.1" max="20" step="0.1">
          <button class="nav-btn" onclick="setCustomSpeed()">⚡自定义</button>

        <button class="nav-btn" id="btn-pause" onclick="togglePause()" style="display:none;">⏸ 暂停</button>
      </div>
    </div>
    <div class="dropdown" id="systemMenu">
      <button class="dropdown-btn" id="systemToggle">📁 系统 ▼</button>
      <div class="dropdown-menu align-right" id="systemDropdown">
        <button class="nav-btn" onclick="openSaveManager()">💾 存档管理</button>
        <button class="nav-btn" id="btn-manual" onclick="openInstructions()">📋 说明书</button>
        <button class="nav-btn" id="btn-ency" onclick="openEncyclopediaPaused()" style="display:none;">📖 图鉴</button>
        <button class="nav-btn" id="btn-dev" onclick="toggleDevMode()">🔐 开发者</button>
        <button class="nav-btn" id="btn-back-menu" onclick="backToMenu()" style="display:none;">🏠 返回菜单</button>
      </div>
    </div>
  </div>
</nav>

<div id="map-container">
  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="gameCanvas" width="720" height="480"></canvas>
    <div class="mode-overlay" id="modeOverlay">
      <div class="warn-text" id="modeWarnText">⚡ 献祭模式</div>
    </div>
  </div>
</div>

<div id="context-menu"></div>
<div id="modalContainer"></div>

<div id="versionSelect" class="version-select">
  <div class="version-title">🛡️ 通道塔防</div>
  <div class="version-subtitle">选择游戏版本 · v10.3</div>
  <div style="display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap;">
    <button class="nav-btn" onclick="showAnnouncements()">📢 公告</button>
    <button class="nav-btn" onclick="openInstructions()">📖 说明书</button>
    <button class="nav-btn" onclick="openEncyclopedia()">📖图鉴</button>

      <div class="vc-icon">🏆</div>
      <div class="vc-name">赛季版</div>

    <div style="color:#aa88ff;font-size:1.1em;font-weight:bold;">选择赛季模式</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
      <div class="version-card season" onclick="startSeasonMode('experience')" style="width:260px;">
        <div class="vc-icon">⏱️</div><div class="vc-name">经验模式</div>
        <div class="vc-desc">10分钟疯狂极限出怪<br>环形赛道·基地不死·冲分排行<br>结束后录入排行榜</div>
      </div>
      <div class="version-card season" onclick="startSeasonMode('random')" style="width:260px;">
        <div class="vc-icon">🎲</div><div class="vc-name">超级随机</div>

      </div>

    <button class="nav-btn" onclick="document.getElementById('seasonModeCards').style.display='none';document.getElementById('versionCards').style.display='flex';">← 返回</button>
  </div>
</div>

<div id="seasonHUD" class="season-hud" style="display:none;">
  <span class="sh-item">⏱ 倒计时</span><span class="sh-timer" id="season-timer">10:00</span>

  <span class="sh-item">💀 击杀</span><span id="season-kills">0</span>
  <span class="sh-item">🌊 难度</span><span id="season-difficulty">1</span>
</div>


<script>"use strict";
/* ============================================================
   通道塔防 v10.3 — 主逻辑（第 1/2 段）
   ============================================================ */

/* ========== 基础常量 ========== */
const ROWS=20, COLS=30, CELL_SIZE=24;
const canvas=document.getElementById('gameCanvas');
canvas.width=COLS*CELL_SIZE; canvas.height=ROWS*CELL_SIZE;
const ctx=canvas.getContext('2d');

/* DOM 缓存 */
const _domCache={};
function _$(id){ if(!_domCache[id]) _domCache[id]=document.getElementById(id); return _domCache[id]; }

/* 主题配色 */
const THEME_COLORS={
  default:{bg:'#1c1c24',panel:'#16213e',gold:'#f0c040',path:'#5c4033',undig:'#1e1e28',base:'#f44336',entrance:'#4caf50',tower:'#2a2a38',obstacle:'#3a3028'},
  ocean:{bg:'#87CEFA',panel:'#2c3e50',gold:'#FFD700',path:'#E1FFFF',undig1:'#00BFFF',undig2:'#00FFFF',base:'#ff6b35',entrance:'#ff6b35',tower:'#e8d4a0',obstacle:'#c9b896',titleColor:'#FFD700'},
  field:{bg:'#bca169',panel:'#c39a1e',gold:'#4a3500',path:'#97dd25',undig:'#ffff47',base:'#fffe9e',entrance:'#fffe9e',tower:'#97dd25',obstacle:'#97dd25',titleColor:'#4a3500'},
  mono:{bg:'#333333',panel:'#3a3a3a',gold:'#cccccc',path:'#cccccc',undig:'#444444',base:'#eeeeee',entrance:'#eeeeee',tower:'#666666',obstacle:'#777777',titleColor:'#cccccc'},
  caramelDark:{bg:'#744952',panel:'#4E4161',gold:'#FFD700',path:'#EEBEBC',undig:'#3E110E',base:'#F47379',entrance:'#F47379',tower:'#605077',obstacle:'#3E110E',titleColor:'#FFD700'},
  caramelLight:{bg:'#E4B5A3',panel:'#AD7467',gold:'#FFFFFF',path:'#E4C2B6',undig:'#8A5D58',base:'#E0A49C',entrance:'#E0A49C',tower:'#FDF4EF',obstacle:'#8A5D58',titleColor:'#FFFFFF'},
  pvzDay:{bg:'#b7aa00',panel:'#996c33',gold:'#4a2800',path:'#996c33',undig1:'#078814',undig2:'#0ac01d',base:'#e60012',entrance:'#89c997',tower:'#078814',obstacle:'#996c33',titleColor:'#4a2800'},
  pvzNight:{bg:'#003c24',panel:'#996c33',gold:'#FFD700',path:'#81511c',undig1:'#0b574d',undig2:'#0d4e30',base:'#e60012',entrance:'#89c997',tower:'#0b574d',obstacle:'#81511c',titleColor:'#FFD700'}
};
let currentTheme='default'; let TC=THEME_COLORS[currentTheme];

/* 地图起点终点 */
const START_ROW=10, START_COL=0, END_ROW=10, END_COL=COLS-1;
const MAX_LEVEL=200, MAX_POINTS=100000, MAX_CRYSTALS=3000;

/* 全局状态 */
let gamePhase='digging', gameSpeed=1;
let baseHP=100, maxBaseHP=100, points=20, crystals=0, waveNumber=0;
let screenShake=0;
let waveActive=false, waveBreakTimer=0, waveBreakDuration=20;
let seasonWaveTimer=0;
let enemies=[], particles=[], projectiles=[], allies=[];
let grid=[], pathOrder=[], pathCorners=[];
let selectedCell=null, quickUpgradeMode=false;
let achievementData={}, unlockedEnemyTypes=new Set();
let pendingEnemyIntro=null, introPause=false, bossSelectionPause=false;
let gamePaused=false;
let waveSpawnQueue=[], waveSpawnTimer=0;
let mouseDown=false, mouseRow=-1, mouseCol=-1, mouseCanvasX=-1, mouseCanvasY=-1;
let viewportX=-1, viewportY=-1;
let selectionStartRow=-1, selectionStartCol=-1, selectionEndRow=-1, selectionEndCol=-1;
let bossEnemy=null, bossBuffLevels={speed:0,health:0,armor:0};
let globalPenalties={damageReduction:0,pointReduction:0,extraBossChance:0,typeResist:0,corruption:0};
let baseUpgrades={toughness:0};
let baseTotems=0, baseIncomeTimer=0, baseInvincible=0;
let nextWaveDouble=false;
let gameMode='normal';
let seasonTimer=0, seasonMaxTime=600, seasonWaveMaxTime=120, seasonWaveTime=0;
let seasonScore=0, seasonKills=0, seasonDifficulty=1;
let seasonSpawnTimer=0, seasonBossTimer=0;

function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function isAffixOnce(a){return a&&a.once===true;}
function isAffixConsumed(a){if(!a)return true;if(isAffixOnce(a))return isAffixUsedInCurrentMode(a.id);return false;}

let fortressRefreshCount=0;
function showAffixSelection(){
  fortressRefreshCount=2;
  const available=AFFIX_POOL.filter(a=>!isAffixConsumed(a));
  const pool=shuffleArray([...available]).slice(0,5);
  renderAffixSelection(pool,[]);
}
function renderAffixSelection(pool,chosen){
  const cnt=chosen.length;
  let html=`<div class="modal-overlay"><div class="modal" style="max-width:500px;"><h3>🎯 选择词条 (${cnt}/2)</h3><p style="color:#888;font-size:0.8em;">选择2个词条，可刷新${fortressRefreshCount}次</p><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">`;
  pool.forEach((a,i)=>{
    const sel=chosen.includes(i);
    html+=`<div onclick="toggleAffix(${i})" style="padding:12px 16px;border-radius:8px;background:${sel?'#3a5a3a':'#2a2a3a'};border:2px solid ${sel?'#4a4':'#444'};cursor:pointer;width:140px;text-align:center;"><div style="color:${sel?'#8f8':'#ddd'};font-weight:bold;">${a.name}</div><div style="color:#888;font-size:0.7em;margin-top:4px;">${a.desc}</div></div>`;
  });
  html+=`</div><div style="text-align:center;margin-top:12px;">`;
  if(cnt===2) html+=`<button onclick="confirmAffixes()">✅ 确认选择</button> `;
  if(fortressRefreshCount>0) html+=`<button onclick="refreshAffixes()">🔄 刷新 (${fortressRefreshCount}次)</button> `;
  html+=`</div></div></div>`;
  document.getElementById('modalContainer').innerHTML=html;
  window._affixPool=pool; window._affixChosen=chosen;
}
window.toggleAffix=function(i){let c=[...window._affixChosen];if(c.includes(i))c=c.filter(x=>x!==i);else if(c.length<2)c.push(i);renderAffixSelection(window._affixPool,c);};
window.refreshAffixes=function(){if(fortressRefreshCount<=0)return;fortressRefreshCount--;const av=AFFIX_POOL.filter(a=>!isAffixConsumed(a));renderAffixSelection(shuffleArray([...av]).slice(0,5),[]);};
window.confirmAffixes=function(){
  window._affixChosen.map(i=>window._affixPool[i]).forEach(a=>{
    if(isAffixOnce(a)) markAffixUsed(a.id);
    a.effect();
  });
  document.getElementById('modalContainer').innerHTML='';
};

function clampPoints(amount,force){
  if(devMode){points=MAX_POINTS;return;}
  if(!force && gameMode==='season'&&seasonSubMode==='fortress'&&amount>0)return;
  points=Math.min(MAX_POINTS,Math.max(0,points+amount));
  if(gameMode==='season'&&amount>0){if(seasonSubMode==='experience'||seasonSubMode==='random')seasonScore+=amount;}
}
function clampCrystals(amount){if(devMode){crystals=MAX_CRYSTALS;return;}crystals=Math.min(MAX_CRYSTALS,Math.max(0,crystals+amount));}

/* ========== 网格初始化 ========== */
function initGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++) grid[r][c]={
      type:'empty',isPath:false,pathConnections:0,
      towerType:null,towerLevel:0,towerAttackCD:0,towerDirection:null,
      obstacleType:null,obstacleLevel:0,obstacleHP:0,obstacleMaxHP:0,
      stunned:0,barracksCD:0,barracksUnitType:null,
      atkLvl:0,cdLvl:0,rangeLvl:0,overloadTimer:0,obstacleOverload:0,
      wireNetPair:null,obstacleUpgrades:{},regenTimer:0,
      towerHP:0,towerMaxHP:0,protected:0,towerRepairCD:0,
      atkDebuffTimer:0,cdDebuffTimer:0,springCD:0,wasPath:false
    };
  }
  grid[START_ROW][START_COL].type='path'; grid[START_ROW][START_COL].isPath=true;
  grid[END_ROW][END_COL].type='path'; grid[END_ROW][END_COL].isPath=true;
}

/* ========== 路径工具 ========== */
function countPathNeighbors(r,c){let n=0;for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath)n++;}return n;}
function getPathNeighbors(r,c){const res=[];for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath)res.push([nr,nc]);}return res;}
function canDig(r,c){
  if(grid[r][c].isPath||grid[r][c].type==='tower'||grid[r][c].type==='obstacle')return false;
  const nb=getPathNeighbors(r,c);
  if(nb.length>2||nb.length===0)return false;
  for(const [nr,nc] of nb)if(grid[nr][nc].pathConnections+1>2)return false;
  if(nb.length===2){const [n1,n2]=nb;if(arePathCellsConnected(n1[0],n1[1],n2[0],n2[1],r,c))return false;}
  return true;
}
function arePathCellsConnected(r1,c1,r2,c2,er,ec){
  const vis=new Set();const q=[[r1,c1]];vis.add(`${r1},${c1}`);
  while(q.length){
    const [cr,cc]=q.shift();
    if(cr===r2&&cc===c2)return true;
    for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=cr+dr,nc=cc+dc;
      if(nr===er&&nc===ec)continue;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath&&!vis.has(`${nr},${nc}`)){vis.add(`${nr},${nc}`);q.push([nr,nc]);}
    }
  }
  return false;
}
function digCell(r,c){
  if(!canDig(r,c))return false;
  grid[r][c].type='path';grid[r][c].isPath=true;grid[r][c].pathConnections=countPathNeighbors(r,c);
  for(const [nr,nc] of getPathNeighbors(r,c))grid[nr][nc].pathConnections=countPathNeighbors(nr,nc);
  grid[START_ROW][START_COL].pathConnections=countPathNeighbors(START_ROW,START_COL);
  grid[END_ROW][END_COL].pathConnections=countPathNeighbors(END_ROW,END_COL);
  return true;
}
function digCellWithHistory(r,c){if(digCell(r,c)){digHistory.push([r,c]);return true;}return false;}
function undoDig(){
  if(gamePhase!=='digging')return;
  if(digHistory.length===0)return;
  const [r,c]=digHistory.pop();
  grid[r][c].type='empty';grid[r][c].isPath=false;grid[r][c].pathConnections=0;
  const nb=getPathNeighbors(r,c);
  for(const [nr,nc] of nb)grid[nr][nc].pathConnections=countPathNeighbors(nr,nc);
  grid[START_ROW][START_COL].pathConnections=countPathNeighbors(START_ROW,START_COL);
  grid[END_ROW][END_COL].pathConnections=countPathNeighbors(END_ROW,END_COL);
  pathOrder=[];pathCorners=[];
  updateUI();
}
function checkStartEndConnected(){
  const vis=new Set();const q=[[START_ROW,START_COL]];vis.add(`${START_ROW},${START_COL}`);
  while(q.length){
    const [cr,cc]=q.shift();
    if(cr===END_ROW&&cc===END_COL)return true;
    for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=cr+dr,nc=cc+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath&&!vis.has(`${nr},${nc}`)){vis.add(`${nr},${nc}`);q.push([nr,nc]);}
    }
  }
  return false;
}
function computePathCorners(){
  pathCorners=[];if(pathOrder.length<2)return;
  pathCorners.push(0);
  for(let i=1;i<pathOrder.length-1;i++){
    const [pr,pc]=pathOrder[i-1];const [cr,cc]=pathOrder[i];const [nr,nc]=pathOrder[i+1];
    if((cr-pr)!==(nr-cr)||(cc-pc)!==(nc-cc))pathCorners.push(i);
  }
  pathCorners.push(pathOrder.length-1);
}
function computePathOrder(){
  const vis=new Set();const parent={};const q=[[START_ROW,START_COL]];vis.add(`${START_ROW},${START_COL}`);
  let found=false;
  while(q.length&&!found){
    const [cr,cc]=q.shift();
    if(cr===END_ROW&&cc===END_COL){found=true;break;}
    for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=cr+dr,nc=cc+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath&&!vis.has(`${nr},${nc}`)){
        vis.add(`${nr},${nc}`);parent[`${nr},${nc}`]=[cr,cc];q.push([nr,nc]);
      }
    }
  }
  pathOrder=[];
  if(found){let cur=[END_ROW,END_COL];while(cur){pathOrder.unshift(cur);cur=parent[`${cur[0]},${cur[1]}`]||null;}}
  if(pathOrder.length>0)computePathCorners();
  return pathOrder.length>0;
}
function startDefensePhase(){
  if(!checkStartEndConnected()||!computePathOrder())return;
  if(gameMode==='season'&&seasonSubMode==='fortress'&&fortressPhase==='digging')return;
  gamePhase='defense';digHistory=[];waveNumber=0;waveActive=false;waveBreakTimer=2;updateUI();
}

function damageBase(amount,sourceName){
  const dmg=Math.max(0,amount);
  if(gameMode==='season'&&seasonSubMode==='experience'){seasonScore=Math.max(0,seasonScore-dmg*2);updateSeasonHUD();return;}
  if(devMode){
    devDamageLog.unshift({time:new Date().toLocaleTimeString(),source:sourceName||'未知',damage:Math.floor(dmg)});
    if(devDamageLog.length>50)devDamageLog.pop();
    return;
  }
  if(baseInvincible>0)return;
  baseHP-=dmg;
  if(baseHP<0)baseHP=0;
  updateUI();
  if(baseHP<=0)triggerGameOver();
}

/* ========== Enemy 类 ========== */
class Enemy{
  constructor(typeKey,level){
    const t=ENEMY_TYPES[typeKey]||ENEMY_TYPES.zombie;
    this.typeKey=typeKey; this.name=t.name; this.emoji=t.emoji; this.level=Math.min(MAX_LEVEL,level);
    let spdBuff=1+bossBuffLevels.speed*0.10;
    let hpBuff=1+bossBuffLevels.health*0.25;
    this.maxHP=Math.floor(t.hp*(1+this.level*0.2)*hpBuff);
    this.hp=this.maxHP;
    this.speed=t.speed*(1+this.level*0.08)*spdBuff;
    this.armor=Math.floor(t.armor+this.level*2)+bossBuffLevels.armor*3;
    this.damage=Math.floor(t.damage+this.level*1.2);
    this.bounty=Math.floor(t.bounty+this.level*0.4);
    this.special=t.special||null; this.color=t.color;
    this.pathIndex=0; this.x=0; this.y=0; this.subX=0; this.subY=0;
    this.alive=true; this.reachedEnd=false; this.removeTimer=0;
    this.frozen=0; this.slowed=0; this.slowAmount=0; this.burning=0; this.burnDPS=0; this.stunned=0;
    this.wet=0; this.shocked=0; this.corrosionStacks=0; this.splitStage=0; this.flashTimer=0;
    this.flying=t.flying||false; this.poisoned=0; this.poisonDPS=0; this.poisonStacks=0;
    this.healCD=2; this.healAbility=(t.special==='healer');
    this.shockCD=0; this.shieldHP=(t.special==='shield')?80:0;
    this.summonCD=0; this.teleportCD=0; this.reflectCD=0;
    this.reflectChance=(t.special==='reflect')?0.25:0;
    this.ultimateAura=(this.typeKey.startsWith('ultimate_'))?true:false;
    this.isBoss=(typeKey==='boss'||typeKey==='boss_jiawei'||typeKey==='boss_bomber'||typeKey==='boss_dancer'||typeKey==='boss_scholar');
    this.invisible=(typeKey==='ghost'||typeKey==='ultimate_ghost');
    this.straightToBase=(t.special==='straight');
    this.isJiawei=(typeKey==='boss_jiawei');
    this.isBomberBoss=(typeKey==='boss_bomber');
    this.isDancer=(typeKey==='boss_dancer');
    this.isScholar=(typeKey==='boss_scholar');
    this.shieldAuraCD=0; this._ultimateBuffed=false;
    this.bomberCD=0; this.thiefStealCD=0;
    if(this.isBoss||this.isJiawei) bossEnemy=this;
    this.jiaweiSkillCD=0; this.bossSkillCD=0;
    this.immuneTowerType=null;
    this.tankFireCD=0;
    this.firePause=0;
    this.bomberSummonCD=3; this.bomberBombCD=5;
    this.dancerSummonCD=5;
    this.bossHealCD=5;
    this.superTombSummonCD=2;
    this.atkDebuffTimer=0; this.atkDebuffAmount=0;
    this.stolenByMarauder=false;
    if(this.isBomberBoss){this.straightToBase=true;this.flying=true;}
    this.initPosition();
  }
  initPosition(){
    if(pathOrder.length>0&&this.pathIndex>=0){
      const [r,c]=pathOrder[this.pathIndex];
      this.x=c*CELL_SIZE+12;this.y=r*CELL_SIZE+12;this.subX=this.x;this.subY=this.y;
    }
  }
  // ★ 掠夺者减攻 debuff 生效方法
  getAtkDamage(){
    let d=this.damage;
    if(this.atkDebuffTimer>0){d=Math.floor(d*(1-(this.atkDebuffAmount||0)));}
    return Math.max(1,d);
  }
  update(dt){
    if(this.reachedEnd){this.removeTimer-=dt;if(this.isBoss&&this.removeTimer<=0)bossEnemy=null;return;}
    if(!this.alive){if(this.isBoss)bossEnemy=null;return;}

    // 墓碑类
    if(this.typeKey==='tombstone'){
      if(this.frozen>0) this.frozen-=dt;
      if(this.burning>0){this.burning-=dt;this.takeDamage(this.burnDPS*dt,'fire');}
      if(this.poisoned>0){this.poisoned-=dt;this.takeDamage(this.poisonDPS*dt,'poison');}
      if(!this.tombstoneSummonCD) this.tombstoneSummonCD=3;
      this.tombstoneSummonCD-=dt;
      if(this.tombstoneSummonCD<=0){
        this.tombstoneSummonCD=3;
        const sz=new Enemy('zombie',Math.min(MAX_LEVEL,this.level));
        sz.x=this.x;sz.y=this.y;sz.subX=this.x;sz.subY=this.y;sz.pathIndex=0;sz.straightToBase=true;
        enemies.push(sz);
        spawnParticles(this.x,this.y,'#666666',5);
      }
      return;
    }
    if(this.typeKey==='super_tombstone'){
      if(this.frozen>0) this.frozen-=dt;
      if(this.burning>0){this.burning-=dt;this.takeDamage(this.burnDPS*dt,'fire');}
      if(this.poisoned>0){this.poisoned-=dt;this.takeDamage(this.poisonDPS*dt,'poison');}
      this.superTombSummonCD-=dt;
      if(this.superTombSummonCD<=0){
        this.superTombSummonCD=2;
        const ultTypes=Object.keys(ENEMY_TYPES).filter(k=>k.startsWith('ultimate_'));
        const randType=ultTypes[Math.floor(Math.random()*ultTypes.length)];
        const e=new Enemy(randType,Math.min(MAX_LEVEL,this.level));
        e.x=this.x;e.y=this.y;e.subX=this.x;e.subY=this.y;e.pathIndex=0;e.straightToBase=true;
        enemies.push(e);
        spawnParticles(this.x,this.y,'#8b0000',8);
      }
      return;
    }
    if(this.special==='weather'){
      if(this.frozen>0) this.frozen-=dt;
      if(this.burning>0){this.burning-=dt;this.takeDamage(this.burnDPS*dt,'fire');}
      if(this.poisoned>0){this.poisoned-=dt;this.takeDamage(this.poisonDPS*dt,'poison');}
      if(!this.weatherSet){
        this.weatherSet=true;
        const types=['sunny','rain','fog','night'];
        setWeather(types[Math.floor(Math.random()*types.length)]);
        spawnParticles(this.x,this.y,'#88ccff',10);
      }
      return;
    }

    // 通用状态
    if(this.frozen>0){this.frozen-=dt;if(this.frozen<=0)this.frozen=0;}
    if(this.stunned>0){this.stunned-=dt;if(this.stunned<=0)this.stunned=0;}
    if(this.burning>0){this.burning-=dt;let dmg=this.burnDPS*dt;if(this.frozen>0&&this.burning>0)dmg*=1.25;this.takeDamage(dmg,'fire');if(this.burning<=0){this.burning=0;this.burnDPS=0;}}
    if(this.poisoned>0){this.poisoned-=dt;let dmg=this.poisonDPS*dt*(1+this.poisonStacks*0.3);this.takeDamage(dmg,'poison');if(this.poisoned<=0){this.poisoned=0;this.poisonDPS=0;this.poisonStacks=0;}}
    if(this.shocked>0){this.shocked-=dt;if(this.shocked<=0){this.shocked=0;this.corrosionStacks=0;}}
    if(this.wet>0){this.wet-=dt;if(this.wet<=0)this.wet=0;}
    if(this.slowed>0&&this.special!=='immuneslow'){this.slowed-=dt;if(this.slowed<=0){this.slowed=0;this.slowAmount=0;}}
    if(this.flashTimer>0)this.flashTimer-=dt;
    if(this.teleportCD>0){this.teleportCD-=dt;if(this.teleportCD<0)this.teleportCD=0;}
    if(this.atkDebuffTimer>0){this.atkDebuffTimer-=dt;if(this.atkDebuffTimer<=0){this.atkDebuffTimer=0;this.atkDebuffAmount=0;}}

    if(this.ultimateAura){for(const e of enemies){if(e===this||!e.alive||e._ultimateBuffed)continue;e.speed*=1.05;e.armor+=1;e._ultimateBuffed=true;}}
    if(this.healAbility){this.healCD-=dt;if(this.healCD<=0){this.healCD=2;for(const e of enemies.slice()){if(e===this||!e.alive)continue;if(Math.hypot(e.x-this.x,e.y-this.y)<CELL_SIZE*3)e.hp=Math.min(e.maxHP,e.hp+e.maxHP*0.20);}}}
    if(this.special==='shield'){this.shieldAuraCD-=dt;if(this.shieldAuraCD<=0){this.shieldAuraCD=1.5;for(const e of enemies.slice()){if(e===this||!e.alive)continue;if(Math.hypot(e.x-this.x,e.y-this.y)<CELL_SIZE*2.5)e.shieldHP=Math.max(e.shieldHP,40);}}}
    if(this.special==='shocker'||this.isBoss){
      this.shockCD-=dt;
      if(this.shockCD<=0){
        this.shockCD=2.5;
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
          const cell=grid[r][c];
          if(cell.type==='tower'&&Math.hypot(this.x-(c*CELL_SIZE+12),this.y-(r*CELL_SIZE+12))<CELL_SIZE*3.5){
            if(cell.protected>0) continue;
            if(Math.random()<0.5)cell.stunned=4;
          }
        }
      }
    }
    if(this.special==='summoner'){this.summonCD-=dt;if(this.summonCD<=0){this.summonCD=2;const sz=new Enemy('zombie',Math.min(MAX_LEVEL,this.level-2));if(this.straightToBase)sz.straightToBase=true;enemies.push(sz);}}
    if(this.special==='carrier'&&this.straightToBase){
      if(!this.carrierAuraCD) this.carrierAuraCD=0.5;
      this.carrierAuraCD-=dt;
      if(this.carrierAuraCD<=0){
        this.carrierAuraCD=0.5;
        for(const e of enemies){
          if(e===this||!e.alive||e.typeKey==='tombstone') continue;
          const dist=Math.hypot(e.x-this.x,e.y-this.y);
          if(dist<CELL_SIZE*4){
            if(e.pathIndex>=0&&e.pathIndex<pathOrder.length-1&&!e.straightToBase){
              e.pathIndex=Math.min(pathOrder.length-1,e.pathIndex+1);
              const [nr,nc]=pathOrder[e.pathIndex];
              e.subX=nc*CELL_SIZE+12;e.subY=nr*CELL_SIZE+12;e.x=e.subX;e.y=e.subY;
              spawnParticles(e.x,e.y,'#ccddff',3);
            } else if(e.straightToBase){
              e.subX+=(this.x>e.subX?1:-1)*CELL_SIZE*0.3;
              e.subY+=(this.y>e.subY?1:-1)*CELL_SIZE*0.3;
            }
          }
        }
      }
    }

  checkObstacleAtCurrent(){

        else if(cell.obstacleType==='stone'){cell.obstacleHP-=this.getAtkDamage()*0.3;if(cell.obstacleHP<=0){cell.type='path';cell.obstacleType=null;}else{this.pathIndex=Math.max(0,this.pathIndex-1);this.subX=pathOrder[this.pathIndex][1]*CELL_SIZE+12;this.subY=pathOrder[this.pathIndex][0]*CELL_SIZE+12;this.x=this.subX;this.y=this.subY;}}
        else if(cell.obstacleType==='cactus'){cell.obstacleHP-=this.getAtkDamage()*0.2;this.takeDamage(3+(up.thorns?up.thorns*1.5:0),'physical');if(cell.obstacleHP<=0){cell.type='path';cell.obstacleType=null;}else{this.pathIndex=Math.max(0,this.pathIndex-1);this.subX=pathOrder[this.pathIndex][1]*CELL_SIZE+12;this.subY=pathOrder[this.pathIndex][0]*CELL_SIZE+12;this.x=this.subX;this.y=this.subY;}}
        else if(cell.obstacleType==='spring'){if((cell.springCD||0)<=0){const dist=2+(up.distance?up.distance*1:0);this.pathIndex=Math.max(0,this.pathIndex-dist);this.subX=pathOrder[this.pathIndex][1]*CELL_SIZE+12;this.subY=pathOrder[this.pathIndex][0]*CELL_SIZE+12;this.x=this.subX;this.y=this.subY;spawnParticles(this.x,this.y,'#aaddff',10);cell.springCD=3;}}
        else if(cell.obstacleType==='confusion'){const prob=up.effect?0.3+up.effect*0.05:0.3;if(Math.random()<prob){this.pathIndex=Math.max(0,this.pathIndex-2);this.subX=pathOrder[this.pathIndex][1]*CELL_SIZE+12;this.subY=pathOrder[this.pathIndex][0]*CELL_SIZE+12;this.x=this.subX;this.y=this.subY;}this.slowed=Math.max(this.slowed,2);this.slowAmount=Math.max(this.slowAmount||0,0.4);}
        else if(cell.obstacleType==='barracks'){cell.obstacleHP-=this.getAtkDamage()*0.3;if(cell.obstacleHP<=0){cell.type='path';cell.obstacleType=null;spawnParticles(c*CELL_SIZE+12,r*CELL_SIZE+12,'#ff4400',20);}}
      }

        if(cell.towerHP<=0){cell.type='empty';cell.towerType=null;cell.towerHP=0;cell.towerMaxHP=0;spawnParticles(c*CELL_SIZE+12,r*CELL_SIZE+12,'#ff2200',20);}
      }
