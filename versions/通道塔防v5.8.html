	const TOWER_TYPES = {
		arrow:{name:'箭塔',icon:'🏹',cost:10,desc:'十字无限射程',dmg:13,dmgPerLvl:3,cd:0.8,cdPerLvl:0.05,range:99,rangePerLvl:0},

	function initGrid() {
		grid=[]; for(let r=0;r<ROWS;r++){ grid[r]=[]; for(let c=0;c<COLS;c++) grid[r][c]={type:'empty',isPath:false,pathConnections:0,towerType:null,towerLevel:0,towerAttackCD:0,towerDirection:null,obstacleType:null,obstacleLevel:0,obstacleHP:0,obstacleMaxHP:0,stunned:0,barracksCD:0}; }
		grid[START_ROW][START_COL].type='path'; grid[START_ROW][START_COL].isPath=true;
		grid[END_ROW][END_COL].type='path'; grid[END_ROW][END_COL].isPath=true;
	}
	function countPathNeighbors(r,c){ let n=0; for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){ const nr=r+dr,nc=c+dc; if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath)n++; } return n; }
	function getPathNeighbors(r,c){ const res=[]; for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){ const nr=r+dr,nc=c+dc; if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc].isPath)res.push([nr,nc]); } return res; }
	function canDig(r,c){
		if(grid[r][c].isPath||grid[r][c].type==='tower'||grid[r][c].type==='obstacle')return false;
		const nb=getPathNeighbors(r,c); if(nb.length>2||nb.length===0)return false;
		for(const [nr,nc] of nb)if(grid[nr][nc].pathConnections+1>2)return false;
		if(nb.length===2){ const [n1,n2]=nb; if(arePathCellsConnected(n1[0],n1[1],n2[0],n2[1],r,c))return false; }
		return true;
	}

				const dx=target.x-tx,dy=target.y-ty,dist=Math.hypot(dx,dy); if(dist===0)break;
				const ux=dx/dist,uy=dy/dist; const beamLength=Math.max(canvas.width,canvas.height)*1.5;
				projectiles.push({type:'beam',sx:tx,sy:ty,ex:tx+ux*beamLength,ey:ty+uy*beamLength,life:0.28,alive:true,color:'#ff8800',update(dt){this.life-=dt;if(this.life<=0)this.alive=false;},draw(ctx){const alpha=Math.min(1,this.life/0.2);ctx.save();ctx.strokeStyle=`rgba(255,160,40,${0.55*alpha})`;ctx.lineWidth=12;ctx.shadowColor='rgba(255,140,20,0.9)';ctx.shadowBlur=28;ctx.beginPath();ctx.moveTo(this.sx,this.sy);ctx.lineTo(this.ex,this.ey);ctx.stroke();ctx.strokeStyle=`rgba(255,210,90,${0.75*alpha})`;ctx.lineWidth=5;ctx.shadowColor='rgba(255,200,60,0.8)';ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(this.sx,this.sy);ctx.lineTo(this.ex,this.ey);ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${alpha})`;ctx.lineWidth=2;ctx.shadowColor='rgba(255,255,255,0.95)';ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(this.sx,this.sy);ctx.lineTo(this.ex,this.ey);ctx.stroke();ctx.restore();}});
				for(let i=0;i<22;i++){ particles.push({x:tx,y:ty,vx:(ux*(40+Math.random()*180)+(Math.random()-0.5)*90),vy:(uy*(40+Math.random()*180)+(Math.random()-0.5)*90),life:0.25+Math.random()*0.35,maxLife:0.5,color:'#ffaa00',size:2+Math.random()*4}); }
				for(let i=0;i<8;i++){ const alongDist=Math.random()*beamLength*0.7; particles.push({x:tx+ux*alongDist,y:ty+uy*alongDist,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,life:0.2+Math.random()*0.3,maxLife:0.4,color:'#ffcc44',size:1.5+Math.random()*2.5}); }
				for(const e of enemies.slice()){ if(!e.alive)continue; const ex=e.x-tx,ey=e.y-ty; if(Math.abs(ex*uy-ey*ux)<CELL_SIZE*0.8&&ex*ux+ey*uy>0&&ex*ux+ey*uy<CELL_SIZE*40)e.takeDamage(dmg,'explosive',row,col); }
				break;
			}
			case'nuke': {
				if(enemies.length===0)break;
				const target=enemies.reduce((a,b)=>(!a||(b.alive&&Math.hypot(b.x-tx,b.y-ty)<Math.hypot(a.x-tx,a.y-ty)))?b:a,null);
				if(!target||!target.alive)break;
				const nukeX=target.x, nukeY=target.y;
				// 5×5范围爆炸，半径2.5格，即周围2格内
				for(let dr=-2;dr<=2;dr++){
					for(let dc=-2;dc<=2;dc++){
						const nx=Math.round(nukeX/CELL_SIZE)+dc;
						const ny=Math.round(nukeY/CELL_SIZE)+dr;
						if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS){
							spawnParticles(nx*CELL_SIZE+12, ny*CELL_SIZE+12, '#ff6600', 15);
						}
					}
				}
				for(const e of enemies.slice()){
					if(!e.alive)continue;
					if(Math.hypot(e.x-nukeX, e.y-nukeY) < CELL_SIZE*2.5){
						e.takeDamage(dmg,'fire',row,col);
						e.burning = Math.max(e.burning, 3);
						e.burnDPS = Math.max(e.burnDPS, 15 + lvl*2);
					}
				}
				break;
			}
		}
	}

	function getWavePattern(wn){
		if(wn<=7){
			const p=[
				[{type:'zombie',count:2,level:1,interval:2.0}],
				[{type:'zombie',count:2,level:1,interval:1.8},{type:'slime',count:1,level:1,interval:2.5}],
				[{type:'zombie',count:3,level:2,interval:1.5},{type:'slime',count:2,level:2,interval:2.0},{type:'runner',count:1,level:2,interval:3.0}],
				[{type:'runner',count:2,level:3,interval:1.8},{type:'slime',count:2,level:3,interval:2.0},{type:'zombie',count:3,level:3,interval:2.2}],
				[{type:'flesh_mountain',count:1,level:4,interval:5.0},{type:'healer',count:1,level:4,interval:4.5}],
				[{type:'ghost',count:1,level:5,interval:4.0},{type:'drone',count:1,level:5,interval:4.0}],
				[{type:'flesh_mountain',count:1,level:6,interval:4.0},{type:'airship',count:1,level:6,interval:3.5}]
			];
			return p[wn-1];
		}
		const base=[
			{type:'zombie',count:4+Math.floor(wn*0.5),level:Math.min(MAX_LEVEL,10+wn),interval:0.7},
			{type:'slime',count:3+Math.floor(wn*0.4),level:Math.min(MAX_LEVEL,9+wn),interval:1.2},
			{type:'runner',count:2+Math.floor(wn*0.4),level:Math.min(MAX_LEVEL,8+wn),interval:0.9},
			{type:'tankmaster',count:1+Math.floor(wn*0.15),level:Math.min(MAX_LEVEL,10+wn),interval:4.5},
			{type:'exploder',count:2+Math.floor(wn/3),level:Math.min(MAX_LEVEL,8+wn),interval:2.0}
		];
		if(wn%10===0)base.push({type:'boss',count:1,level:Math.min(MAX_LEVEL,wn+15),interval:0.1});
		if(wn>=8){ const supers=['super_zombie','super_slime','super_runner','super_flesh','super_ghost','super_drone','super_airship','super_healer','super_shocker','super_tank','super_exploder']; base.push({type:supers[Math.floor(Math.random()*supers.length)],count:1+Math.floor((wn-8)/3),level:Math.min(MAX_LEVEL,wn+3),interval:3.0}); }
		if(wn>=15){ const ults=['ultimate_zombie','ultimate_slime','ultimate_runner','ultimate_flesh','ultimate_ghost','ultimate_drone','ultimate_airship','ultimate_healer','ultimate_shocker','ultimate_tank']; base.push({type:ults[Math.floor(Math.random()*ults.length)],count:Math.min(2,1+Math.floor((wn-15)/5)),level:Math.min(MAX_LEVEL,wn+8),interval:4.0}); }
		if(wn>=6){ const news=['thief','summoner','splitter','shielder','teleporter','reflector']; base.push({type:news[Math.floor(Math.random()*news.length)],count:1+Math.floor((wn-6)/3),level:Math.min(MAX_LEVEL,wn+5),interval:2.5}); }
		return base;
	}

	function startNextWave(){ waveNumber++; waveActive=true; waveBreakTimer=0; const p=getWavePattern(waveNumber); waveSpawnQueue=[]; for(const g of p){ for(let i=0;i<g.count;i++)waveSpawnQueue.push({type:g.type,level:g.level,spawnDelay:i*g.interval}); } waveSpawnQueue.sort((a,b)=>a.spawnDelay-b.spawnDelay); waveSpawnTimer=0; for(const g of p){ if(!unlockedEnemyTypes.has(g.type)){ unlockedEnemyTypes.add(g.type); pendingEnemyIntro={type:g.type,level:g.level}; } } if(pendingEnemyIntro){ showEnemyIntro(pendingEnemyIntro.type,pendingEnemyIntro.level); introPause=true; } updateUI(); }
	function processWaveSpawning(dt){ if(!waveActive||introPause||bossSelectionPause)return; waveSpawnTimer+=dt; while(waveSpawnQueue.length&&waveSpawnQueue[0].spawnDelay<=waveSpawnTimer){ const s=waveSpawnQueue.shift(); enemies.push(new Enemy(s.type,s.level)); } if(waveSpawnQueue.length===0&&enemies.filter(e=>e.alive&&!e.reachedEnd).length===0&&waveActive)endWave(); }
	function endWave(){ waveActive=false; waveBreakTimer=waveBreakDuration; points+=waveNumber*20+30; updateUI(); }
	function processWaveBreak(dt){ if(waveActive||bossSelectionPause)return; if(waveBreakTimer>0){ waveBreakTimer-=dt; if(waveBreakTimer<=0){waveBreakTimer=0; startNextWave();} } }
	function skipWaveBreak(){ if(gamePhase==='defense'&&!waveActive&&waveBreakTimer>0&&!bossSelectionPause)waveBreakTimer=0.01; }
	function toggleQuickUpgrade(){ quickUpgradeMode=!quickUpgradeMode; document.getElementById('btn-quick-upgrade').classList.toggle('active-mode',quickUpgradeMode); updateUI(); }

	let lastTime=performance.now();
	function gameLoop(ts){
		let dt=(ts-lastTime)/1000; if(dt<=0)dt=0.016; if(dt>0.3)dt=0.3; dt*=gameSpeed; lastTime=ts; gameTime+=dt;
		if(gamePhase==='defense'){
			processWaveBreak(dt); if(waveActive)processWaveSpawning(dt); processTowers(dt); processObstacles(dt);
			for(const e of enemies) if(e.alive||e.reachedEnd) e.update(dt);
			enemies=enemies.filter(e=>e.alive||(e.reachedEnd&&e.removeTimer>0));
			for(const s of soldiers)s.update(dt); soldiers=soldiers.filter(s=>s.alive);
			for(const p of projectiles)p.update(dt); projectiles=projectiles.filter(p=>p.alive);
			for(const p of particles){ p.life-=dt; if(p.life<=0)continue; p.x+=p.vx*dt; p.y+=p.vy*dt; } particles=particles.filter(p=>p.life>0);
		}
		updateUI(); render(); requestAnimationFrame(gameLoop);
	}

	function drawTowerRange(cell,row,col){
		const tx=col*CELL_SIZE+12, ty=row*CELL_SIZE+12, lvl=cell.towerLevel; const type=cell.towerType;
		ctx.save(); ctx.globalAlpha=0.45; ctx.setLineDash([6,4]); ctx.lineWidth=2;
		switch(type){
			case'arrow': ctx.strokeStyle='rgba(255,255,180,0.7)'; ctx.lineWidth=CELL_SIZE*1.5; ctx.globalAlpha=0.25; ctx.beginPath(); ctx.moveTo(tx,0); ctx.lineTo(tx,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,ty); ctx.lineTo(canvas.width,ty); ctx.stroke(); break;
			case'ice':{ const range=towerRange('ice',lvl)*CELL_SIZE; ctx.strokeStyle='rgba(120,200,255,0.7)'; ctx.fillStyle='rgba(100,180,240,0.12)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(tx,ty,range,0,Math.PI*2); ctx.fill(); ctx.stroke(); break; }
			case'fire':{ const dir=cell.towerDirection||[0,1]; const angle=Math.atan2(dir[0],dir[1]); const len=(3+Math.floor(lvl*0.5))*CELL_SIZE; const halfAngle=Math.PI/5; ctx.strokeStyle='rgba(255,100,40,0.7)'; ctx.fillStyle='rgba(255,80,30,0.14)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.arc(tx,ty,len,angle-halfAngle,angle+halfAngle); ctx.closePath(); ctx.fill(); ctx.stroke(); break; }
			case'tesla':{ const range=towerRange('tesla',lvl)*CELL_SIZE; ctx.strokeStyle='rgba(150,200,255,0.7)'; ctx.fillStyle='rgba(130,190,250,0.10)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(tx,ty,range,0,Math.PI*2); ctx.fill(); ctx.stroke(); break; }
			case'cannon':{ let aimX=tx+CELL_SIZE*30,aimY=ty; if(mouseCanvasX>=0&&mouseCanvasY>=0&&mouseCanvasX<=canvas.width&&mouseCanvasY<=canvas.height){ const mdx=mouseCanvasX-tx,mdy=mouseCanvasY-ty; const mdist=Math.hypot(mdx,mdy); if(mdist>5){ aimX=tx+(mdx/mdist)*canvas.width*2; aimY=ty+(mdy/mdist)*canvas.width*2; } }else if(enemies.some(e=>e.alive)){ const nearest=enemies.reduce((a,b)=>(!a||(b.alive&&Math.hypot(b.x-tx,b.y-ty)<Math.hypot(a.x-tx,a.y-ty)))?b:a,null); if(nearest){ const ndx=nearest.x-tx,ndy=nearest.y-ty,ndist=Math.hypot(ndx,ndy); if(ndist>1){ aimX=tx+(ndx/ndist)*canvas.width*2; aimY=ty+(ndy/ndist)*canvas.width*2; } } } ctx.strokeStyle='rgba(255,150,50,0.55)'; ctx.lineWidth=CELL_SIZE*1.4; ctx.globalAlpha=0.30; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(aimX,aimY); ctx.stroke(); break; }
			case'nuke':{ const range=CELL_SIZE*2.5; ctx.strokeStyle='rgba(255,60,60,0.65)'; ctx.fillStyle='rgba(255,40,40,0.10)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(tx,ty,range,0,Math.PI*2); ctx.fill(); ctx.stroke(); break; }
			case'toxic':{ const dir=cell.towerDirection||[0,1]; const angle=Math.atan2(dir[0],dir[1]); const len=(3+Math.floor(lvl*0.5))*CELL_SIZE; const halfAngle=Math.PI/5; ctx.strokeStyle='rgba(100,255,100,0.7)'; ctx.fillStyle='rgba(80,255,80,0.12)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.arc(tx,ty,len,angle-halfAngle,angle+halfAngle); ctx.closePath(); ctx.fill(); ctx.stroke(); break; }
		}
		ctx.setLineDash([]); ctx.restore();
	}

	function render(){
		ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#1c1c24'; ctx.fillRect(0,0,canvas.width,canvas.height);
		for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
			const cell=grid[r][c], x=c*CELL_SIZE, y=r*CELL_SIZE;
			if(cell.type==='obstacle'){ ctx.fillStyle='#3a3028'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); ctx.fillStyle='#ddd'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText(OBSTACLE_TYPES[cell.obstacleType]?.icon||'?',x+12,y+16); }
			else if(cell.type==='tower'){ ctx.fillStyle='#2a2a38'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); ctx.fillStyle='#f0c040'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText(TOWER_TYPES[cell.towerType]?.icon||'?',x+12,y+16); if(cell.stunned>0){ ctx.fillStyle='rgba(255,255,0,0.5)'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); } }
			else if(cell.isPath){ ctx.fillStyle='#5c4033'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); }
			else{ ctx.fillStyle='#1e1e28'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); }
		}
		if(gamePhase==='defense'&&selectedCell&&!nukeMode){
			const cell=grid[selectedCell.row][selectedCell.col];
			if(cell&&cell.type==='tower'){
				drawTowerRange(cell,selectedCell.row,selectedCell.col);
				const sx=selectedCell.col*CELL_SIZE, sy=selectedCell.row*CELL_SIZE;
				ctx.strokeStyle='#f0c040'; ctx.lineWidth=3; ctx.setLineDash([3,2]); ctx.strokeRect(sx+2,sy+2,CELL_SIZE-4,CELL_SIZE-4); ctx.setLineDash([]);
			}
		}
		if(quickUpgradeMode&&selectionStartRow>=0&&selectionEndRow>=0){
			const x1=Math.min(selectionStartCol,selectionEndCol)*CELL_SIZE;
			const y1=Math.min(selectionStartRow,selectionEndRow)*CELL_SIZE;
			const x2=(Math.max(selectionStartCol,selectionEndCol)+1)*CELL_SIZE;
			const y2=(Math.max(selectionStartRow,selectionEndRow)+1)*CELL_SIZE;
			ctx.save(); ctx.globalAlpha=0.4; ctx.fillStyle='rgba(255,160,40,0.3)'; ctx.fillRect(x1,y1,x2-x1,y2-y1);
			ctx.strokeStyle='#ff8800'; ctx.lineWidth=3; ctx.setLineDash([5,3]); ctx.strokeRect(x1,y1,x2-x1,y2-y1); ctx.setLineDash([]); ctx.restore();
		}
		for(const e of enemies) e.draw(ctx);
		for(const s of soldiers) s.draw(ctx);
		for(const p of projectiles) p.draw(ctx);
		for(const p of particles){ if(p.life<=0)continue; const alpha=p.life/p.maxLife; ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size||2,0,Math.PI*2); ctx.fill(); }
		ctx.globalAlpha=1;
		if(bossEnemy&&bossEnemy.alive){
			const barWidth=200, barHeight=18, barX=canvas.width/2-barWidth/2, barY=10;
			ctx.fillStyle='#333'; ctx.fillRect(barX,barY,barWidth,barHeight);
			const hpRatio=bossEnemy.hp/bossEnemy.maxHP;
			ctx.fillStyle=hpRatio>0.5?'#ff4444':hpRatio>0.25?'#ff8800':'#ff0000';
			ctx.fillRect(barX,barY,barWidth*hpRatio,barHeight);
			ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(barX,barY,barWidth,barHeight);
			ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
			ctx.fillText(`👾 BOSS ${Math.floor(bossEnemy.hp)}/${bossEnemy.maxHP}`,canvas.width/2,barY+13);
		}
		ctx.fillStyle='#4caf50'; ctx.fillRect(START_COL*CELL_SIZE+1,START_ROW*CELL_SIZE+1,CELL_SIZE-2,CELL_SIZE-2);
		ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
		ctx.fillText('入',START_COL*CELL_SIZE+12,START_ROW*CELL_SIZE+12);
		ctx.fillStyle='#f44336'; ctx.fillRect(END_COL*CELL_SIZE+1,END_ROW*CELL_SIZE+1,CELL_SIZE-2,CELL_SIZE-2);
		ctx.fillText('基',END_COL*CELL_SIZE+12,END_ROW*CELL_SIZE+12);
	}
	function updateUI(){
		document.getElementById('info-hp').textContent=Math.floor(baseHP);
		document.getElementById('info-points').textContent=Math.floor(points);
		document.getElementById('info-phase').textContent=gamePhase==='digging'?'挖掘':'防御';
		document.getElementById('info-wave').textContent=gamePhase==='defense'?`第${waveNumber}波`:'准备中';
		document.getElementById('info-timer').textContent=(gamePhase==='defense'&&!waveActive&&waveBreakTimer>0&&!bossSelectionPause)?Math.ceil(waveBreakTimer)+'s':'-';
		document.getElementById('skip-wave-btn').style.display=(gamePhase==='defense'&&!waveActive&&waveBreakTimer>0&&!bossSelectionPause)?'inline-block':'none';
		let buffText='';
		if(bossBuffLevels.speed>0)buffText+=`💨${bossBuffLevels.speed} `;
		if(bossBuffLevels.health>0)buffText+=`❤️${bossBuffLevels.health} `;
		if(bossBuffLevels.armor>0)buffText+=`🛡️${bossBuffLevels.armor} `;
		document.getElementById('info-boss-buffs').textContent=buffText?'怪物强化:'+buffText:'';
	}
	function placeItem(row,col,type,category){
		const cell=grid[row][col];
		if(category==='tower'){ if(cell.type!=='empty'||cell.isPath)return; const cost=towerCost(type); if(points<cost)return; points-=cost; cell.type='tower'; cell.towerType=type; cell.towerLevel=1; if(type==='fire'||type==='toxic'){ const nb=getPathNeighbors(row,col); cell.towerDirection=nb.length?[nb[0][0]-row,nb[0][1]-col]:[0,1]; } }
		else{ if(!cell.isPath||cell.type==='obstacle'||cell.type==='tower')return; const cost=obsCost(type); if(points<cost)return; points-=cost; cell.type='obstacle'; cell.obstacleType=type; cell.obstacleLevel=1; if(type==='stone'){ cell.obstacleMaxHP=300; cell.obstacleHP=300; } else if(type==='cactus'){ cell.obstacleMaxHP=50; cell.obstacleHP=50; } }
		updateUI();
	}
	function obsCost(t){ return OBSTACLE_TYPES[t]?.cost||8; }

	function quickUpgradeInRect(r1,c1,r2,c2){
		const minR=Math.min(r1,r2), maxR=Math.max(r1,r2);
		const minC=Math.min(c1,c2), maxC=Math.max(c1,c2);
		let totalCost=0, upgraded=0;
		for(let r=minR;r<=maxR;r++){
			for(let c=minC;c<=maxC;c++){
				const cell=grid[r][c];
				if(cell.type==='tower'&&cell.towerLevel<10){
					const upCost=Math.floor((cell.towerLevel+1)*8+10);
					totalCost+=upCost;
				}
			}
		}
		if(totalCost===0){ alert('所选区域内没有可升级的炮塔'); return; }
		if(points<totalCost){ alert(`点数不足！需要${totalCost}pt，当前${Math.floor(points)}pt`); return; }
		points-=totalCost;
		for(let r=minR;r<=maxR;r++){
			for(let c=minC;c<=maxC;c++){
				const cell=grid[r][c];
				if(cell.type==='tower'&&cell.towerLevel<10){ cell.towerLevel++; upgraded++; }
			}
		}
		alert(`✅ 已升级${upgraded}座炮塔，花费${totalCost}pt`);
		updateUI();
	}

	function applyBossPenalty(index){
		if(window._pendingPenalties&&window._pendingPenalties[index]){
			window._pendingPenalties[index].apply();

	}
	window.applyBossPenalty=applyBossPenalty;

	function destroyRandomTowers(fraction){
		const towers=[];
		for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c].type==='tower') towers.push([r,c]);
		const count=Math.floor(towers.length*fraction);
		for(let i=0;i<count;i++){
			if(towers.length===0)break;
			const idx=Math.floor(Math.random()*towers.length);
			const [r,c]=towers.splice(idx,1)[0];
			grid[r][c].type='empty'; grid[r][c].towerType=null; grid[r][c].towerLevel=0;
		}
		spawnParticles(canvas.width/2,canvas.height/2,'#ff0000',30);
	}
	function stunAllTowers(duration){
		for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c].type==='tower') grid[r][c].stunned=Math.max(grid[r][c].stunned,duration);
	}
	function teleportEnemiesNearBase(count){
		const baseX=END_COL*CELL_SIZE+12, baseY=END_ROW*CELL_SIZE+12;
		let teleported=0;
		for(const e of enemies){
			if(!e.alive||e.reachedEnd)continue;
			if(teleported>=count)break;
			e.subX=baseX+(Math.random()-0.5)*CELL_SIZE*3;
			e.subY=baseY+(Math.random()-0.5)*CELL_SIZE*3;
			e.x=e.subX; e.y=e.subY;
			teleported++;
		}
	}

	let lastTouchDist=0;
	function getCanvasCoords(e){
		const rect=canvas.getBoundingClientRect();
		let clientX, clientY;
		if(e.touches){ clientX=e.touches[0].clientX; clientY=e.touches[0].clientY; }
		else{ clientX=e.clientX; clientY=e.clientY; }
		return {x:clientX-rect.left,y:clientY-rect.top,clientX,clientY};
	}
	function handleDown(e){
		e.preventDefault();
		const {x,y}=getCanvasCoords(e);
		mouseDown=true; mouseCanvasX=x; mouseCanvasY=y;
		mouseCol=Math.floor(x/CELL_SIZE); mouseRow=Math.floor(y/CELL_SIZE);
		lastTouchDist=0;
		if(quickUpgradeMode&&gamePhase==='defense'){
			selectionStartRow=mouseRow; selectionStartCol=mouseCol;
			selectionEndRow=mouseRow; selectionEndCol=mouseCol;
		}else if(gamePhase==='digging'&&mouseRow>=0&&mouseRow<ROWS&&mouseCol>=0&&mouseCol<COLS){
			if(digCell(mouseRow,mouseCol)&&checkStartEndConnected())startDefensePhase();
			updateUI();
		}
	}
	function handleMove(e){
		e.preventDefault();
		const {x,y}=getCanvasCoords(e);
		const dx=x-mouseCanvasX, dy=y-mouseCanvasY;
		lastTouchDist=Math.max(lastTouchDist,Math.abs(dx)+Math.abs(dy));
		mouseCanvasX=x; mouseCanvasY=y;
		if(quickUpgradeMode&&mouseDown&&gamePhase==='defense'){
			const col=Math.floor(x/CELL_SIZE), row=Math.floor(y/CELL_SIZE);
			if(row>=0&&row<ROWS&&col>=0&&col<COLS){ selectionEndRow=row; selectionEndCol=col; }
		}else if(mouseDown&&gamePhase==='digging'){
			const col=Math.floor(x/CELL_SIZE), row=Math.floor(y/CELL_SIZE);
			if(row>=0&&row<ROWS&&col>=0&&col<COLS&&(row!==mouseRow||col!==mouseCol)){
				mouseRow=row; mouseCol=col;
				if(digCell(row,col)&&checkStartEndConnected())startDefensePhase();
				updateUI();
			}
		}
	}
	function handleUp(e){
		e.preventDefault();
		if(quickUpgradeMode&&gamePhase==='defense'&&selectionStartRow>=0&&selectionEndRow>=0){
			if(lastTouchDist>3) quickUpgradeInRect(selectionStartRow,selectionStartCol,selectionEndRow,selectionEndCol);
			selectionStartRow=-1; selectionEndRow=-1;
		}
		if(lastTouchDist<5&&gamePhase==='defense'&&!quickUpgradeMode){
			const mx=mouseCanvasX, my=mouseCanvasY;
			const col=Math.floor(mx/CELL_SIZE), row=Math.floor(my/CELL_SIZE);
			if(row>=0&&row<ROWS&&col>=0&&col<COLS){
				closeMenu();
				const cell=grid[row][col];
				if(cell.type==='tower'||cell.type==='obstacle'){ selectedCell={row,col}; showBuildingMenu(e.clientX||mx,e.clientY||my,row,col); }
				else{ showConstructionMenu(e.clientX||mx,e.clientY||my,row,col); }
			}
		}
		mouseDown=false;
	}
	canvas.addEventListener('mousedown',handleDown);
	canvas.addEventListener('mousemove',handleMove);
	canvas.addEventListener('mouseup',handleUp);
	canvas.addEventListener('mouseleave',()=>{ mouseCanvasX=-1; mouseCanvasY=-1; mouseDown=false; });
	canvas.addEventListener('touchstart',handleDown,{passive:false});
	canvas.addEventListener('touchmove',handleMove,{passive:false});
	canvas.addEventListener('touchend',handleUp);
	canvas.addEventListener('touchcancel',handleUp);

	canvas.addEventListener('click',(e)=>{
		if(e.pointerType==='touch')return;
		const rect=canvas.getBoundingClientRect();
		const mx=e.clientX-rect.left, my=e.clientY-rect.top;
		mouseCanvasX=mx; mouseCanvasY=my;
		const col=Math.floor(mx/CELL_SIZE), row=Math.floor(my/CELL_SIZE);
		if(row<0||row>=ROWS||col<0||col>=COLS)return;
		closeMenu();
		if(gamePhase==='digging'){ if(digCell(row,col)&&checkStartEndConnected())startDefensePhase(); return; }
		const cell=grid[row][col];
		if(cell.type==='tower'||cell.type==='obstacle'){ selectedCell={row,col}; showBuildingMenu(e.clientX,e.clientY,row,col); }
		else{ showConstructionMenu(e.clientX,e.clientY,row,col); }
	});
	canvas.addEventListener('contextmenu',(e)=>{ e.preventDefault(); closeMenu(); clearSelection(); updateUI(); });

	function showConstructionMenu(mx,my,row,col){
		const cell=grid[row][col]; const menu=document.getElementById('context-menu'); menu.innerHTML='';
		if(!cell.isPath&&cell.type==='empty'){ Object.keys(TOWER_TYPES).forEach(t=>{ const cost=towerCost(t); menu.innerHTML+=`<div class="menu-item" onclick="placeItem(${row},${col},'${t}','tower');closeMenu()"><span>${TOWER_TYPES[t].icon}${TOWER_TYPES[t].name}</span><span class="cost">${cost}pt</span></div>`; }); }
		else if(cell.isPath&&cell.type==='path'){ Object.keys(OBSTACLE_TYPES).forEach(t=>{ const cost=obsCost(t); menu.innerHTML+=`<div class="menu-item" onclick="placeItem(${row},${col},'${t}','obstacle');closeMenu()"><span>${OBSTACLE_TYPES[t].icon}${OBSTACLE_TYPES[t].name}</span><span class="cost">${cost}pt</span></div>`; }); }
		menu.style.display='block'; menu.style.left=Math.min(mx,window.innerWidth-180)+'px'; menu.style.top=Math.min(my,window.innerHeight-300)+'px';
	}
	function showBuildingMenu(mx,my,row,col){
		const cell=grid[row][col]; const menu=document.getElementById('context-menu'); menu.innerHTML='';
		if(cell.type==='tower'){
			const upCost=Math.floor((cell.towerLevel+1)*8+10);
			const refund=Math.floor(towerCost(cell.towerType)*0.3*cell.towerLevel);
			const nxtDmg=cell.towerLevel<10?towerDmg(cell.towerType,cell.towerLevel+1):towerDmg(cell.towerType,cell.towerLevel);
			const curDmg=towerDmg(cell.towerType,cell.towerLevel);
			const nxtCD=cell.towerLevel<10?towerCD(cell.towerType,cell.towerLevel+1).toFixed(2):towerCD(cell.towerType,cell.towerLevel).toFixed(2);
			const curCD=towerCD(cell.towerType,cell.towerLevel).toFixed(2);
			menu.innerHTML+=`<div style="padding:6px;color:#f0c040;font-size:0.75em;">Lv${cell.towerLevel} | ⚔️${curDmg} | ⏱${curCD}s</div>`;
			if(cell.towerLevel<10){
				menu.innerHTML+=`<div class="menu-item" onclick="if(${upCost}&&points>=${upCost}){points-=${upCost};grid[${row}][${col}].towerLevel++;closeMenu();updateUI();}"><span>⬆升级→Lv${cell.towerLevel+1} ⚔️${nxtDmg} ⏱${nxtCD}s</span><span class="cost">${upCost}pt</span></div>`;
			}
			menu.innerHTML+=`<div class="menu-item" onclick="points+=${refund};grid[${row}][${col}].type='empty';closeMenu();updateUI();"><span>🗑铲除</span><span class="cost">+${refund}pt</span></div>`;
			if(cell.towerType==='fire'||cell.towerType==='toxic'){ menu.innerHTML+=`<div class="menu-item" onclick="rotateTowerDirection(${row},${col});closeMenu();"><span>↻旋转方向</span></div>`; }
		}else if(cell.type==='obstacle'){
			const upCost=Math.floor((cell.obstacleLevel+1)*6+5);
			const refund=Math.floor(obsCost(cell.obstacleType)*0.3*cell.obstacleLevel);
			menu.innerHTML+=`<div class="menu-item" onclick="if(${upCost}&&points>=${upCost}){points-=${upCost};grid[${row}][${col}].obstacleLevel++;closeMenu();updateUI();}"><span>⬆升级</span><span class="cost">${upCost}pt</span></div>`;
			menu.innerHTML+=`<div class="menu-item" onclick="points+=${refund};grid[${row}][${col}].type='path';closeMenu();updateUI();"><span>🗑铲除</span><span class="cost">+${refund}pt</span></div>`;
		}
		menu.style.display='block'; menu.style.left=Math.min(mx,window.innerWidth-180)+'px'; menu.style.top=Math.min(my,window.innerHeight-200)+'px';
	}
	function rotateTowerDirection(row,col){
		const cell=grid[row][col];
		if(!cell.towerDirection)cell.towerDirection=[0,1];
		else{ const [dr,dc]=cell.towerDirection; if(dr===0&&dc===1)cell.towerDirection=[1,0]; else if(dr===1&&dc===0)cell.towerDirection=[0,-1]; else if(dr===0&&dc===-1)cell.towerDirection=[-1,0]; else cell.towerDirection=[0,1]; }
		updateUI();
	}
	function closeMenu(){ document.getElementById('context-menu').style.display='none'; }
	function clearSelection(){ selectedCell=null; updateUI(); }
	function setSpeed(s){ gameSpeed=s; updateSpeedButtons(); document.getElementById('custom-speed-input').value=s; }
	function setCustomSpeed(){ const val=parseFloat(document.getElementById('custom-speed-input').value); if(!isNaN(val)&&val>0){ gameSpeed=val; updateSpeedButtons(); } }
	function updateSpeedButtons(){ ['btn-sp1','btn-sp2','btn-sp3','btn-sp5'].forEach((id,i)=>{ document.getElementById(id).classList.toggle('active-speed',gameSpeed===[1,2,3,5][i]); }); }
	function showEnemyIntro(typeKey,level){ const t=ENEMY_TYPES[typeKey]; if(!t)return; document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay"><div class="modal"><h3>⚠️新敌人！</h3><div style="text-align:center;font-size:3em;">${t.emoji}</div><h4>${t.name} Lv${level}</h4><p>${t.desc}</p><button onclick="document.getElementById('modalContainer').innerHTML='';introPause=false;pendingEnemyIntro=null;">确认</button></div></div>`; }
	function openEncyclopedia(){
		let html='<div class="modal-overlay"><div class="modal"><h3>📖图鉴</h3><h4>👾怪物</h4>';
		for(const [k,d] of Object.entries(ENEMY_TYPES)){ html+=`<div style="font-size:0.75em;margin-bottom:4px;">${d.emoji} <b>${d.name}</b> Lv${d.tier} | ❤️${d.hp} ⚡${d.damage} 🏃${d.speed} 🛡️${d.armor} | ${d.desc}${d.special?` (能力:${d.special})`:''}${d.flying?' ✈️飞行':''}</div>`; }
		html+='<h4>🏗️炮塔</h4>';
		for(const [k,d] of Object.entries(TOWER_TYPES)){ html+=`<div style="font-size:0.75em;margin-bottom:4px;">${d.icon} <b>${d.name}</b> ${d.cost}pt | ⚔️${d.dmg}+${d.dmgPerLvl}/Lv | ⏱${d.cd}s-${d.cdPerLvl}/Lv | 范围${d.range} | ${d.desc}</div>`; }
		html+='<h4>🚧障碍</h4>';
		for(const [k,d] of Object.entries(OBSTACLE_TYPES)){ html+=`<div style="font-size:0.75em;">${d.icon}${d.name} ${d.cost}pt - ${d.desc}</div>`; }
		html+='<h4>🏆难度词条</h4>';
		html+=`<div style="font-size:0.75em;">速度+${bossBuffLevels.speed*10}% | 生命+${bossBuffLevels.health*20}% | 护甲+${bossBuffLevels.armor*2}</div>`;
		html+='<button onclick="document.getElementById(\'modalContainer\').innerHTML=\'\'">关闭</button></div></div>';
		document.getElementById('modalContainer').innerHTML=html;
	}

	const SAVES_INDEX_KEY='td_saves_index6', SAVE_PREFIX='td_save6_';
	function getSaveIndex(){ const raw=localStorage.getItem(SAVES_INDEX_KEY); if(!raw)return[]; try{ return JSON.parse(raw); }catch(e){ return[]; } }
	function setSaveIndex(arr){ localStorage.setItem(SAVES_INDEX_KEY,JSON.stringify(arr)); }
	function addSaveId(id){ const idx=getSaveIndex(); if(!idx.includes(id)){ idx.push(id); setSaveIndex(idx); } }
	function removeSaveId(id){ setSaveIndex(getSaveIndex().filter(i=>i!==id)); }
	function getSaveData(id){ const raw=localStorage.getItem(SAVE_PREFIX+id); if(!raw)return null; try{ return JSON.parse(raw); }catch(e){ return null; } }
	function setSaveData(id,data){ localStorage.setItem(SAVE_PREFIX+id,JSON.stringify(data)); addSaveId(id); }
	function deleteSaveData(id){ localStorage.removeItem(SAVE_PREFIX+id); removeSaveId(id); }
	function saveGame(){
		const saveId=Date.now().toString(36)+Math.random().toString(36).substring(2,6);
		const data={
			gameState:{ gamePhase,baseHP,points,waveNumber,waveActive,waveBreakTimer,waveBreakDuration,
				grid:grid.map(r=>r.map(c=>({type:c.type,isPath:c.isPath,towerType:c.towerType,towerLevel:c.towerLevel,towerDirection:c.towerDirection,obstacleType:c.obstacleType,obstacleLevel:c.obstacleLevel,obstacleHP:c.obstacleHP}))),
				waveSpawnQueue,waveSpawnTimer,achievementData,bossBuffLevels },
			timestamp:Date.now()
		};
		setSaveData(saveId,data); renderSaveList(); alert('存档已保存');
	}
	function loadGame(saveId){
		const data=getSaveData(saveId); if(!data)return;
		const gs=data.gameState;
		gamePhase=gs.gamePhase; baseHP=gs.baseHP; points=gs.points; waveNumber=gs.waveNumber; waveActive=gs.waveActive; waveBreakTimer=gs.waveBreakTimer;
		waveBreakDuration=gs.waveBreakDuration||20;
		waveSpawnQueue=gs.waveSpawnQueue||[]; waveSpawnTimer=gs.waveSpawnTimer||0; achievementData=gs.achievementData||{};
		bossBuffLevels=gs.bossBuffLevels||{speed:0,health:0,armor:0};
		if(gs.grid)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)Object.assign(grid[r][c],gs.grid[r][c]);
		enemies=[]; soldiers=[]; projectiles=[]; particles=[]; bossEnemy=null;
		if(gamePhase==='defense'){ if(!checkStartEndConnected()||!computePathOrder()){ alert('存档路径数据损坏，游戏已重置'); resetGame(); return; } }
		updateUI(); renderSaveList(); alert('存档已读取');
	}
	function renderSaveList(){
		const container=document.getElementById('saveListContainer');
		const saves=getSaveIndex(); if(saves.length===0){ container.innerHTML='<div style="padding:8px;color:#888;">暂无存档</div>'; return; }
		container.innerHTML=saves.map(id=>{
			const data=getSaveData(id); if(!data)return'';
			const time=new Date(data.timestamp).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
			return `<div class="save-item"><div class="save-info"><span class="save-user">📁存档</span><span class="save-time">${time}</span></div><button onclick="loadGame('${id}')">读档</button><button onclick="deleteSaveData('${id}');renderSaveList();">删除</button></div>`;
		}).join('');
	}

	document.getElementById('dropdownToggle').addEventListener('click',()=>{ const menu=document.getElementById('dropdownMenu'); menu.classList.toggle('show'); renderSaveList(); });
	document.getElementById('btnCreateNewSave').addEventListener('click',saveGame);
	document.addEventListener('click',(e)=>{ if(!e.target.closest('#saveDropdown'))document.getElementById('dropdownMenu').classList.remove('show'); });

	function resetGame(){ initGrid(); gamePhase='digging'; baseHP=100; points=0; waveNumber=0; waveActive=false; waveBreakTimer=0; waveBreakDuration=20; enemies=[]; soldiers=[]; projectiles=[]; selectedCell=null; nukeMode=false; bossEnemy=null; bossBuffLevels={speed:0,health:0,armor:0}; bossSelectionPause=false; updateUI(); }
	function triggerGameOver(){ alert('💀基地已摧毁！游戏重新开始'); resetGame(); }

	initGrid(); requestAnimationFrame(gameLoop); updateSpeedButtons();
</script>
</body>
</html>
