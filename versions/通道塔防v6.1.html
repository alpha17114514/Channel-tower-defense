    function activateOneShot(cell, row, col){ const type=cell.towerType; const dmg=towerEffectiveDmg(type,0); const range=towerEffectiveRange(type,0)*CELL_SIZE; if(type==='dynamite'){ for(const e of enemies.slice()){ if(!e.alive)continue; if(Math.hypot(e.x-(col*CELL_SIZE+12),e.y-(row*CELL_SIZE+12))<range) e.takeDamage(dmg,'explosive'); } spawnParticles(col*CELL_SIZE+12,row*CELL_SIZE+12,'#ffaa00',30); } else if(type==='windWall'){ const flyingEnemies = enemies.filter(e=>e.alive&&e.flying); flyingEnemies.forEach(e=>{ e.alive=false; e.hp=0; e.die(); }); spawnParticles(col*CELL_SIZE+12,row*CELL_SIZE+12,'#88ff88',25); } else if(type==='iceBomb'){ for(const e of enemies.slice()){ if(!e.alive)continue; if(Math.hypot(e.x-(col*CELL_SIZE+12),e.y-(row*CELL_SIZE+12))<range){ e.takeDamage(dmg,'ice'); e.frozen=Math.max(e.frozen,5); } } spawnParticles(col*CELL_SIZE+12,row*CELL_SIZE+12,'#88ccff',30); } if(cell.wasPath) { cell.type='path'; cell.isPath=true; delete cell.wasPath; } else { cell.type='empty'; cell.towerType=null; } }
    function towerAttack(cell,row,col){
        const tx=col*CELL_SIZE+12, ty=row*CELL_SIZE+12, dmg=towerDmg(cell.towerType,cell);
        switch(cell.towerType){

            case'ice': { const range=towerRange('ice',cell)*CELL_SIZE; for(const e of enemies.slice()){ if(!e.alive)continue; if(Math.hypot(e.x-tx,e.y-ty)<range){ e.takeDamage(dmg,'ice',row,col); e.slowed=Math.max(e.slowed,2+cell.atkLvl*0.4); e.slowAmount=Math.max(e.slowAmount,0.3+cell.atkLvl*0.05); if(Math.random()<(0.15+cell.atkLvl*0.02))e.frozen=Math.max(e.frozen,3); } } break; }
            case'fire': case'toxic': { const dir=cell.towerDirection||[0,1]; const len=towerEffectiveRange(cell.towerType, cell.rangeLvl), width=1; for(const e of enemies.slice()){ if(!e.alive)continue; const dx=e.x-tx, dy=e.y-ty; const along=dx*dir[1]+dy*dir[0]; const proj=Math.abs(dx*dir[0]-dy*dir[1]); if(along>0&&along<len*CELL_SIZE&&proj<width*CELL_SIZE*0.7){ if(cell.towerType==='toxic'){ e.poisoned=Math.max(e.poisoned,3); e.poisonDPS=Math.max(e.poisonDPS,5+cell.atkLvl*2); e.poisonStacks=Math.min(5, (e.poisonStacks||0)+1); } else{ e.burning=Math.max(e.burning,2+cell.atkLvl*0.3); e.burnDPS=Math.max(e.burnDPS,4+cell.atkLvl*1.5); } e.takeDamage(dmg, cell.towerType==='toxic'?'poison':'fire',row,col); } } break; }
            case'tesla': { const range=towerRange('tesla',cell)*CELL_SIZE; let best=null,bestD=Infinity; for(const e of enemies.slice()){ if(!e.alive)continue; const d=Math.hypot(e.x-tx,e.y-ty); if(d<range&&d<bestD){bestD=d;best=e;} } if(best){ best.takeDamage(dmg,'lightning',row,col); best.shocked=Math.max(best.shocked,1.5+cell.atkLvl*0.2); for(const e of enemies.slice()){ if(!e.alive||e===best)continue; if(Math.hypot(e.x-best.x,e.y-best.y)<range*0.5)e.takeDamage(dmg*0.4,'lightning'); } } break; }
            case'cannon': { if(enemies.length===0)break; const target=enemies.reduce((a,b)=>(!a||(b.alive&&Math.hypot(b.x-tx,b.y-ty)<Math.hypot(a.x-tx,a.y-ty)))?b:a,null); if(!target||!target.alive)break; const dx=target.x-tx,dy=target.y-ty,dist=Math.hypot(dx,dy); if(dist===0)break; const ux=dx/dist,uy=dy/dist; const beamLength=Math.max(canvas.width,canvas.height)*1.5; projectiles.push({type:'beam',sx:tx,sy:ty,ex:tx+ux*beamLength,ey:ty+uy*beamLength,life:0.28,alive:true,update(dt){this.life-=dt;if(this.life<=0)this.alive=false;},draw(ctx){const alpha=Math.min(1,this.life/0.2);ctx.save();ctx.strokeStyle=`rgba(255,160,40,${0.55*alpha})`;ctx.lineWidth=12;ctx.shadowColor='rgba(255,140,20,0.9)';ctx.shadowBlur=28;ctx.beginPath();ctx.moveTo(this.sx,this.sy);ctx.lineTo(this.ex,this.ey);ctx.stroke();ctx.strokeStyle=`rgba(255,210,90,${0.75*alpha})`;ctx.lineWidth=5;ctx.shadowColor='rgba(255,200,60,0.8)';ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(this.sx,this.sy);ctx.lineTo(this.ex,this.ey);ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${alpha})`;ctx.lineWidth=2;ctx.shadowColor='rgba(255,255,255,0.95)';ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(this.sx,this.sy);ctx.lineTo(this.ex,this.ey);ctx.stroke();ctx.restore();}}); for(const e of enemies.slice()){ if(!e.alive)continue; const ex=e.x-tx,ey=e.y-ty; if(Math.abs(ex*uy-ey*ux)<CELL_SIZE*0.8&&ex*ux+ey*uy>0&&ex*ux+ey*uy<CELL_SIZE*40)e.takeDamage(dmg,'explosive',row,col); } break; }
            case'nuke': { if(enemies.length===0)break; const target=enemies.reduce((a,b)=>(!a||(b.alive&&Math.hypot(b.x-tx,b.y-ty)<Math.hypot(a.x-tx,a.y-ty)))?b:a,null); if(!target||!target.alive)break; const nukeX=target.x, nukeY=target.y; for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){ const nx=Math.round(nukeX/CELL_SIZE)+dc, ny=Math.round(nukeY/CELL_SIZE)+dr; if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS)spawnParticles(nx*CELL_SIZE+12,ny*CELL_SIZE+12,'#ff6600',15); } for(const e of enemies.slice()){ if(!e.alive)continue; if(Math.hypot(e.x-nukeX,e.y-nukeY)<CELL_SIZE*2.5){ e.takeDamage(dmg,'fire',row,col); e.burning=Math.max(e.burning,3); e.burnDPS=Math.max(e.burnDPS,15+cell.atkLvl*2); } } break; }
            case'potion': { const range=towerRange('potion',cell)*CELL_SIZE; for(const e of enemies.slice()){ if(!e.alive)continue; if(Math.hypot(e.x-tx,e.y-ty)<range){ const r=Math.random(); if(r<0.25){ e.slowed=Math.max(e.slowed,4); e.slowAmount=Math.max(e.slowAmount,0.6); } else if(r<0.5){ e.poisoned=Math.max(e.poisoned,5); e.poisonDPS=Math.max(e.poisonDPS,8); e.poisonStacks=Math.min(5,(e.poisonStacks||0)+2); } else if(r<0.75){ e.burning=Math.max(e.burning,3); e.burnDPS=Math.max(e.burnDPS,10); } else{ e.frozen=Math.max(e.frozen,2); } e.takeDamage(dmg,'poison',row,col); } } break; }

        }
    }

    function getWavePattern(wn){
        if(wn<=7){ return [[{type:'zombie',count:2,level:1,interval:2.0}],[{type:'zombie',count:2,level:1,interval:1.8},{type:'slime',count:1,level:1,interval:2.5}],[{type:'zombie',count:3,level:2,interval:1.5},{type:'slime',count:2,level:2,interval:2.0},{type:'runner',count:1,level:2,interval:3.0}],[{type:'runner',count:2,level:3,interval:1.8},{type:'slime',count:2,level:3,interval:2.0},{type:'zombie',count:3,level:3,interval:2.2}],[{type:'flesh_mountain',count:1,level:4,interval:5.0},{type:'healer',count:1,level:4,interval:4.5}],[{type:'ghost',count:1,level:5,interval:4.0},{type:'drone',count:1,level:5,interval:4.0}],[{type:'flesh_mountain',count:1,level:6,interval:4.0},{type:'airship',count:1,level:6,interval:3.5}]][wn-1]; }
        let mult = 1; let intervalMult = 1;
        if(wn>=50){ mult = 3; intervalMult = 0.4; } // 极限出怪模式
        else if(wn>=40){ mult = 2; intervalMult = 0.6; }
        else if(wn>=30){ mult = 1.5; intervalMult = 0.8; }
        const base=[{type:'zombie',count:Math.floor((4+Math.floor(wn*0.5))*mult),level:Math.min(MAX_LEVEL,10+wn),interval:0.7*intervalMult},{type:'slime',count:Math.floor((3+Math.floor(wn*0.4))*mult),level:Math.min(MAX_LEVEL,9+wn),interval:1.2*intervalMult},{type:'runner',count:Math.floor((2+Math.floor(wn*0.4))*mult),level:Math.min(MAX_LEVEL,8+wn),interval:0.9*intervalMult},{type:'tankmaster',count:Math.floor((1+Math.floor(wn*0.15))*mult),level:Math.min(MAX_LEVEL,10+wn),interval:4.5*intervalMult},{type:'exploder',count:Math.floor((2+Math.floor(wn/3))*mult),level:Math.min(MAX_LEVEL,8+wn),interval:2.0*intervalMult}];
        if(wn%50===0) base.push({type:'boss_jiawei',count:1,level:Math.min(MAX_LEVEL,wn+20),interval:0.1});
        if(wn%20===0) base.push({type:'boss',count:1,level:Math.min(MAX_LEVEL,wn+15),interval:0.1});
        if(globalPenalties.extraBossChance>0 && Math.random()<globalPenalties.extraBossChance*0.1) base.push({type:'boss',count:1,level:Math.min(MAX_LEVEL,wn+10),interval:2.0});
        if(wn>=8){ const supers=['super_zombie','super_slime','super_runner','super_flesh','super_ghost','super_drone','super_airship','super_healer','super_shocker','super_tank','super_exploder']; base.push({type:supers[Math.floor(Math.random()*supers.length)],count:Math.floor((1+Math.floor((wn-8)/3))*mult),level:Math.min(MAX_LEVEL,wn+3),interval:3.0*intervalMult}); }
        if(wn>=15){ const ults=['ultimate_zombie','ultimate_slime','ultimate_runner','ultimate_flesh','ultimate_ghost','ultimate_drone','ultimate_airship','ultimate_healer','ultimate_shocker','ultimate_tank']; base.push({type:ults[Math.floor(Math.random()*ults.length)],count:Math.floor((Math.min(2,1+Math.floor((wn-15)/5)))*mult),level:Math.min(MAX_LEVEL,wn+8),interval:4.0*intervalMult}); }
        if(wn>=6){ const news=['thief','summoner','splitter','shielder','teleporter','reflector']; base.push({type:news[Math.floor(Math.random()*news.length)],count:Math.floor((1+Math.floor((wn-6)/3))*mult),level:Math.min(MAX_LEVEL,wn+5),interval:2.5*intervalMult}); }
        return base;
    }
    function startNextWave(){ waveNumber++; waveActive=true; waveBreakTimer=0; const p=getWavePattern(waveNumber); waveSpawnQueue=[]; for(const g of p){ for(let i=0;i<g.count;i++)waveSpawnQueue.push({type:g.type,level:g.level,spawnDelay:i*g.interval}); } waveSpawnQueue.sort((a,b)=>a.spawnDelay-b.spawnDelay); waveSpawnTimer=0; for(const g of p){ if(!unlockedEnemyTypes.has(g.type)){ unlockedEnemyTypes.add(g.type); pendingEnemyIntro={type:g.type,level:g.level}; } } if(pendingEnemyIntro){ showEnemyIntro(pendingEnemyIntro.type,pendingEnemyIntro.level); introPause=true; } updateUI(); }
    function processWaveSpawning(dt){ if(!waveActive||introPause||bossSelectionPause)return; waveSpawnTimer+=dt; while(waveSpawnQueue.length&&waveSpawnQueue[0].spawnDelay<=waveSpawnTimer){ const s=waveSpawnQueue.shift(); enemies.push(new Enemy(s.type,s.level)); } if(waveSpawnQueue.length===0&&enemies.filter(e=>e.alive&&!e.reachedEnd).length===0&&waveActive)endWave(); }
    function endWave(){ waveActive=false; waveBreakTimer=waveBreakDuration; let pts = Math.floor((waveNumber*20+30)*(1-globalPenalties.pointReduction*0.1)); clampPoints(pts); updateUI(); }
    function processWaveBreak(dt){ if(waveActive||bossSelectionPause)return; if(waveBreakTimer>0){ waveBreakTimer-=dt; if(waveBreakTimer<=0){waveBreakTimer=0; startNextWave();} } }
    function skipWaveBreak(){ if(gamePhase==='defense'&&!waveActive&&waveBreakTimer>0&&!bossSelectionPause)waveBreakTimer=0.01; }
    function toggleQuickUpgrade(){ quickUpgradeMode=!quickUpgradeMode; document.getElementById('btn-quick-upgrade').classList.toggle('active-mode',quickUpgradeMode); updateUI(); }

    let lastTime=performance.now();
    function gameLoop(ts){ let dt=(ts-lastTime)/1000; if(dt<=0)dt=0.016; if(dt>0.3)dt=0.3; dt*=gameSpeed; lastTime=ts; if(gamePhase==='defense'){ processWaveBreak(dt); if(waveActive)processWaveSpawning(dt); processTowers(dt); processObstacles(dt); for(const e of enemies) if(e.alive||e.reachedEnd) e.update(dt); enemies=enemies.filter(e=>e.alive||(e.reachedEnd&&e.removeTimer>0)); for(const s of soldiers)s.update(dt); soldiers=soldiers.filter(s=>s.alive); for(const p of projectiles)p.update(dt); projectiles=projectiles.filter(p=>p.alive); for(const p of particles){ p.life-=dt; if(p.life<=0)continue; p.x+=p.vx*dt; p.y+=p.vy*dt; } particles=particles.filter(p=>p.life>0); } updateUI(); render(); requestAnimationFrame(gameLoop); }

    function drawTowerRange(cell,row,col){ const tx=col*CELL_SIZE+12, ty=row*CELL_SIZE+12; const type=cell.towerType; ctx.save(); ctx.globalAlpha=0.45; ctx.setLineDash([6,4]); ctx.lineWidth=2; switch(type){ case'arrow': ctx.strokeStyle='rgba(255,255,180,0.7)'; ctx.beginPath(); ctx.moveTo(tx,0); ctx.lineTo(tx,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,ty); ctx.lineTo(canvas.width,ty); ctx.stroke(); break; case'ice': case'tesla': case'potion': case'storm': case'dynamite': case'iceBomb': { const range=towerEffectiveRange(type,cell.rangeLvl)*CELL_SIZE; ctx.strokeStyle='rgba(120,200,255,0.7)'; ctx.beginPath(); ctx.arc(tx,ty,range,0,Math.PI*2); ctx.fill(); ctx.stroke(); break; } case'fire': case'toxic': { const dir=cell.towerDirection||[0,1]; const angle=Math.atan2(dir[0],dir[1]); const len=towerEffectiveRange(type,cell.rangeLvl)*CELL_SIZE; const halfAngle=Math.PI/5; ctx.strokeStyle='rgba(255,100,40,0.7)'; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.arc(tx,ty,len,angle-halfAngle,angle+halfAngle); ctx.closePath(); ctx.fill(); ctx.stroke(); break; } case'cannon':{ let aimX=tx+CELL_SIZE*30,aimY=ty; ctx.strokeStyle='rgba(255,150,50,0.55)'; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(aimX,aimY); ctx.stroke(); break; } case'nuke':{ const range=CELL_SIZE*2.5; ctx.strokeStyle='rgba(255,60,60,0.65)'; ctx.beginPath(); ctx.arc(tx,ty,range,0,Math.PI*2); ctx.fill(); ctx.stroke(); break; } } ctx.restore(); }
    function render(){
        ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#1c1c24'; ctx.fillRect(0,0,canvas.width,canvas.height);
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const cell=grid[r][c], x=c*CELL_SIZE, y=r*CELL_SIZE; if(cell.type==='obstacle'){ ctx.fillStyle='#3a3028'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); ctx.fillStyle='#ddd'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText(OBSTACLE_TYPES[cell.obstacleType]?.icon||'?',x+12,y+16); } else if(cell.type==='tower'){ ctx.fillStyle='#2a2a38'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); ctx.fillStyle='#f0c040'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText(TOWER_TYPES[cell.towerType]?.icon||'?',x+12,y+16); if(cell.stunned>0){ ctx.fillStyle='rgba(255,255,0,0.5)'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); } if(cell.overloadTimer>0){ ctx.fillStyle='rgba(255,0,0,0.4)'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); } } else if(cell.isPath){ ctx.fillStyle='#5c4033'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); } else{ ctx.fillStyle='#1e1e28'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2); } }
        if(gamePhase==='defense'&&selectedCell){ const cell=grid[selectedCell.row][selectedCell.col]; if(cell&&cell.type==='tower'){ drawTowerRange(cell,selectedCell.row,selectedCell.col); const sx=selectedCell.col*CELL_SIZE, sy=selectedCell.row*CELL_SIZE; ctx.strokeStyle='#f0c040'; ctx.lineWidth=3; ctx.setLineDash([3,2]); ctx.strokeRect(sx+2,sy+2,CELL_SIZE-4,CELL_SIZE-4); ctx.setLineDash([]); } }
        if(quickUpgradeMode&&selectionStartRow>=0&&selectionEndRow>=0){ const x1=Math.min(selectionStartCol,selectionEndCol)*CELL_SIZE, y1=Math.min(selectionStartRow,selectionEndRow)*CELL_SIZE; const x2=(Math.max(selectionStartCol,selectionEndCol)+1)*CELL_SIZE, y2=(Math.max(selectionStartRow,selectionEndRow)+1)*CELL_SIZE; ctx.save(); ctx.globalAlpha=0.4; ctx.fillStyle='rgba(255,160,40,0.3)'; ctx.fillRect(x1,y1,x2-x1,y2-y1); ctx.strokeStyle='#ff8800'; ctx.lineWidth=3; ctx.setLineDash([5,3]); ctx.strokeRect(x1,y1,x2-x1,y2-y1); ctx.restore(); }
        for(const e of enemies) e.draw(ctx); for(const s of soldiers) s.draw(ctx); for(const p of projectiles) p.draw(ctx);
        for(const p of particles){ if(p.life<=0)continue; const alpha=p.life/p.maxLife; ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size||2,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1;
        if(bossEnemy&&bossEnemy.alive){ const barWidth=200, barHeight=18, barX=canvas.width/2-barWidth/2, barY=10; ctx.fillStyle='#333'; ctx.fillRect(barX,barY,barWidth,barHeight); const hpRatio=bossEnemy.hp/bossEnemy.maxHP; ctx.fillStyle=hpRatio>0.5?'#ff4444':hpRatio>0.25?'#ff8800':'#ff0000'; ctx.fillRect(barX,barY,barWidth*hpRatio,barHeight); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(barX,barY,barWidth,barHeight); ctx.fillStyle='#ffffff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(`${bossEnemy.name} ${Math.floor(bossEnemy.hp)}/${bossEnemy.maxHP}`, canvas.width/2, barY+10); }
        ctx.save(); ctx.fillStyle='#4caf50'; ctx.fillRect(START_COL*CELL_SIZE+1,START_ROW*CELL_SIZE+1,CELL_SIZE-2,CELL_SIZE-2); ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.shadowColor='#000'; ctx.shadowBlur=3; ctx.fillText('入',START_COL*CELL_SIZE+12,START_ROW*CELL_SIZE+12); ctx.fillStyle='#f44336'; ctx.fillRect(END_COL*CELL_SIZE+1,END_ROW*CELL_SIZE+1,CELL_SIZE-2,CELL_SIZE-2); ctx.fillText('基',END_COL*CELL_SIZE+12,END_ROW*CELL_SIZE+12); ctx.restore();
    }
    function updateUI(){ document.getElementById('info-hp').textContent=Math.floor(baseHP); document.getElementById('info-points').textContent=Math.floor(points); document.getElementById('info-crystals').textContent=crystals; document.getElementById('info-phase').textContent=gamePhase==='digging'?'挖掘':'防御'; document.getElementById('info-wave').textContent=gamePhase==='defense'?`第${waveNumber}波`:'准备中'; document.getElementById('info-timer').textContent=(gamePhase==='defense'&&!waveActive&&waveBreakTimer>0&&!bossSelectionPause)?Math.ceil(waveBreakTimer)+'s':'-'; document.getElementById('skip-wave-btn').style.display=(gamePhase==='defense'&&!waveActive&&waveBreakTimer>0&&!bossSelectionPause)?'inline-block':'none'; let buffText=''; if(bossBuffLevels.speed>0)buffText+=`💨${bossBuffLevels.speed} `; if(bossBuffLevels.health>0)buffText+=`❤️${bossBuffLevels.health} `; if(bossBuffLevels.armor>0)buffText+=`🛡️${bossBuffLevels.armor} `; if(globalPenalties.damageReduction>0)buffText+=`🛡️减伤${globalPenalties.damageReduction*5}% `; if(globalPenalties.pointReduction>0)buffText+=`💰收益-${globalPenalties.pointReduction*10}% `; if(globalPenalties.extraBossChance>0)buffText+=`👾BOSS+${globalPenalties.extraBossChance*10}% `; document.getElementById('info-boss-buffs').textContent=buffText?'全局:'+buffText:''; }
    function placeItem(row,col,type,category){ const cell=grid[row][col]; if(category==='tower'){ const t=TOWER_TYPES[type]; if(!t)return; if(t.isSpecial && !isTowerUnlocked(type)) return; if(t.isOneShot){ if(cell.type!=='empty' && !cell.isPath) return; if(cell.type==='obstacle') return; } else { if(cell.type!=='empty'||cell.isPath) return; } if(t.crystalCost){ if(crystals>=t.crystalCost) crystals-=t.crystalCost; else return; } else if(t.cost>0){ if(points>=t.cost) points-=t.cost; else return; } if(t.isOneShot){ cell.type='tower'; cell.towerType=type; cell.towerLevel=1; cell.atkLvl=0; cell.cdLvl=0; cell.rangeLvl=0; cell.overloadTimer=0; if(cell.isPath) cell.wasPath=true; } else { cell.type='tower'; cell.towerType=type; cell.towerLevel=1; cell.atkLvl=0; cell.cdLvl=0; cell.rangeLvl=0; cell.overloadTimer=0; if(type==='fire'||type==='toxic'){ const nb=getPathNeighbors(row,col); cell.towerDirection=nb.length?[nb[0][0]-row,nb[0][1]-col]:[0,1]; } } } else { if(!cell.isPath||cell.type==='obstacle'||cell.type==='tower')return; const cost=obsCost(type); if(points<cost)return; points-=cost; cell.type='obstacle'; cell.obstacleType=type; cell.obstacleLevel=1; if(type==='stone'){ cell.obstacleMaxHP=300; cell.obstacleHP=300; } else if(type==='cactus'){ cell.obstacleMaxHP=50; cell.obstacleHP=50; } } updateUI(); }

    function quickUpgradeInRect(r1,c1,r2,c2){ const minR=Math.min(r1,r2), maxR=Math.max(r1,r2); const minC=Math.min(c1,c2), maxC=Math.max(c1,c2); let totalCost=0, upgraded=0; for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){ const cell=grid[r][c]; if(cell.type==='tower'){ const t=TOWER_TYPES[cell.towerType]; if(t&&t.fields){ if(cell.atkLvl<MAX_TOWER_LVL) totalCost+=Math.floor((cell.atkLvl+1)*8+10); if(cell.cdLvl<MAX_TOWER_LVL) totalCost+=Math.floor((cell.cdLvl+1)*8+10); if(cell.rangeLvl<MAX_TOWER_LVL) totalCost+=Math.floor((cell.rangeLvl+1)*8+10); } else if(!t.noUpgrade&&cell.towerLevel<MAX_TOWER_LVL) totalCost+=Math.floor((cell.towerLevel+1)*8+10); } } if(totalCost===0)return; if(points<totalCost){ alert(`点数不足！需要${totalCost}pt`); return; } points-=totalCost; for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){ const cell=grid[r][c]; if(cell.type==='tower'){ const t=TOWER_TYPES[cell.towerType]; if(t&&t.fields){ if(cell.atkLvl<MAX_TOWER_LVL){ cell.atkLvl++; upgraded++; } if(cell.cdLvl<MAX_TOWER_LVL){ cell.cdLvl++; upgraded++; } if(cell.rangeLvl<MAX_TOWER_LVL){ cell.rangeLvl++; upgraded++; } } else if(!t.noUpgrade&&cell.towerLevel<MAX_TOWER_LVL){ cell.towerLevel++; upgraded++; } } } alert(`✅ 升级${upgraded}座炮塔，花费${totalCost}pt`); updateUI(); }
    function showBossPenaltySelection(count=4){ bossSelectionPause=true; const penalties=[ {icon:'💨',name:'风驰电掣',desc:'所有敌人速度永久+10%',apply:()=>{bossBuffLevels.speed++;}}, {icon:'❤️',name:'生机勃勃',desc:'所有敌人生命值永久+20%',apply:()=>{bossBuffLevels.health++;}}, {icon:'🛡️',name:'铜墙铁壁',desc:'所有敌人护甲永久+2',apply:()=>{bossBuffLevels.armor++;}}, {icon:'💥',name:'断壁残垣',desc:'随机摧毁1/4炮塔',apply:()=>{destroyRandomTowers(0.25);}}, {icon:'💰',name:'囊中羞涩',desc:'损失当前点数的25%',apply:()=>{points=Math.floor(points*0.75);updateUI();}}, {icon:'⚡',name:'天旋地转',desc:'所有炮塔眩晕5秒',apply:()=>{stunAllTowers(5);}}, {icon:'🌀',name:'兵临城下',desc:'传送3个敌人到基地旁',apply:()=>{teleportEnemiesNearBase(3);}}, {icon:'🩸',name:'生灵涂炭',desc:'基地损失25点生命',apply:()=>{baseHP=Math.max(0,baseHP-25);if(baseHP<=0)triggerGameOver();}}, {icon:'🕒',name:'度日如年',desc:'波次间隔+10秒',apply:()=>{waveBreakDuration+=10;}}, {icon:'💎',name:'宝石流失',desc:'失去所有水晶',apply:()=>{crystals=0;}}, {icon:'📉',name:'降级打击',desc:'随机5座炮塔降1级',apply:()=>{downgradeRandomTowers(5);}}, {icon:'🔥',name:'基地灼烧',desc:'基地每秒损失2点生命持续15秒',apply:()=>{startBaseBurn(15);}}, {icon:'👾',name:'敌潮汹涌',desc:'下一波敌人数量翻倍',apply:()=>{doubleNextWave();}}, {icon:'⚰️',name:'矿场崩塌',desc:'所有水晶矿场被摧毁',apply:()=>{destroyAllMines();}}, {icon:'💰',name:'财政紧缩',desc:'击杀金币收益永久-10%',apply:()=>{globalPenalties.pointReduction++;}}, {icon:'👹',name:'Boss连连',desc:'每波额外生成BOSS概率+10%',apply:()=>{globalPenalties.extraBossChance++;}}, {icon:'🛡️',name:'皮糙肉厚',desc:'所有敌人伤害减免+5%',apply:()=>{globalPenalties.damageReduction++;}}, {icon:'🌀',name:'免疫回路',desc:'怪物对连续同类伤害获得短暂减免',apply:()=>{globalPenalties.typeResist++;}} ]; const sel=penalties.sort(()=>Math.random()-0.5).slice(0,count); let html='<div class="modal-overlay"><div class="modal"><h3>👾 Boss被击败！选择惩罚</h3>'; sel.forEach((p,i)=>{ html+=`<div class="buff-card" onclick="window.applyPenalty(${i})">${p.icon}<br><b>${p.name}</b><br><small>${p.desc}</small></div>`; }); html+='</div></div>'; document.getElementById('modalContainer').innerHTML=html; window._pendingPenalties=sel; }

    function destroyRandomTowers(f){ const ts=[]; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].type==='tower')ts.push([r,c]); const cnt=Math.floor(ts.length*f); for(let i=0;i<cnt;i++){ if(!ts.length)break; const idx=Math.floor(Math.random()*ts.length); const [r,c]=ts.splice(idx,1)[0]; grid[r][c].type='empty'; } }

    function getCanvasCoords(e){ const rect=canvas.getBoundingClientRect(); let cx,cy; if(e.touches){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; } else{ cx=e.clientX; cy=e.clientY; } return {x:cx-rect.left,y:cy-rect.top}; }
    function handleDown(e){ e.preventDefault(); const {x,y}=getCanvasCoords(e); mouseDown=true; mouseCanvasX=x; mouseCanvasY=y; mouseCol=Math.floor(x/CELL_SIZE); mouseRow=Math.floor(y/CELL_SIZE); lastTouchDist=0; if(quickUpgradeMode&&gamePhase==='defense'){ selectionStartRow=mouseRow; selectionStartCol=mouseCol; selectionEndRow=mouseRow; selectionEndCol=mouseCol; } else if(gamePhase==='digging'&&mouseRow>=0&&mouseRow<ROWS&&mouseCol>=0&&mouseCol<COLS){ if(digCell(mouseRow,mouseCol)&&checkStartEndConnected())startDefensePhase(); updateUI(); } }

    canvas.addEventListener('mouseleave',()=>{ mouseDown=false; }); canvas.addEventListener('touchstart',handleDown,{passive:false}); canvas.addEventListener('touchmove',handleMove,{passive:false}); canvas.addEventListener('touchend',handleUp); canvas.addEventListener('touchcancel',handleUp);

    function showConstructionMenu(mx,my,row,col){ const cell=grid[row][col]; const menu=document.getElementById('context-menu'); menu.innerHTML=''; if(cell.type==='empty'|| (cell.isPath&&cell.type==='path')){ Object.keys(TOWER_TYPES).forEach(t=>{ const td=TOWER_TYPES[t]; if(td.isOneShot || isTowerUnlocked(t)){ let costHtml=''; if(td.crystalCost) costHtml=`<span class="crystal-cost">💎${td.crystalCost}</span>`; else if(td.cost>0) costHtml=`<span class="cost">${td.cost}pt</span>`; menu.innerHTML+=`<div class="menu-item" onclick="placeItem(${row},${col},'${t}','tower');closeMenu()"><span>${td.icon}${td.name}</span>${costHtml}</div>`; } }); if(cell.isPath) { Object.keys(OBSTACLE_TYPES).forEach(t=>{ menu.innerHTML+=`<div class="menu-item" onclick="placeItem(${row},${col},'${t}','obstacle');closeMenu()"><span>${OBSTACLE_TYPES[t].icon}${OBSTACLE_TYPES[t].name}</span><span class="cost">${obsCost(t)}pt</span></div>`; }); } } menu.style.display='block'; menu.style.left=Math.min(mx,window.innerWidth-180)+'px'; menu.style.top=Math.min(my,window.innerHeight-300)+'px'; }
    function showBuildingMenu(mx,my,row,col){ const cell=grid[row][col]; const menu=document.getElementById('context-menu'); menu.innerHTML=''; if(cell.type==='tower'){ const t=TOWER_TYPES[cell.towerType]; if(!t||t.isOneShot) return; if(t.noUpgrade) return; if(t.fields){ const atkCost=Math.floor((cell.atkLvl+1)*8+10), cdCost=Math.floor((cell.cdLvl+1)*8+10), rangeCost=Math.floor((cell.rangeLvl+1)*8+10); const canUpAtk=cell.atkLvl<MAX_TOWER_LVL, canUpCd=cell.cdLvl<MAX_TOWER_LVL, canUpRange=cell.rangeLvl<MAX_TOWER_LVL; menu.innerHTML+=`<div style="padding:6px;color:#f0c040;font-size:0.75em;">⚔️${towerDmg(cell.towerType,cell)} ⏱${towerCD(cell.towerType,cell).toFixed(2)}s 🔭${towerRange(cell.towerType,cell)}</div>`; if(canUpAtk) menu.innerHTML+=`<div class="menu-item" onclick="if(points>=${atkCost}){points-=${atkCost};grid[${row}][${col}].atkLvl++;closeMenu();updateUI();}"><span>⬆攻击力 +${t.dmgPerLvl}</span><span class="cost">${atkCost}pt</span></div>`; if(canUpCd) menu.innerHTML+=`<div class="menu-item" onclick="if(points>=${cdCost}){points-=${cdCost};grid[${row}][${col}].cdLvl++;closeMenu();updateUI();}"><span>⏱冷却 -${t.cdPerLvl.toFixed(2)}</span><span class="cost">${cdCost}pt</span></div>`; if(canUpRange) menu.innerHTML+=`<div class="menu-item" onclick="if(points>=${rangeCost}){points-=${rangeCost};grid[${row}][${col}].rangeLvl++;closeMenu();updateUI();}"><span>🔭范围 +${t.rangePerLvl||0}</span><span class="cost">${rangeCost}pt</span></div>`; } else{ const upCost=Math.floor((cell.towerLevel+1)*8+10); const refund=Math.floor((t.cost||0)*0.3*cell.towerLevel); if(cell.towerLevel<MAX_TOWER_LVL) menu.innerHTML+=`<div class="menu-item" onclick="if(points>=${upCost}){points-=${upCost};grid[${row}][${col}].towerLevel++;closeMenu();updateUI();}"><span>⬆升级</span><span class="cost">${upCost}pt</span></div>`; menu.innerHTML+=`<div class="menu-item" onclick="points+=${refund};grid[${row}][${col}].type='empty';closeMenu();updateUI();"><span>🗑铲除</span><span class="cost">+${refund}pt</span>     function saveGame(){ const saveId=Date.now().toString(36)+Math.random().toString(36).substring(2,6); const data={ gameState:{ gamePhase,baseHP,points,crystals,waveNumber,waveActive,waveBreakTimer,waveBreakDuration, grid:grid.map(r=>r.map(c=>({...c}))), waveSpawnQueue,waveSpawnTimer,achievementData,bossBuffLevels,globalPenalties }, timestamp:Date.now() }; setSaveData(saveId,data); renderSaveList(); alert('存档已保存'); }
    function loadGame(saveId){ const data=getSaveData(saveId); if(!data)return; const gs=data.gameState; gamePhase=gs.gamePhase; baseHP=gs.baseHP; points=Math.min(gs.points,MAX_POINTS); crystals=gs.crystals||0; waveNumber=gs.waveNumber; waveActive=gs.waveActive; waveBreakTimer=gs.waveBreakTimer; waveBreakDuration=gs.waveBreakDuration||20; waveSpawnQueue=gs.waveSpawnQueue||[]; waveSpawnTimer=gs.waveSpawnTimer||0; bossBuffLevels=gs.bossBuffLevels||{speed:0,health:0,armor:0}; globalPenalties=gs.globalPenalties||{damageReduction:0,pointReduction:0,extraBossChance:0,typeResist:0}; if(gs.grid)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)Object.assign(grid[r][c],gs.grid[r][c]); enemies=[]; soldiers=[]; projectiles=[]; particles=[]; bossEnemy=null; if(gamePhase==='defense'){ if(!checkStartEndConnected()||!computePathOrder()){ alert('存档路径损坏'); resetGame(); return; } } updateUI(); renderSaveList(); alert('存档已读取'); }
    function renderSaveList(){ const container=document.getElementById('saveListContainer'); const saves=getSaveIndex(); if(saves.length===0){ container.innerHTML='<div style="padding:8px;color:#888;">暂无存档</div>'; return; } container.innerHTML=saves.map(id=>{ const data=getSaveData(id); if(!data)return''; const time=new Date(data.timestamp).toLocaleString(); return `<div class="save-item"><div class="save-info"><span class="save-user">📁存档</span><span class="save-time">${time}</span></div><button onclick="loadGame('${id}')">读档</button><button onclick="deleteSaveData('${id}');renderSaveList();">删除</button></div>`; }).join(''); }
    document.getElementById('dropdownToggle').addEventListener('click',()=>{ document.getElementById('dropdownMenu').classList.toggle('show'); renderSaveList(); });
    document.getElementById('btnCreateNewSave').addEventListener('click',saveGame);
    document.addEventListener('click',(e)=>{ if(!e.target.closest('#saveDropdown'))document.getElementById('dropdownMenu').classList.remove('show'); });
    function resetGame(){ initGrid(); gamePhase='digging'; baseHP=100; points=0; crystals=0; waveNumber=0; waveActive=false; waveBreakTimer=0; waveBreakDuration=20; enemies=[]; soldiers=[]; projectiles=[]; selectedCell=null; bossEnemy=null; bossBuffLevels={speed:0,health:0,armor:0}; globalPenalties={damageReduction:0,pointReduction:0,extraBossChance:0,typeResist:0}; bossSelectionPause=false; updateUI(); }
    function triggerGameOver(){ if(grid.some(r=>r.some(c=>c.towerType==='totem'))){ for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].towerType==='totem'){ grid[r][c].type='empty'; baseHP=1; alert('🗿不死图腾生效！基地免于一死'); updateUI(); return; } } alert('💀基地已摧毁！游戏重新开始'); resetGame(); }
    initGrid(); requestAnimationFrame(gameLoop); updateSpeedButtons();
</script>
</body>
